<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<text x="70" y="72" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#111827">Figure 5 | From rerun to lineage-level semantic repair</text>
<text x="70" y="112" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#4b5563">Repair targets an addressable affected closure, not the whole stochastic run.</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs><text x="70" y="170" font-family="Arial" font-size="20" font-weight="700">a  Control surfaces</text><rect x="90" y="205" width="250" height="105" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="112" y="243" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">R5-I</text>
<text x="112" y="277" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">diagnose reader</text><line x1="340" y1="257" x2="410" y2="257" stroke="#374151" stroke-width="3" marker-end="url(#a)"/><rect x="410" y="205" width="250" height="105" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="432" y="243" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">R6</text>
<text x="432" y="277" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">localize lineage</text><line x1="660" y1="257" x2="730" y2="257" stroke="#374151" stroke-width="3" marker-end="url(#a)"/><rect x="730" y="205" width="250" height="105" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="752" y="243" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">R7-P</text>
<text x="752" y="277" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">reader correction</text><line x1="980" y1="257" x2="1050" y2="257" stroke="#374151" stroke-width="3" marker-end="url(#a)"/><rect x="1050" y="205" width="300" height="105" rx="18" fill="#eef2ff" stroke="#9ca3af" stroke-width="2"/>
<text x="1072" y="243" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">R7-S</text>
<text x="1072" y="277" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">internal lineage repair</text><text x="70" y="395" font-family="Arial" font-size="20" font-weight="700">b  Two repair outcomes</text><rect x="90" y="435" width="390" height="145" rx="18" fill="#fff7ed" stroke="#9ca3af" stroke-width="2"/>
<text x="112" y="473" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Material recomposition</text>
<text x="112" y="507" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">1 invalidated ref; 8 reopened calls; 35 recomputed descendants</text><rect x="570" y="435" width="390" height="145" rx="18" fill="#ecfdf5" stroke="#9ca3af" stroke-width="2"/>
<text x="592" y="473" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Reconvergence</text>
<text x="592" y="507" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">8 reopened calls; 28 recomputed descendants; same broad endpoint</text><text x="1030" y="450" font-family="Arial" font-size="24" font-weight="700">4-case closure</text>
<text x="1030" y="495" font-family="Arial" font-size="19">4/4 compatible state preserved</text>
<text x="1030" y="530" font-family="Arial" font-size="19">2/4 material divergence</text>
<text x="1030" y="565" font-family="Arial" font-size="19">2/4 compatible reconvergence</text><text x="70" y="690" font-family="Arial" font-size="20" font-weight="700">c  Bounded repair loop</text><rect x="90" y="725" width="230" height="95" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="112" y="763" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Content address</text>
<text x="112" y="797" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">target lineage</text><line x1="320" y1="772" x2="380" y2="772" stroke="#374151" stroke-width="3" marker-end="url(#a)"/><rect x="380" y="725" width="230" height="95" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="402" y="763" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Closure gate</text>
<text x="402" y="797" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">complete?</text><line x1="610" y1="772" x2="670" y2="772" stroke="#374151" stroke-width="3" marker-end="url(#a)"/><rect x="670" y="725" width="240" height="95" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="692" y="763" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Selective recompute</text>
<text x="692" y="797" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">dependents only</text><line x1="910" y1="772" x2="970" y2="772" stroke="#374151" stroke-width="3" marker-end="url(#a)"/><rect x="970" y="725" width="220" height="95" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="992" y="763" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Preserve</text>
<text x="992" y="797" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">compatible state</text><line x1="1190" y1="772" x2="1250" y2="772" stroke="#374151" stroke-width="3" marker-end="url(#a)"/><rect x="1250" y="725" width="230" height="95" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="1272" y="763" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Re-entry watch</text>
<text x="1272" y="797" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">old authority</text></svg>