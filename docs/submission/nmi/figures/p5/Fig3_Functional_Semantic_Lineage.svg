<text x="1102" y="248" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Action</text>
<text x="1102" y="282" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">execution gate</text><text x="70" y="405" font-family="Arial" font-size="20" font-weight="700">b  Two downstream paths</text><rect x="90" y="445" width="330" height="120" rx="18" fill="#ecfdf5" stroke="#9ca3af" stroke-width="2"/>
<text x="112" y="483" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Healthy continuation</text>
<text x="112" y="517" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">uncertainty remains visible</text><line x1="420" y1="505" x2="520" y2="505" stroke="#374151" stroke-width="3" marker-end="url(#a)"/><rect x="520" y="445" width="350" height="120" rx="18" fill="#ecfdf5" stroke="#9ca3af" stroke-width="2"/>
