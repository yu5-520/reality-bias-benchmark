<text x="542" y="517" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">or fresh independent re-anchor</text><rect x="90" y="625" width="330" height="120" rx="18" fill="#fee2e2" stroke="#9ca3af" stroke-width="2"/>
<text x="112" y="663" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Permission penetration</text>
<text x="112" y="697" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">uncertainty detaches</text><line x1="420" y1="685" x2="520" y2="685" stroke="#374151" stroke-width="3" marker-end="url(#a)"/><rect x="520" y="625" width="350" height="120" rx="18" fill="#fee2e2" stroke="#9ca3af" stroke-width="2"/>
<text x="542" y="663" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Operational premise</text>
<text x="542" y="697" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">authority rises without support</text><text x="970" y="500" font-family="Arial" font-size="28" font-weight="700" fill="#111827">Propagation ≠ permission penetration</text>
<text x="970" y="545" font-family="Arial" font-size="19" fill="#4b5563">Functional continuation is broader than Dynamic C.</text>
<text x="970" y="585" font-family="Arial" font-size="19" fill="#4b5563">Different agents do not turn descendants of one source into independent evidence.</text></svg>