<text x="532" y="447" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">authority rises → operational premise</text><line x1="940" y1="265" x2="1080" y2="265" stroke="#374151" stroke-width="3" marker-end="url(#a)"/><line x1="940" y1="445" x2="1080" y2="445" stroke="#374151" stroke-width="3" marker-end="url(#a)"/><rect x="1080" y="245" width="370" height="140" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="1102" y="283" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#111827">Endpoint</text>
<text x="1102" y="317" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#374151">same or similarly plausible</text><text x="70" y="600" font-family="Arial" font-size="20" font-weight="700">b  Observation-to-control stack</text><rect x="90" y="635" width="190" height="95" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
