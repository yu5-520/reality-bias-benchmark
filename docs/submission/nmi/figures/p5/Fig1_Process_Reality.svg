<text x="70" y="72" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#111827">Figure 1 | Process reality between input and outcome</text>
<text x="70" y="112" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#4b5563">Endpoint equality does not guarantee process equality.</text>
