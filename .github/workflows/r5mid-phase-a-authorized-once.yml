name: R5-MID Phase-A Authorized Once

on:
  push:
    paths:
      - 'manifests/r5mid_phase_a_paid_authorization_2026-09-16.json'

concurrency:
  group: r5mid-phase-a-authorized-once
  cancel-in-progress: false

permissions:
  contents: read

env:
  AUTH_MANIFEST: manifests/r5mid_phase_a_paid_authorization_2026-09-16.json
  EXPECTED_AUTH_SHA256: 51c7fb80ee91bbd9460287d11ea8bb5fb31749a8d14ae4fd78dfba377ccf421b
  R5MID_FIRST_BATCH_FREEZE: manifests/r5mid_first_v4_subject_batch_v0.1.json
  R5R6_REPEATS: '2'
  R5R6_PROVIDER: deepseek
  R5R6_MODEL_CONFIG: arena/config/model_deepseek_v0.2.json
  R5R6_SPENDING_CEILING: '1'
  R5R6_CURRENCY: USD
  R5R6_MAX_SUBJECT_CALLS: '64'
  R5R6_ANCHOR_RULE: arena/config/r5r6_anchor_rule_v0.2.json

jobs:
  phase_a_subject_run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify one-shot paid authorization before provider access
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          if '${{ github.event_name }}' != 'push':
              raise SystemExit('authorization workflow only accepts push event')
          if '${{ github.run_attempt }}' != '1':
              raise SystemExit('one-shot authorization refuses workflow reruns')
          raw = Path(os.environ['AUTH_MANIFEST']).read_bytes()
          actual = hashlib.sha256(raw).hexdigest()
          if actual != os.environ['EXPECTED_AUTH_SHA256']:
              raise SystemExit('authorization manifest hash mismatch')
          auth = json.loads(raw)
          freeze = json.load(open(os.environ['R5MID_FIRST_BATCH_FREEZE'], encoding='utf-8'))
          expected = {
              'schema': 'RB-R5MID-PHASE-A-PAID-AUTHORIZATION-v0.1',
              'authorization_id': 'R5MID-PHASEA-2026-09-16-001',
              'scope': 'PHASE_A_BASELINE_SUBJECT_COLLECTION_ONLY',
              'authorization_phrase': 'CALL_REAL_R5R6_BASELINE_API',
              'provider': os.environ['R5R6_PROVIDER'],
              'model_config': os.environ['R5R6_MODEL_CONFIG'],
              'baseline_repeats': int(os.environ['R5R6_REPEATS']),
              'max_subject_calls': int(os.environ['R5R6_MAX_SUBJECT_CALLS']),
              'spending_ceiling': float(os.environ['R5R6_SPENDING_CEILING']),
              'currency': os.environ['R5R6_CURRENCY'],
              'automatic_paid_evaluator': False,
              'branch_continuation_authorized': False,
              'phase_b_authorized': False,
              'one_shot': True,
          }
          for key, value in expected.items():
              if auth.get(key) != value:
                  raise SystemExit(f'authorization field mismatch: {key}')
          phase = freeze['phase_a']
          if freeze['domain'] != 'ecommerce':
              raise SystemExit('frozen domain mismatch')
          if freeze['provider'] != auth['provider']:
              raise SystemExit('frozen provider mismatch')
          if freeze['subject_model_config'] != auth['model_config']:
              raise SystemExit('frozen model config mismatch')
          if phase['baseline_repeats'] != auth['baseline_repeats']:
              raise SystemExit('frozen repeat count mismatch')
          if phase['max_subject_calls'] != auth['max_subject_calls']:
              raise SystemExit('frozen call cap mismatch')
          if phase['currency'] != auth['currency']:
              raise SystemExit('frozen currency mismatch')
          print('PHASE_A_PAID_AUTHORIZATION=VERIFIED')
          print('SPENDING_CEILING=1 USD')
          print('PHASE_B_AUTHORIZED=NO')
          print('AUTOMATIC_PAID_EVALUATOR=NO')
          PY
      - name: Validate exact offline experiment machinery
        run: |
          python arena/validate_environment.py
          python arena/preflight.py
          python -m unittest discover -s arena/tests -v
          python -m arena.branch_recovery_preflight --outdir results/branch_recovery_preflight
      - name: Build exact authorized baseline manifest
        run: |
          python -m arena.build_branch_baseline_manifest \
            --repeats "$R5R6_REPEATS" \
            --domain ecommerce \
            --arena-config arena/config/arena_v0.3.json \
            --model-config "$R5R6_MODEL_CONFIG" \
            --anchor-rule "$R5R6_ANCHOR_RULE" \
            --out results/r5r6_baseline_manifest.jsonl
          test "$(wc -l < results/r5r6_baseline_manifest.jsonl)" = '2'
      - name: Execute authorized Phase-A baseline subject collection only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BAI: ${{ secrets.BAI }}
          BAILIAN_BASE_URL: ${{ secrets.BAILIAN_BASE_URL }}
          BAILIAN_MODEL: ${{ secrets.BAILIAN_MODEL }}
        run: |
          python -m arena.run_branch_baseline_real \
            --manifest results/r5r6_baseline_manifest.jsonl \
            --outdir results/r5r6_baseline_real \
            --arena-config arena/config/arena_v0.3.json \
            --model-config "$R5R6_MODEL_CONFIG" \
            --anchor-rule "$R5R6_ANCHOR_RULE" \
            --provider "$R5R6_PROVIDER" \
            --spending-ceiling "$R5R6_SPENDING_CEILING" \
            --currency "$R5R6_CURRENCY" \
            --max-subject-calls "$R5R6_MAX_SUBJECT_CALLS" \
            --authorization-phrase CALL_REAL_R5R6_BASELINE_API \
            --execute-real-api
      - name: Freeze standard Phase-A evidence — no paid evaluator
        if: always()
        run: |
          if [ -s results/r5r6_baseline_real/traces.jsonl ]; then
            python -m arena.evidence \
              --manifest results/r5r6_baseline_manifest.jsonl \
              --traces results/r5r6_baseline_real/traces.jsonl \
              --errors results/r5r6_baseline_real/errors.json \
              --outdir results/r5r6_baseline_real/evidence_batch \
              --code-sha '${{ github.sha }}'
            cat results/r5r6_baseline_real/evidence_batch/RUN_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No subject trace produced; authorization/error artifacts only.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload immutable authorized Phase-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5mid-phase-a-subject-evidence-${{ github.run_id }}
          path: |
            manifests/r5mid_phase_a_paid_authorization_2026-09-16.json
            manifests/r5mid_first_v4_subject_batch_v0.1.json
            results/r5r6_baseline_manifest.jsonl
            results/r5r6_baseline_real/
            results/json_format_retries.jsonl
            results/branch_recovery_preflight/
          if-no-files-found: warn
          retention-days: 90
