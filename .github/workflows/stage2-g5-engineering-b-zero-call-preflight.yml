name: Stage-II G5 Engineering-B Zero-Call Full Continuation Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - "stage2/r7_prospective_v1/engineering_b_runner.py"
      - "configs/stage2_g5_engineering_b_control_contract_v1.json"
      - ".github/workflows/stage2-g5-engineering-b-zero-call-preflight.yml"

permissions:
  contents: read

concurrency:
  group: stage2-g5-engineering-b-zero-call-preflight-v1
  cancel-in-progress: true

env:
  GROUP_ID: G5
  SOURCE_A_SCIENCE_SHA: b4f1441a48b2bc6a2c61035311419fc4509e8913

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {system: X2, task: T1, python: "3.10", source_run: "36251144204"}
          - {system: X2, task: T2, python: "3.10", source_run: "36251144204"}
          - {system: X2, task: T3, python: "3.10", source_run: "36251144204"}
          - {system: X4, task: T1, python: "3.11", source_run: "36251144204"}
          - {system: X4, task: T2, python: "3.11", source_run: "36251144204"}
          - {system: X4, task: T3, python: "3.11", source_run: "36251144204"}
          - {system: X5, task: T1, python: "3.11", source_run: "36251144204"}
          - {system: X5, task: T2, python: "3.11", source_run: "36251144204"}
          - {system: X5, task: T3, python: "3.11", source_run: "36251144204"}
          - {system: X7, task: T1, python: "3.11", source_run: "36251144204"}
          - {system: X7, task: T2, python: "3.11", source_run: "36251144204"}
          - {system: X7, task: T3, python: "3.11", source_run: "36251144204"}

    steps:
      - name: Checkout candidate G5 B control
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen G5 Natural-A evidence
        uses: actions/checkout@v4
        with:
          ref: stage2-g5-natural-evidence-v1
          path: evidence
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify frozen G5 selection and control contract
        env:
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
          SOURCE_A_WORKFLOW_RUN: ${{ matrix.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          cell=f'{os.environ["SYS"]}-{os.environ["TASK"]}'
          cfg=json.loads(Path("configs/stage2_g5_engineering_b_control_contract_v1.json").read_text())
          idx=json.loads(Path("stage2/replication_v2/engineering_eligibility_84_v1/G5_b_selection_index.json").read_text())
          assert cfg["status"]=="FROZEN_BEFORE_G5_B_PREFLIGHT"
          assert cfg["group_id"]=="G5"
          assert cfg["source_A"]["scientific_code_sha"]==os.environ["SOURCE_A_SCIENCE_SHA"]
          assert int(os.environ["SOURCE_A_WORKFLOW_RUN"]) in cfg["source_A"]["workflow_runs"]
          assert cfg["source_A"]["cell_workflow_run"][cell]==int(os.environ["SOURCE_A_WORKFLOW_RUN"])
          assert cfg["eligibility"]["eligible_cell_count"]==12
          assert cfg["eligibility"]["cells"]==[
              "X2-T1","X2-T2","X2-T3",
              "X4-T1","X4-T2","X4-T3",
              "X5-T1","X5-T2","X5-T3",
              "X7-T1","X7-T2","X7-T3",
          ]
          assert cfg["authorization"]["active_B"] is False
          assert cfg["authorization"]["provider_calls"] is False
          assert cfg["B_geometry"]["max_B_per_eligible_cell"]==1
          assert cfg["B_geometry"]["automatic_retry"] is False
          assert cfg["B_geometry"]["post_repair_monitor_mode"]=="WATCH_ONLY"
          assert idx["state"]=="FROZEN_ELIGIBILITY_NOT_B_AUTHORIZATION"
          assert idx["group_id"]=="G5"
          assert idx["eligible_cell_count"]==12
          rows=[r for r in idx["cells"] if r["cell_id"]==cell]
          assert len(rows)==1
          row=rows[0]
          assert row["B_authorized"] is False
          assert row["selection_used_semantic_audit"] is False
          assert row["selection_used_cpr_label"] is False
          assert row["selected_package_id"]
          assert row["selected_package_hash"]
          assert row["selected_parent_checkpoint_hash"]
          group_index=json.loads(Path("evidence/stage2/replication_v2/G5/group_index.json").read_text())
          receipts=[r for r in group_index["receipts"] if r["cell_id"]==cell]
          assert len(receipts)==1
          receipt=receipts[0]
          assert receipt["workflow_run_id"]==int(os.environ["SOURCE_A_WORKFLOW_RUN"])
          assert receipt["attempt_index"]==1
          assert receipt["scientific_code_sha"]==os.environ["SOURCE_A_SCIENCE_SHA"]
          assert receipt["preserved"] is True
          print("PASS: frozen G5 selection, first-attempt source-run binding, and control contract")
          PY

      - name: Bind exact X2 MetaGPT environment
        if: matrix.system == 'X2'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/FoundationAgents/MetaGPT /tmp/stage2-x2-metagpt
          git -C /tmp/stage2-x2-metagpt checkout -q 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          test "$(git -C /tmp/stage2-x2-metagpt rev-parse HEAD)" = 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          python -m pip install -q --upgrade pip
          grep -v '^lancedb==0.4.0$' /tmp/stage2-x2-metagpt/requirements.txt > /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q -r /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q 'pyarrow==14.0.2'
          python -m pip install -q --no-deps -e /tmp/stage2-x2-metagpt

      - name: Bind exact X4 MCP environment
        if: matrix.system == 'X4'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk /tmp/stage2-x4-mcp
          git -C /tmp/stage2-x4-mcp checkout -q f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol /tmp/stage2-x4-protocol
          git -C /tmp/stage2-x4-protocol checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          test "$(git -C /tmp/stage2-x4-mcp rev-parse HEAD)" = f1b6589088534632fef92238ee9750951e3c0185
          test "$(git -C /tmp/stage2-x4-protocol rev-parse HEAD)" = 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          (cd /tmp/stage2-x4-mcp && uv sync --frozen --no-default-groups)
          test -x /tmp/stage2-x4-mcp/.venv/bin/python

      - name: Bind exact X7 LongLLMLingua environment and study checkpoint
        if: matrix.system == 'X7'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/microsoft/LLMLingua /tmp/stage2-x7-longllmlingua
          git -C /tmp/stage2-x7-longllmlingua checkout -q 5a4c78ae18ab17a98cf997e8259354e546081d64
          test "$(git -C /tmp/stage2-x7-longllmlingua rev-parse HEAD)" = 5a4c78ae18ab17a98cf997e8259354e546081d64
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' 'accelerate>=0.33,<1' tiktoken nltk numpy tokenizers safetensors
          python -m pip install -q --no-deps -e /tmp/stage2-x7-longllmlingua
          rm -rf /tmp/stage2-x7-study
          python -m stage2.study_assets.validate --probe X7 --out-root /tmp/stage2-x7-study

      - name: Exercise full restore-repair-continuation path with local fake provider
        env:
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
          SOURCE_A_WORKFLOW_RUN: ${{ matrix.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          export TOKENIZERS_PARALLELISM=false
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          PYBIN=python
          if [ "$SYS" = X4 ]; then PYBIN=/tmp/stage2-x4-mcp/.venv/bin/python; fi
          "$PYBIN" - <<'PY'
          import asyncio, json, os
          from pathlib import Path
          import stage2.r7_prospective_v1.engineering_b_runner as rb

          class LocalFakeProvider:
              def complete_agent(self, messages, metadata=None):
                  metadata=metadata or {}
                  if metadata.get("role")=="r7_repair_agent":
                      spec=json.loads(messages[-1]["content"])
                      target=spec["repair_target_ref"]
                      if target.startswith("file:"):
                          repair={
                              "kind":"file_replace",
                              "target_ref":target,
                              "content":spec["current_target_content"]+"\n# zero-call G5 Engineering-B preflight\n",
                              "reason":"local fake repair for execution-path validation",
                          }
                      else:
                          repair={
                              "kind":"process_revision",
                              "target_ref":target,
                              "instruction":"Revalidate only the frozen targeted process state before continuing.",
                              "reason":"local fake repair for execution-path validation",
                          }
                      return {"content":json.dumps({"repair":repair})}
                  return {"content":json.dumps({"actions":[{"type":"finalize","answer":"zero-call G5 B continuation preflight"}]})}

          rb._build_subject_provider=lambda subject: LocalFakeProvider()
          cell=f'{os.environ["SYS"]}-{os.environ["TASK"]}'
          index=json.loads(Path("stage2/replication_v2/engineering_eligibility_84_v1/G5_b_selection_index.json").read_text())
          raw=next(r for r in index["cells"] if r["cell_id"]==cell)
          row=rb._normalize_selection_row(raw)
          kwargs={}
          if os.environ["SYS"]=="X7":
              kwargs={
                  "x7_checkpoint":"/tmp/stage2-x7-study/checkpoint",
                  "x7_checkpoint_manifest":"stage2/native_v7/study/x7_checkpoint_manifest.json",
              }
          out=Path(f"/tmp/stage2-g5-b-zero-call/{cell}")
          result=asyncio.run(rb.run_one(
              cell=cell,
              a_archive=Path(f"evidence/stage2/replication_v2/G5/natural_A/{cell}/first_attempt.tar.gz"),
              selection_row=row,
              out_root=out,
              dry_run=False,
              group_id="G5",
              source_a_science_sha=os.environ["SOURCE_A_SCIENCE_SHA"],
              source_a_workflow_run=int(os.environ["SOURCE_A_WORKFLOW_RUN"]),
              **kwargs,
          ))
          assert result["status"]=="REPAIR_B_FROZEN"
          assert result["group_id"]=="G5"
          assert result["repair_action_count"]==1
          assert result["repair_agent_calls"]==1
          assert result["same_parent_checkpoint"] is True
          assert result["repair_executor_exited"] is True
          assert result["post_repair_monitor_mode"]=="WATCH_ONLY"
          assert result["post_repair_repair_packages"]==0
          assert result["preserve_set_intact_at_executor_exit"] is True
          assert result["semantic_audit_used"] is False
          assert result["cpr_labels_used"] is False
          print(json.dumps({"cell":cell,"status":"PASS","external_provider_calls":0,"fake_provider_calls":result["total_B_provider_calls"]},sort_keys=True))
          PY

      - name: Upload zero-call preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-g5-b-zero-call-${{ matrix.system }}-${{ matrix.task }}-${{ github.run_id }}
          path: /tmp/stage2-g5-b-zero-call/
          if-no-files-found: error
          retention-days: 30
