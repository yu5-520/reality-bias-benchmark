name: Stage-II R7 G1 Phase A Provider-First-Sample v2 Zero-Call Recovery

on:
  push:
    branches:
      - stage2-gpt56sol-full-context-audit-results-v1
    paths:
      - ".github/workflows/stage2-r7-g1-phase-a-provider-first-sample-v2.yml"
      - "configs/stage2_r7_g1_phase_a_provider_first_sample_v2.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: stage2-r7-g1-phase-a-provider-first-sample-v2
  cancel-in-progress: false

env:
  SCIENCE_SHA: 76e2405644f6626822a3a9220cd9a73d3284e755
  CONTROL_BRANCH: stage2-gpt56sol-full-context-audit-results-v1
  EVIDENCE_BRANCH: stage2-r7-g1-evidence-v1
  GROUP_ID: StageII-R7-G1
  AUTH_ISSUE: "284"
  DECISION_HORIZON: "64"

jobs:
  phase-a-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {system: X2, task: T1, python: "3.10"}
          - {system: X2, task: T2, python: "3.10"}
          - {system: X2, task: T3, python: "3.10"}
          - {system: X4, task: T1, python: "3.11"}
          - {system: X4, task: T2, python: "3.11"}
          - {system: X4, task: T3, python: "3.11"}
          - {system: X5, task: T1, python: "3.11"}
          - {system: X5, task: T2, python: "3.11"}
          - {system: X5, task: T3, python: "3.11"}
          - {system: X6, task: T1, python: "3.10"}
          - {system: X6, task: T2, python: "3.10"}
          - {system: X6, task: T3, python: "3.10"}
          - {system: X7, task: T1, python: "3.11"}
          - {system: X7, task: T2, python: "3.11"}
          - {system: X7, task: T3, python: "3.11"}

    steps:
      - name: Checkout active control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_BRANCH }}
          path: control
          fetch-depth: 1

      - name: Checkout exact frozen scientific code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENCE_SHA }}
          path: science
          fetch-depth: 1

      - name: Checkout v1 quarantine evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_BRANCH }}
          path: quarantine-evidence
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify authorization and Phase-A-only geometry
        env:
          GH_TOKEN: ${{ github.token }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C science rev-parse HEAD)" = "$SCIENCE_SHA"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          cfg=json.loads(Path("control/configs/stage2_r7_g1_phase_a_provider_first_sample_v2.json").read_text())
          assert cfg["status"]=="AUTHORIZED_ZERO_CALL_PRERUN_RECOVERY_V2"
          assert cfg["authorization_issue"]==284
          assert cfg["scientific_code_sha"]==os.environ["SCIENCE_SHA"]
          assert cfg["evidence_branch"]==os.environ["EVIDENCE_BRANCH"]
          assert cfg["group_id"]=="StageII-R7-G1"
          assert cfg["phase"]=="PHASE_A_PROVIDER_BACKED_FIRST_SAMPLES_V2_ZERO_CALL_RECOVERY"
          assert cfg["logical_decision_ceiling"]==64
          assert cfg["max_natural_trajectories"]==15
          assert cfg["max_parallel"]==5
          assert cfg["one_provider_backed_first_sample_per_cell"] is True
          assert cfg["natural_resampling"] is False
          assert cfg["preserve_failed_attempt"] is True
          assert cfg["repair_actions_during_A"]==0
          assert cfg["all_A_before_any_B"] is True
          assert cfg["active_B_during_phase"] is False
          assert cfg["semantic_audit_locked"] is True
          assert cfg["paid_evaluator_calls"]==0
          cell=f'{os.environ["SYS"]}-{os.environ["TASK"]}'
          assert cell in cfg["cell_sequence"]
          assert cfg["contract_reconcile_run"]==36295325709
          assert cfg["contract_reconcile_state"]=="PASS_ZERO_PROVIDER"
          assert cfg["evidence_root"]=="stage2/r7_g1_v1/natural_A_provider_v2"
          assert cfg["source_failed_run"]==36296338750
          assert cfg["source_authorization_issue"]==283
          assert cfg["prior_v1_claim_markers"]==15
          assert cfg["prior_v1_runner_invoked_cells"]==0
          assert cfg["prior_v1_subject_provider_calls"]==0
          assert cfg["prior_v1_valid_natural_trajectories"]==0
          assert cfg["prior_v1_stochastic_samples_consumed"]==0
          quarantine=json.loads(Path("quarantine-evidence/stage2/r7_g1_v1/control/provider_v1_prerun_abort_quarantine_v1.json").read_text())
          assert quarantine["state"]=="QUARANTINED_NOT_NATURAL_EVIDENCE"
          assert quarantine["source_workflow_run_id"]==36296338750
          assert quarantine["failed_cell_jobs"]==15
          assert quarantine["runner_invoked_cells"]==0
          assert quarantine["subject_provider_calls_total"]==0
          assert quarantine["valid_natural_trajectory_count"]==0
          assert quarantine["stochastic_samples_consumed"]==0
          reconcile=json.loads(Path("control/stage2/r7_g1_v1/control/contract_reconcile_freeze_v1.json").read_text())
          assert reconcile["state"]=="PASS_ZERO_PROVIDER"
          assert reconcile["workflow_run_id"]==36295325709
          assert reconcile["science_sha"]==os.environ["SCIENCE_SHA"]
          assert reconcile["logical_model_decision_ceiling"]==64
          assert reconcile["native_role_turn_ceiling"]==32
          assert reconcile["subject_provider_calls"]==0
          launch=json.loads(Path("science/configs/stage2_r7_g1_launch_manifest_v1.json").read_text())
          row=next(r for r in launch["cells"] if r["cell_id"]==cell)
          assert row["natural_attempts"]==1
          assert row["natural_A_repair_actions"]==0
          assert row["active_B_max"]==1
          assert row["semantic_audit_before_B"] is False
          issue=json.loads(subprocess.check_output([
              "gh","api",f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/284'
          ],text=True))
          expected="\n".join([
              "group=StageII-R7-G1",
              "phase=PHASE_A_PROVIDER_BACKED_FIRST_SAMPLES_V2_ZERO_CALL_RECOVERY",
              "source_failed_run=36296338750",
              "source_authorization_issue=283",
              "root_cause=CONTROL_SCRIPT_ESCAPED_PYTHONPATH_PARAMETER_EXPANSION",
              "failed_cell_jobs=15",
              "v1_claim_markers_created=15",
              "runner_invoked_cells=0",
              "subject_provider_calls_total=0",
              "valid_natural_trajectories=0",
              "stochastic_samples_consumed=0",
              "v1_evidence_root_quarantined=true",
              "quarantine_record=stage2/r7_g1_v1/control/provider_v1_prerun_abort_quarantine_v1.json",
              f'science_sha={os.environ["SCIENCE_SHA"]}',
              "contract_reconcile_run=36295325709",
              "contract_reconcile_state=PASS_ZERO_PROVIDER",
              "new_evidence_root=stage2/r7_g1_v1/natural_A_provider_v2",
              "cells="+",".join(cfg["cell_sequence"]),
              "one_provider_backed_first_sample_per_cell=true",
              "natural_resampling=false",
              "logical_decision_ceiling=64",
              "native_role_turn_ceiling=32",
              "max_parallel=5",
              "repair_actions_during_A=0",
              "all_A_before_any_B=true",
              "active_B_during_phase=false",
              "semantic_audit_locked=true",
              "paid_evaluator_calls=0",
          ])
          assert issue["user"]["login"]=="yu5-520"
          assert issue["title"]=="STAGE2 R7 G1 PHASE A PROVIDER-FIRST-SAMPLE v2 ZERO-CALL RECOVERY AUTHORIZATION"
          assert issue["body"].strip()==expected
          readiness=json.loads(Path("science/configs/stage2_r7_g1_execution_readiness_freeze_v1.json").read_text())
          assert readiness["status"]=="FROZEN_READY_AWAITING_EXPLICIT_ACTIVE_EXECUTION_AUTHORIZATION"
          assert readiness["active_extension"]["systems"]==["X2","X4","X5","X6","X7"]
          assert readiness["active_extension"]["prospective_natural_cells"]==15
          print("PASS: provider-backed authorization, reconciled 64-decision contract, and Phase-A-only geometry match")
          PY

      - name: Bind exact X2 MetaGPT environment
        if: matrix.system == 'X2'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/FoundationAgents/MetaGPT /tmp/stage2-x2-metagpt
          git -C /tmp/stage2-x2-metagpt checkout -q 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          test "$(git -C /tmp/stage2-x2-metagpt rev-parse HEAD)" = 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          python -m pip install -q --upgrade pip
          grep -v '^lancedb==0.4.0$' /tmp/stage2-x2-metagpt/requirements.txt > /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q -r /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q 'pyarrow==14.0.2'
          python -m pip install -q --no-deps -e /tmp/stage2-x2-metagpt

      - name: Bind exact X4 MCP environment
        if: matrix.system == 'X4'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk /tmp/stage2-x4-mcp
          git -C /tmp/stage2-x4-mcp checkout -q f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol /tmp/stage2-x4-protocol
          git -C /tmp/stage2-x4-protocol checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          test "$(git -C /tmp/stage2-x4-mcp rev-parse HEAD)" = f1b6589088534632fef92238ee9750951e3c0185
          test "$(git -C /tmp/stage2-x4-protocol rev-parse HEAD)" = 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          (cd /tmp/stage2-x4-mcp && uv sync --frozen --no-default-groups)
          test -x /tmp/stage2-x4-mcp/.venv/bin/python

      - name: Bind exact X6 MemoryBank environment and study embedding
        if: matrix.system == 'X6'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/zhongwanjun/MemoryBank-SiliconFriend /tmp/stage2-x6-memorybank
          git -C /tmp/stage2-x6-memorybank checkout -q cf61c4196e4cfdb0f2b7a0316249fa40312dc3a9
          test "$(git -C /tmp/stage2-x6-memorybank rev-parse HEAD)" = cf61c4196e4cfdb0f2b7a0316249fa40312dc3a9
          python -m pip install -q --upgrade pip
          python -m pip install -q 'torch==2.0.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'numpy==1.24.4' 'pydantic==1.10.13' 'huggingface-hub==0.14.1' 'tokenizers==0.13.3' 'transformers==4.28.0' 'faiss-cpu==1.7.4' 'scipy==1.10.1' 'scikit-learn==1.3.2' 'nltk==3.9.1' 'Pillow==10.4.0' 'unstructured==0.6.10' 'langchain==0.0.146'
          python -m pip install -q --no-deps 'sentence-transformers==2.2.2'
          rm -rf /tmp/stage2-x6-study
          (cd science && python -m stage2.study_assets.validate --probe X6 --out-root /tmp/stage2-x6-study)

      - name: Bind exact X7 LongLLMLingua environment and study checkpoint
        if: matrix.system == 'X7'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/microsoft/LLMLingua /tmp/stage2-x7-longllmlingua
          git -C /tmp/stage2-x7-longllmlingua checkout -q 5a4c78ae18ab17a98cf997e8259354e546081d64
          test "$(git -C /tmp/stage2-x7-longllmlingua rev-parse HEAD)" = 5a4c78ae18ab17a98cf997e8259354e546081d64
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' 'accelerate>=0.33,<1' tiktoken nltk numpy tokenizers safetensors
          python -m pip install -q --no-deps -e /tmp/stage2-x7-longllmlingua
          rm -rf /tmp/stage2-x7-study
          (cd science && python -m stage2.study_assets.validate --probe X7 --out-root /tmp/stage2-x7-study)

      - name: Verify subject credential before irreversible claim
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY"
          echo "PASS: credential and all environment prerequisites are ready; no subject call made"

      - name: Irrevocably mark provider-backed first sample
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          CELL="$SYS-$TASK"
          TAG="stage2-r7-g1-$(echo "$CELL" | tr '[:upper:]' '[:lower:]')-phase-a-provider-first-sample-v2"
          EVIDENCE_PATH="stage2/r7_g1_v1/natural_A_provider_v2/$CELL/attempt_receipt.json"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "FAIL: $CELL already claimed; no second subject attempt is permitted"
            exit 41
          fi
          if gh api "repos/$GITHUB_REPOSITORY/contents/$EVIDENCE_PATH?ref=$EVIDENCE_BRANCH" >/dev/null 2>&1; then
            echo "FAIL: $CELL evidence already exists; no second subject attempt is permitted"
            exit 42
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SCIENCE_SHA" >/dev/null
          echo "claimed=true" >> "$GITHUB_OUTPUT"
          echo "claim_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "PASS: $CELL provider-first-sample v2 identity claimed before runner invocation"

      - name: Execute exactly one prospective natural A
        id: execute
        if: steps.claim.outputs.claimed == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -uo pipefail
          CELL="$SYS-$TASK"
          OUT="$GITHUB_WORKSPACE/science/stage2/r7_g1_v1/natural_A_provider_v2/$CELL"
          CHECKOUT="/tmp/stage2-r7-g1-$CELL-checkout"
          TASK_FILE="/tmp/stage2-r7-g1-$CELL-task.json"
          LOG_ROOT="/tmp/stage2-r7-g1-$CELL-control"
          rm -rf "$OUT" "$CHECKOUT" "$LOG_ROOT"
          mkdir -p "$LOG_ROOT"
          cp -a "$GITHUB_WORKSPACE/science/stage2/fixtures/project" "$CHECKOUT"
          export TASK TASK_FILE
          python - <<'PY'
          import json, os
          from pathlib import Path
          tasks=json.loads(Path("science/stage2/tasks.json").read_text())["tasks"]
          row=next(x for x in tasks if x["id"]==os.environ["TASK"])
          Path(os.environ["TASK_FILE"]).write_text(json.dumps(row,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          PY
          printf '%s\n' "$SCIENCE_SHA" > "$LOG_ROOT/scientific_code_sha.txt"
          printf '%s\n' "$AUTH_ISSUE" > "$LOG_ROOT/authorization_issue.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$LOG_ROOT/workflow_run_id.txt"
          printf '%s\n' "$CELL" > "$LOG_ROOT/cell_id.txt"
          if [ -n "${PYTHONPATH-}" ]; then export PYTHONPATH="$GITHUB_WORKSPACE/science:$PYTHONPATH"; else export PYTHONPATH="$GITHUB_WORKSPACE/science"; fi
          export TOKENIZERS_PARALLELISM=false
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          cd "$GITHUB_WORKSPACE/science"
          PYBIN=python
          if [ "$SYS" = X4 ]; then PYBIN=/tmp/stage2-x4-mcp/.venv/bin/python; fi
          set +e
          case "$SYS" in
            X2)
              timeout --signal=TERM --kill-after=30s 180m "$PYBIN" -m stage2.r7_prospective_v1.x2_runner \
                --checkout "$CHECKOUT" --task-file "$TASK_FILE" --roles-file stage2/roles.json --subject-file stage2/subject.json \
                --out-root "$OUT" --group-id StageII-R7-G1 --decision-horizon 64 ;;
            X4|X5)
              timeout --signal=TERM --kill-after=30s 180m "$PYBIN" -m stage2.r7_prospective_v1.capability_runner \
                --system "$SYS" --checkout "$CHECKOUT" --task-file "$TASK_FILE" --roles-file stage2/roles.json --subject-file stage2/subject.json \
                --out-root "$OUT" --group-id StageII-R7-G1 --decision-horizon 64 ;;
            X6)
              timeout --signal=TERM --kill-after=30s 180m "$PYBIN" -m stage2.r7_prospective_v1.capability_runner \
                --system X6 --checkout "$CHECKOUT" --task-file "$TASK_FILE" --roles-file stage2/roles.json --subject-file stage2/subject.json \
                --out-root "$OUT" --group-id StageII-R7-G1 --decision-horizon 64 \
                --x6-upstream /tmp/stage2-x6-memorybank \
                --x6-embedding-model /tmp/stage2-x6-study/checkpoint \
                --x6-embedding-manifest stage2/native_v7/study/x6_embedding_manifest.json ;;
            X7)
              timeout --signal=TERM --kill-after=30s 180m "$PYBIN" -m stage2.r7_prospective_v1.capability_runner \
                --system X7 --checkout "$CHECKOUT" --task-file "$TASK_FILE" --roles-file stage2/roles.json --subject-file stage2/subject.json \
                --out-root "$OUT" --group-id StageII-R7-G1 --decision-horizon 64 \
                --x7-checkpoint /tmp/stage2-x7-study/checkpoint \
                --x7-checkpoint-manifest stage2/native_v7/study/x7_checkpoint_manifest.json ;;
          esac > "$LOG_ROOT/runner_stdout.txt" 2> "$LOG_ROOT/runner_stderr.txt"
          CODE=$?
          set -e
          printf '%s\n' "$CODE" > "$LOG_ROOT/runner_exit_code.txt"
          echo "runner_exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Package immutable first-attempt artifact
        id: package
        if: always() && steps.claim.outputs.claimed == 'true'
        env:
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
          CLAIM_TAG: ${{ steps.claim.outputs.claim_tag }}
          RUNNER_EXIT_CODE: ${{ steps.execute.outputs.runner_exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          CELL="$SYS-$TASK"
          OUT="$GITHUB_WORKSPACE/science/stage2/r7_g1_v1/natural_A_provider_v2/$CELL"
          LOG_ROOT="/tmp/stage2-r7-g1-$CELL-control"
          mkdir -p "$OUT/control"
          if [ -d "$LOG_ROOT" ]; then cp -a "$LOG_ROOT"/. "$OUT/control"/; fi
          export OUT CELL CLAIM_TAG RUNNER_EXIT_CODE
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ["OUT"])
          seal_path=out/"seal.json"
          seal=json.loads(seal_path.read_text()) if seal_path.exists() else None
          meta={
            "schema":"stage2-r7-g1-phase-a-provider-first-sample-v2-metadata-v1",
            "group_id":"StageII-R7-G1",
            "cell_id":os.environ["CELL"],
            "attempt_index":1,
            "scientific_code_sha":os.environ["SCIENCE_SHA"],
            "authorization_issue":int(os.environ["AUTH_ISSUE"]),
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "claim_tag":os.environ["CLAIM_TAG"],
            "runner_exit_code":int(os.environ.get("RUNNER_EXIT_CODE") or -999),
            "repair_actions_during_A":0,
            "active_B_during_this_phase":False,
            "semantic_audit_state":"LOCKED",
            "seal_present":seal is not None,
            "seal_status":seal.get("status") if seal else None,
            "model_decision_count":seal.get("model_decision_count") if seal else None,
            "natural_subject_calls":seal.get("natural_subject_calls") if seal else None,
            "provider_mode":seal.get("provider_mode") if seal else None,
            "candidate_count":seal.get("candidate_count") if seal else None,
            "package_count":seal.get("package_count") if seal else None,
            "complete_package_count":seal.get("complete_package_count") if seal else None,
          }
          (out/"control"/"attempt_metadata.json").write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
          PY
          ARCHIVE="/tmp/stage2-r7-g1-$CELL-first_attempt.tar.gz"
          tar -czf "$ARCHIVE" -C "$OUT" .
          export ARCHIVE
          ART="/tmp/stage2-r7-g1-artifact/$CELL"
          mkdir -p "$ART"
          cp "$ARCHIVE" "$ART/first_attempt.tar.gz"
          sha256sum "$ARCHIVE" > "$ART/first_attempt.tar.gz.sha256"
          export ART
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          archive=Path(os.environ["ARCHIVE"])
          out=Path(os.environ["OUT"])
          meta=json.loads((out/"control"/"attempt_metadata.json").read_text())
          receipt=dict(meta)
          receipt.update({
            "schema":"stage2-r7-g1-phase-a-provider-first-sample-v2-receipt-v1",
            "archive_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
            "archive_bytes":archive.stat().st_size,
            "preserved":True,
            "scientific_success_not_inferred":True,
          })
          (Path(os.environ["ART"])/"attempt_receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY
          echo "packaged=true" >> "$GITHUB_OUTPUT"
          echo "PASS: $CELL first attempt packaged; runner exit code=$RUNNER_EXIT_CODE"

      - name: Upload immutable cell artifact
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage2-r7-g1-${{ matrix.system }}-${{ matrix.task }}-${{ github.run_id }}
          path: /tmp/stage2-r7-g1-artifact/
          retention-days: 90
          if-no-files-found: error

      - name: Assert first attempt was preserved
        if: always() && steps.claim.outputs.claimed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.package.outputs.packaged }}" = true
          echo "PASS: Phase A preserved exactly one provider-backed first sample identity; no B and no semantic audit executed"

  phase-a-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
    needs: phase-a-cells
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_BRANCH }}
          path: evidence
          fetch-depth: 1

      - name: Download all Phase-A cell artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stage2-r7-g1-*-${{ github.run_id }}
          path: /tmp/stage2-r7-g1-downloaded
          merge-multiple: true

      - name: Freeze 15 provider-first-sample v2 trajectories and deterministic B-selection index
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export ROOT="$GITHUB_WORKSPACE/evidence"
          export DL="/tmp/stage2-r7-g1-downloaded"
          python - <<'PY'
          import hashlib,json,os,re,tarfile,tempfile
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          dl=Path(os.environ["DL"])
          expected=[f"{x}-T{t}" for x in ("X2","X4","X5","X6","X7") for t in range(1,4)]
          rows=[]
          selections=[]
          for cell in expected:
              src=dl/cell
              receipt=src/"attempt_receipt.json"
              archive=src/"first_attempt.tar.gz"
              sha_file=src/"first_attempt.tar.gz.sha256"
              if not (receipt.is_file() and archive.is_file() and sha_file.is_file()):
                  continue
              r=json.loads(receipt.read_text())
              observed=hashlib.sha256(archive.read_bytes()).hexdigest()
              assert observed==r["archive_sha256"], cell
              assert sha_file.read_text().split()[0]==observed, cell
              assert r["attempt_index"]==1
              assert r["repair_actions_during_A"]==0
              assert r["active_B_during_this_phase"] is False
              assert r["seal_present"] is True, f"{cell}: missing scientific seal"
              assert r["provider_mode"]=="SUBJECT", f"{cell}: provider mode is not SUBJECT"
              assert isinstance(r["natural_subject_calls"],int) and r["natural_subject_calls"]>0, f"{cell}: no provider-backed subject call"
              dest=root/"stage2/r7_g1_v1/natural_A_provider_v2"/cell
              dest.mkdir(parents=True,exist_ok=True)
              (dest/"first_attempt.tar.gz").write_bytes(archive.read_bytes())
              (dest/"first_attempt.tar.gz.sha256").write_text(sha_file.read_text())
              (dest/"attempt_receipt.json").write_text(receipt.read_text())
              rows.append(r)

          if len(rows)!=15:
              raise SystemExit(f"Provider-backed Phase A incomplete: preserved {len(rows)}/15; B selection remains closed")

          # Selection occurs only after all 15 A are present and hash-verified.
          for r in rows:
              cell=r["cell_id"]
              archive=root/"stage2/r7_g1_v1/natural_A_provider_v2"/cell/"first_attempt.tar.gz"
              with tempfile.TemporaryDirectory() as td:
                  with tarfile.open(archive,"r:gz") as tf:
                      tf.extractall(td)
                  p=Path(td)/"repair_packages.json"
                  packages=json.loads(p.read_text()) if p.is_file() else []
                  complete=[x for x in packages if x.get("repair_gate_status")=="COMPLETE_FOR_STRUCTURED_REPAIR"]
                  def seq(x):
                      val=x.get("prefix_sequence")
                      if isinstance(val,int): return val
                      anchor=str(x.get("repair_anchor_ref") or x.get("prefix_cutoff_ref") or "")
                      m=re.search(r"(\\d+)(?!.*\\d)",anchor)
                      return int(m.group(1)) if m else 10**12
                  complete.sort(key=lambda x:(seq(x),str(x.get("package_id") or "")))
                  chosen=complete[0] if complete else None
                  selections.append({
                    "cell_id":cell,
                    "complete_package_count":len(complete),
                    "selected_package_id":chosen.get("package_id") if chosen else None,
                    "selected_package_hash":chosen.get("package_hash") if chosen else None,
                    "selected_prefix_sequence":seq(chosen) if chosen else None,
                    "selected_repair_anchor_ref":chosen.get("repair_anchor_ref") if chosen else None,
                    "selected_parent_reconstruction":chosen.get("parent_reconstruction") if chosen else None,
                    "B_authorized":False,
                    "selection_used_semantic_audit":False,
                    "selection_used_cpr_label":False,
                  })

          group={
            "schema":"stage2-r7-g1-phase-a-provider-v2-group-index-v1",
            "group_id":"StageII-R7-G1",
            "phase":"PHASE_A_PROVIDER_BACKED_FIRST_SAMPLES_V2_ZERO_CALL_RECOVERY",
            "scientific_code_sha":os.environ["SCIENCE_SHA"],
            "authorization_issue":284,
            "evidence_root":"stage2/r7_g1_v1/natural_A_provider_v2",
            "source_failed_run":36296338750,
            "source_authorization_issue":283,
            "quarantine_record":"stage2/r7_g1_v1/control/provider_v1_prerun_abort_quarantine_v1.json",
            "prior_v1_subject_provider_calls":0,
            "prior_v1_valid_natural_trajectories":0,
            "prior_v1_stochastic_samples_consumed":0,
            "expected_cells":expected,
            "preserved_cells":[r["cell_id"] for r in rows],
            "preserved_count":len(rows),
            "complete":len(rows)==15,
            "first_attempt_only":True,
            "repair_actions_during_A":0,
            "all_A_before_any_B":True,
            "active_B_executed":False,
            "semantic_audit_state":"LOCKED_UNTIL_ALL_A_AND_B_FROZEN",
            "paid_evaluator_calls":0,
            "receipts":rows,
          }
          base=root/"stage2/r7_g1_v1"
          (base/"phase_a_provider_v2_group_index.json").write_text(json.dumps(group,indent=2,sort_keys=True)+"\n")
          selection={
            "schema":"stage2-r7-g1-phase-a-provider-v2-b-selection-index-v1",
            "state":"FROZEN_AFTER_ALL_15_PROVIDER_BACKED_A_V2",
            "selector":"EARLIEST_COMPLETE_PACKAGE_BY_PREFIX_SEQUENCE_THEN_PACKAGE_ID",
            "source_evidence_root":"stage2/r7_g1_v1/natural_A_provider_v2",
            "authorization_issue":284,
            "semantic_audit_used":False,
            "cpr_labels_used":False,
            "B_executed":False,
            "eligible_cell_count":sum(1 for x in selections if x["selected_package_id"]),
            "cells":selections,
          }
          (base/"phase_a_provider_v2_b_selection_index.json").write_text(json.dumps(selection,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"status":"PASS","A_preserved":15,"B_eligible_cells":selection["eligible_cell_count"]},sort_keys=True))
          PY
