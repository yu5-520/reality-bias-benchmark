name: NMI P4 RA08 Validate
on:
  push:
    branches: [main]
    paths:
      - 'docs/submission/nmi/NMI_Manuscript_v0.10.md'
      - 'docs/submission/nmi/NMI_P4_Subject_Model_External_Validity_Attack_v1.md'
      - 'docs/submission/nmi/NMI_Reviewer_Attack_Matrix_v1.9.md'
      - 'docs/submission/nmi/NMI_P4_Reviewer_Attack_Status_v0.9.md'
      - 'configs/nmi_submission_contract_v1.11.json'
      - 'manifests/nmi_p4_ra08_subject_model_external_validity_2026-09-21_v0_1.json'
      - 'scripts/validate_nmi_p4_ra08_v0_1.py'
      - '.github/workflows/nmi-p4-ra08-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate_nmi_p4_ra08_v0_1.py
