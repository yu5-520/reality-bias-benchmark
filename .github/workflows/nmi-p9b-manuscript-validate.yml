name: NMI P9B Evidence Forward Manuscript Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/submission/nmi/NMI_Manuscript_v0.18_EVIDENCE_FORWARD_WORKING.md'
      - 'docs/submission/nmi/NMI_Supplementary_Information_v0.4_EVIDENCE_FORWARD_WORKING.md'
      - 'configs/nmi_p9_paper_evidence_registry_v1.1.json'
      - 'evidence/paper/nmi_p9/**'
      - 'scripts/validate_nmi_p9b_manuscript_v1.py'
      - '.github/workflows/nmi-p9b-manuscript-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/validate_nmi_p9b_manuscript_v1.py
