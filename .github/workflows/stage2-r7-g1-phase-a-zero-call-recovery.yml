name: Stage-II R7 G1 Phase A Zero-Call Recovery

on:
  push:
    branches:
      - stage2-gpt56sol-full-context-audit-results-v1
    paths:
      - ".github/workflows/stage2-r7-g1-phase-a-zero-call-recovery.yml"
      - "configs/stage2_r7_g1_phase_a_zero_call_recovery_v1.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: stage2-r7-g1-phase-a-zero-call-recovery-v1
  cancel-in-progress: false

env:
  SCIENCE_SHA: 11b37b161151096be96ed0ead44c50cba77d128e
  CONTROL_BRANCH: stage2-gpt56sol-full-context-audit-results-v1
  EVIDENCE_BRANCH: stage2-r7-g1-evidence-v1
  AUTH_ISSUE: "282"
  SOURCE_ABORT_RUN: "36294416247"

jobs:
  recover-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {system: X2, task: T1, python: "3.10"}
          - {system: X2, task: T2, python: "3.10"}
          - {system: X2, task: T3, python: "3.10"}
          - {system: X4, task: T1, python: "3.11"}
          - {system: X4, task: T2, python: "3.11"}
          - {system: X4, task: T3, python: "3.11"}
          - {system: X5, task: T1, python: "3.11"}
          - {system: X5, task: T2, python: "3.11"}
          - {system: X5, task: T3, python: "3.11"}
          - {system: X6, task: T1, python: "3.10"}
          - {system: X6, task: T2, python: "3.10"}
          - {system: X6, task: T3, python: "3.10"}
          - {system: X7, task: T1, python: "3.11"}
          - {system: X7, task: T2, python: "3.11"}
          - {system: X7, task: T3, python: "3.11"}

    steps:
      - name: Checkout recovery control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_BRANCH }}
          path: control
          fetch-depth: 1

      - name: Checkout exact frozen scientific code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENCE_SHA }}
          path: science
          fetch-depth: 1

      - name: Checkout frozen abort evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_BRANCH }}
          path: abort-evidence
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify zero-call recovery authorization
        env:
          GH_TOKEN: ${{ github.token }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C science rev-parse HEAD)" = "$SCIENCE_SHA"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          cfg=json.loads(Path("control/configs/stage2_r7_g1_phase_a_zero_call_recovery_v1.json").read_text())
          abort=json.loads(Path("abort-evidence/stage2/r7_g1_v1/control/zero_subject_call_infra_abort_index_v1.json").read_text())
          assert cfg["status"]=="AUTHORIZED_ZERO_SUBJECT_CALL_INFRA_RECOVERY"
          assert cfg["authorization_issue"]==282
          assert cfg["source_failed_run_id"]==36294416247
          assert cfg["subject_samples_consumed_before_recovery"]==0
          assert cfg["second_subject_attempt_per_cell"] is False
          assert cfg["repair_actions_during_A"]==0
          assert cfg["all_A_before_any_B"] is True
          assert cfg["active_B_during_recovery"] is False
          assert abort["source_workflow_run_id"]==36294416247
          assert abort["subject_provider_calls_total"]==0
          assert abort["natural_trajectory_count"]==0
          cell=f'{os.environ["SYS"]}-{os.environ["TASK"]}'
          row=next(r for r in abort["records"] if r["cell_id"]==cell)
          if cell=="X7-T3":
              assert row["status"]=="PRECLAIM_PAUSED_NO_ATTEMPT"
              assert row["claim_tag_present"] is False
          else:
              assert row["status"]=="POST_CLAIM_ZERO_SUBJECT_CALL_INFRA_ABORT"
              assert row["claim_tag_present"] is True
              assert row["subject_provider_calls"]==0
              assert row["runner_invoked"] is False
              assert row["failure_signature"]=="PYTHONPATH: unbound variable"
          issue=json.loads(subprocess.check_output(["gh","api",f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/282'],text=True))
          expected="\n".join([
            "group=StageII-R7-G1",
            "phase=PHASE_A_INFRASTRUCTURE_RECOVERY",
            "source_failed_run=36294416247",
            "zero_subject_call_abort_index=stage2/r7_g1_v1/control/zero_subject_call_infra_abort_index_v1.json",
            "cells="+",".join(cfg["cells"]),
            "existing_claim_reservations=14",
            "new_claim_cells=X7-T3",
            "subject_samples_consumed_before_recovery=0",
            "recovery_counts_as_same_reserved_first_attempt=true",
            "second_subject_attempt_per_cell=false",
            f'scientific_code_sha={os.environ["SCIENCE_SHA"]}',
            f'evidence_branch={os.environ["EVIDENCE_BRANCH"]}',
            "logical_decision_ceiling=64",
            "max_parallel=5",
            "repair_actions_during_A=0",
            "all_A_before_any_B=true",
            "active_B_during_recovery=false",
            "semantic_audit_locked=true",
            "paid_evaluator_calls=0",
          ])
          assert issue["user"]["login"]=="yu5-520"
          assert issue["title"]=="STAGE2 R7 G1 PHASE A ZERO-CALL INFRA RECOVERY AUTHORIZATION"
          assert issue["body"].strip()==expected
          print("PASS: zero-call recovery is bounded to the same reserved first-attempt identities")
          PY

      - name: Bind exact X2 MetaGPT environment
        if: matrix.system == 'X2'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/FoundationAgents/MetaGPT /tmp/stage2-x2-metagpt
          git -C /tmp/stage2-x2-metagpt checkout -q 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          test "$(git -C /tmp/stage2-x2-metagpt rev-parse HEAD)" = 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          python -m pip install -q --upgrade pip
          grep -v '^lancedb==0.4.0$' /tmp/stage2-x2-metagpt/requirements.txt > /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q -r /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q 'pyarrow==14.0.2'
          python -m pip install -q --no-deps -e /tmp/stage2-x2-metagpt

      - name: Bind exact X4 MCP environment
        if: matrix.system == 'X4'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk /tmp/stage2-x4-mcp
          git -C /tmp/stage2-x4-mcp checkout -q f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol /tmp/stage2-x4-protocol
          git -C /tmp/stage2-x4-protocol checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          test "$(git -C /tmp/stage2-x4-mcp rev-parse HEAD)" = f1b6589088534632fef92238ee9750951e3c0185
          test "$(git -C /tmp/stage2-x4-protocol rev-parse HEAD)" = 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          (cd /tmp/stage2-x4-mcp && uv sync --frozen --no-default-groups)

      - name: Bind exact X6 MemoryBank environment and study embedding
        if: matrix.system == 'X6'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/zhongwanjun/MemoryBank-SiliconFriend /tmp/stage2-x6-memorybank
          git -C /tmp/stage2-x6-memorybank checkout -q cf61c4196e4cfdb0f2b7a0316249fa40312dc3a9
          python -m pip install -q --upgrade pip
          python -m pip install -q 'torch==2.0.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'numpy==1.24.4' 'pydantic==1.10.13' 'huggingface-hub==0.14.1' 'tokenizers==0.13.3' 'transformers==4.28.0' 'faiss-cpu==1.7.4' 'scipy==1.10.1' 'scikit-learn==1.3.2' 'nltk==3.9.1' 'Pillow==10.4.0' 'unstructured==0.6.10' 'langchain==0.0.146'
          python -m pip install -q --no-deps 'sentence-transformers==2.2.2'
          rm -rf /tmp/stage2-x6-study
          (cd science && python -m stage2.study_assets.validate --probe X6 --out-root /tmp/stage2-x6-study)

      - name: Bind exact X7 LongLLMLingua environment and study checkpoint
        if: matrix.system == 'X7'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/microsoft/LLMLingua /tmp/stage2-x7-longllmlingua
          git -C /tmp/stage2-x7-longllmlingua checkout -q 5a4c78ae18ab17a98cf997e8259354e546081d64
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' 'accelerate>=0.33,<1' tiktoken nltk numpy tokenizers safetensors
          python -m pip install -q --no-deps -e /tmp/stage2-x7-longllmlingua
          rm -rf /tmp/stage2-x7-study
          (cd science && python -m stage2.study_assets.validate --probe X7 --out-root /tmp/stage2-x7-study)

      - name: Verify credential and claim reservation
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY"
          CELL="$SYS-$TASK"
          CLAIM_TAG="stage2-r7-g1-$(echo "$CELL" | tr '[:upper:]' '[:lower:]')-phase-a-claimed-v1"
          START_TAG="stage2-r7-g1-$(echo "$CELL" | tr '[:upper:]' '[:lower:]')-phase-a-subject-started-v1"
          if [ "$CELL" = X7-T3 ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CLAIM_TAG" >/dev/null 2>&1; then
              echo "FAIL: unexpected prior X7-T3 claim"
              exit 41
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$CLAIM_TAG" -f sha="$SCIENCE_SHA" >/dev/null
          else
            OBS="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CLAIM_TAG" --jq .object.sha)"
            test "$OBS" = "$SCIENCE_SHA"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$START_TAG" >/dev/null 2>&1; then
            echo "FAIL: $CELL subject-started tag already exists; a second stochastic sample is forbidden"
            exit 42
          fi
          if gh api "repos/$GITHUB_REPOSITORY/contents/stage2/r7_g1_v1/natural_A/$CELL/attempt_receipt.json?ref=$EVIDENCE_BRANCH" >/dev/null 2>&1; then
            echo "FAIL: $CELL natural evidence already durable; no recovery call allowed"
            exit 43
          fi
          echo "claim_tag=$CLAIM_TAG" >> "$GITHUB_OUTPUT"
          echo "start_tag=$START_TAG" >> "$GITHUB_OUTPUT"
          echo "PASS: claim reservation verified; subject sample still unused"

      - name: Mark stochastic subject sample started
        id: started
        env:
          GH_TOKEN: ${{ github.token }}
          START_TAG: ${{ steps.reserve.outputs.start_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$START_TAG" -f sha="$SCIENCE_SHA" >/dev/null
          echo "started=true" >> "$GITHUB_OUTPUT"
          echo "PASS: subject-started tag created immediately before runner invocation"

      - name: Execute reserved first natural A sample
        id: execute
        if: steps.started.outputs.started == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -uo pipefail
          CELL="$SYS-$TASK"
          OUT="$GITHUB_WORKSPACE/science/stage2/r7_g1_v1/natural_A/$CELL"
          CHECKOUT="/tmp/stage2-r7-g1-recovery-$CELL-checkout"
          TASK_FILE="/tmp/stage2-r7-g1-recovery-$CELL-task.json"
          LOG_ROOT="/tmp/stage2-r7-g1-recovery-$CELL-control"
          rm -rf "$OUT" "$CHECKOUT" "$LOG_ROOT"
          mkdir -p "$LOG_ROOT"
          cp -a "$GITHUB_WORKSPACE/science/stage2/fixtures/project" "$CHECKOUT"
          export TASK TASK_FILE
          python - <<'PY'
          import json,os
          from pathlib import Path
          tasks=json.loads(Path("science/stage2/tasks.json").read_text())["tasks"]
          row=next(x for x in tasks if x["id"]==os.environ["TASK"])
          Path(os.environ["TASK_FILE"]).write_text(json.dumps(row,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          PY
          printf '%s\n' "$SCIENCE_SHA" > "$LOG_ROOT/scientific_code_sha.txt"
          printf '%s\n' "$AUTH_ISSUE" > "$LOG_ROOT/recovery_authorization_issue.txt"
          printf '%s\n' "$SOURCE_ABORT_RUN" > "$LOG_ROOT/source_abort_run_id.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$LOG_ROOT/recovery_workflow_run_id.txt"
          printf '%s\n' "$CELL" > "$LOG_ROOT/cell_id.txt"
          export PYTHONPATH="$GITHUB_WORKSPACE/science"
          export TOKENIZERS_PARALLELISM=false
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          cd "$GITHUB_WORKSPACE/science"
          PYBIN=python
          if [ "$SYS" = X4 ]; then PYBIN=/tmp/stage2-x4-mcp/.venv/bin/python; fi
          set +e
          case "$SYS" in
            X2)
              timeout --signal=TERM --kill-after=30s 180m "$PYBIN" -m stage2.r7_prospective_v1.x2_runner                 --checkout "$CHECKOUT" --task-file "$TASK_FILE" --roles-file stage2/roles.json --subject-file stage2/subject.json                 --out-root "$OUT" --group-id StageII-R7-G1 --decision-horizon 64 ;;
            X4|X5)
              timeout --signal=TERM --kill-after=30s 180m "$PYBIN" -m stage2.r7_prospective_v1.capability_runner                 --system "$SYS" --checkout "$CHECKOUT" --task-file "$TASK_FILE" --roles-file stage2/roles.json --subject-file stage2/subject.json                 --out-root "$OUT" --group-id StageII-R7-G1 --decision-horizon 64 ;;
            X6)
              timeout --signal=TERM --kill-after=30s 180m "$PYBIN" -m stage2.r7_prospective_v1.capability_runner                 --system X6 --checkout "$CHECKOUT" --task-file "$TASK_FILE" --roles-file stage2/roles.json --subject-file stage2/subject.json                 --out-root "$OUT" --group-id StageII-R7-G1 --decision-horizon 64                 --x6-upstream /tmp/stage2-x6-memorybank                 --x6-embedding-model /tmp/stage2-x6-study/checkpoint                 --x6-embedding-manifest stage2/native_v7/study/x6_embedding_manifest.json ;;
            X7)
              timeout --signal=TERM --kill-after=30s 180m "$PYBIN" -m stage2.r7_prospective_v1.capability_runner                 --system X7 --checkout "$CHECKOUT" --task-file "$TASK_FILE" --roles-file stage2/roles.json --subject-file stage2/subject.json                 --out-root "$OUT" --group-id StageII-R7-G1 --decision-horizon 64                 --x7-checkpoint /tmp/stage2-x7-study/checkpoint                 --x7-checkpoint-manifest stage2/native_v7/study/x7_checkpoint_manifest.json ;;
          esac > "$LOG_ROOT/runner_stdout.txt" 2> "$LOG_ROOT/runner_stderr.txt"
          CODE=$?
          set -e
          printf '%s\n' "$CODE" > "$LOG_ROOT/runner_exit_code.txt"
          echo "runner_exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "PASS: runner invocation completed with preserved exit code=$CODE"
          exit 0

      - name: Package actual first stochastic sample
        id: package
        if: always() && steps.started.outputs.started == 'true'
        env:
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
          CLAIM_TAG: ${{ steps.reserve.outputs.claim_tag }}
          START_TAG: ${{ steps.reserve.outputs.start_tag }}
          RUNNER_EXIT_CODE: ${{ steps.execute.outputs.runner_exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          CELL="$SYS-$TASK"
          OUT="$GITHUB_WORKSPACE/science/stage2/r7_g1_v1/natural_A/$CELL"
          LOG_ROOT="/tmp/stage2-r7-g1-recovery-$CELL-control"
          mkdir -p "$OUT/control"
          cp -a "$LOG_ROOT"/. "$OUT/control"/
          export OUT CELL CLAIM_TAG START_TAG RUNNER_EXIT_CODE
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ["OUT"])
          seal_path=out/"seal.json"
          seal=json.loads(seal_path.read_text()) if seal_path.exists() else None
          meta={
            "schema":"stage2-r7-g1-phase-a-recovered-first-sample-metadata-v1",
            "group_id":"StageII-R7-G1","cell_id":os.environ["CELL"],"attempt_index":1,
            "scientific_code_sha":os.environ["SCIENCE_SHA"],
            "recovery_authorization_issue":int(os.environ["AUTH_ISSUE"]),
            "source_zero_call_abort_run_id":int(os.environ["SOURCE_ABORT_RUN"]),
            "recovery_workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "claim_tag":os.environ["CLAIM_TAG"],"subject_started_tag":os.environ["START_TAG"],
            "runner_exit_code":int(os.environ.get("RUNNER_EXIT_CODE") or -999),
            "reused_zero_call_claim_reservation":os.environ["CELL"]!="X7-T3",
            "subject_sample_started":True,
            "repair_actions_during_A":0,"active_B_during_this_phase":False,
            "semantic_audit_state":"LOCKED",
            "seal_present":seal is not None,
            "seal_status":seal.get("status") if seal else None,
            "model_decision_count":seal.get("model_decision_count") if seal else None,
            "natural_subject_calls":seal.get("natural_subject_calls") if seal else None,
            "provider_mode":seal.get("provider_mode") if seal else None,
            "candidate_count":seal.get("candidate_count") if seal else None,
            "package_count":seal.get("package_count") if seal else None,
            "complete_package_count":seal.get("complete_package_count") if seal else None,
          }
          (out/"control"/"attempt_metadata.json").write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
          PY
          ARCHIVE="/tmp/stage2-r7-g1-recovery-$CELL-first_attempt.tar.gz"
          tar -czf "$ARCHIVE" -C "$OUT" .
          ART="/tmp/stage2-r7-g1-recovery-artifact/$CELL"
          mkdir -p "$ART"
          cp "$ARCHIVE" "$ART/first_attempt.tar.gz"
          sha256sum "$ARCHIVE" > "$ART/first_attempt.tar.gz.sha256"
          export ARCHIVE ART
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          archive=Path(os.environ["ARCHIVE"]); out=Path(os.environ["OUT"])
          meta=json.loads((out/"control"/"attempt_metadata.json").read_text())
          receipt=dict(meta)
          receipt.update({
            "schema":"stage2-r7-g1-phase-a-first-attempt-receipt-v2",
            "archive_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
            "archive_bytes":archive.stat().st_size,
            "preserved":True,"scientific_success_not_inferred":True,
          })
          (Path(os.environ["ART"])/"attempt_receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY
          echo "packaged=true" >> "$GITHUB_OUTPUT"

      - name: Upload recovered first-sample artifact
        if: always() && steps.started.outputs.started == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage2-r7-g1-recovery-${{ matrix.system }}-${{ matrix.task }}-${{ github.run_id }}
          path: /tmp/stage2-r7-g1-recovery-artifact/
          retention-days: 90
          if-no-files-found: error

      - name: Assert stochastic attempt preservation
        if: always() && steps.started.outputs.started == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.package.outputs.packaged }}" = true
          echo "PASS: exactly one subject-started first sample preserved; no B and no semantic audit executed"

  freeze-phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: always()
    needs: recover-cells
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_BRANCH }}
          path: evidence
          fetch-depth: 1

      - name: Download all recovered first-sample artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stage2-r7-g1-recovery-*-${{ github.run_id }}
          path: /tmp/stage2-r7-g1-recovery-downloaded
          merge-multiple: true

      - name: Freeze all A and select B packages without executing B
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export ROOT="$GITHUB_WORKSPACE/evidence"
          export DL="/tmp/stage2-r7-g1-recovery-downloaded"
          python - <<'PY'
          import hashlib,json,os,re,tarfile,tempfile
          from pathlib import Path
          root=Path(os.environ["ROOT"]); dl=Path(os.environ["DL"])
          expected=[f"{x}-T{t}" for x in ("X2","X4","X5","X6","X7") for t in range(1,4)]
          rows=[]
          for cell in expected:
              src=dl/cell; receipt=src/"attempt_receipt.json"; archive=src/"first_attempt.tar.gz"; shaf=src/"first_attempt.tar.gz.sha256"
              if not (receipt.is_file() and archive.is_file() and shaf.is_file()): continue
              r=json.loads(receipt.read_text()); observed=hashlib.sha256(archive.read_bytes()).hexdigest()
              assert r["subject_sample_started"] is True
              assert r["attempt_index"]==1 and r["repair_actions_during_A"]==0
              assert observed==r["archive_sha256"]==shaf.read_text().split()[0]
              dest=root/"stage2/r7_g1_v1/natural_A"/cell; dest.mkdir(parents=True,exist_ok=True)
              (dest/"first_attempt.tar.gz").write_bytes(archive.read_bytes())
              (dest/"first_attempt.tar.gz.sha256").write_text(shaf.read_text())
              (dest/"attempt_receipt.json").write_text(receipt.read_text())
              rows.append(r)
          if len(rows)!=15: raise SystemExit(f"Phase A incomplete: {len(rows)}/15 first stochastic samples preserved; B stays closed")

          selections=[]
          for r in rows:
              cell=r["cell_id"]; archive=root/"stage2/r7_g1_v1/natural_A"/cell/"first_attempt.tar.gz"
              with tempfile.TemporaryDirectory() as td:
                  with tarfile.open(archive,"r:gz") as tf: tf.extractall(td)
                  p=Path(td)/"repair_packages.json"; packages=json.loads(p.read_text()) if p.is_file() else []
                  complete=[x for x in packages if x.get("repair_gate_status")=="COMPLETE_FOR_STRUCTURED_REPAIR"]
                  def seq(x):
                      v=x.get("prefix_sequence")
                      if isinstance(v,int): return v
                      a=str(x.get("repair_anchor_ref") or x.get("prefix_cutoff_ref") or "")
                      m=re.search(r"(\d+)(?!.*\d)",a)
                      return int(m.group(1)) if m else 10**12
                  complete.sort(key=lambda x:(seq(x),str(x.get("package_id") or "")))
                  chosen=complete[0] if complete else None
                  selections.append({
