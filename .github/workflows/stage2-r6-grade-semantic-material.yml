name: Stage-II R6-Grade Offline Semantic Materialization

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: stage2-r6-grade-semantic-material
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.issue.user.login == 'yu5-520' &&
      github.event.issue.title == 'STAGE2 R6 GRADE SEMANTIC MATERIAL AUTHORIZATION'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_BODY: ${{ github.event.issue.body }}
      AUTH_ISSUE: ${{ github.event.issue.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact offline authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python - <<'PY'
          import os
          expected='\n'.join([
              f"expected_main_sha={os.environ['GITHUB_SHA']}",
              'control_plane=CHAT_OFFLINE_STAGE2_R6_GRADE_MATERIAL_v1',
              'natural_cells=21',
              'subject_calls=0',
              'natural_reruns=0',
              'contrasts_spent=0',
          ])
          if os.environ['AUTH_BODY'].strip() != expected:
              raise SystemExit('R6-grade material authorization differs from exact offline contract')
          print('PASS: exact offline semantic-material authorization')
          PY

      - name: Verify frozen 21-cell archive state
        shell: bash
        run: |
          set -euo pipefail
          python -m stage2.natural_v7.verify_archive

      - name: Materialize complete route and native-event packets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage2/natural_v7/r6_grade_material
          python arena/build_stage2_r6_grade_material.py --out stage2/natural_v7/r6_grade_material
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('stage2/natural_v7/r6_grade_material')
          index=json.loads((root/'index.json').read_text())
          assert index['natural_cells'] == 21
          assert len(index['cells']) == 21
          assert index['subject_calls'] == 0
          assert index['reruns'] == 0
          expected={f'X{x}-T{t}' for t in range(1,4) for x in range(1,8)}
          assert {row['cell'] for row in index['cells']} == expected
          for cell in expected:
              assert (root/f'{cell}.json').is_file()
              assert (root/f'{cell}.md').is_file()
          print('PASS: 21/21 R6-grade evidence packets materialized')
          PY

      - name: Commit material to review branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="work/stage2-r6-grade-material-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add stage2/natural_v7/r6_grade_material
          git commit -m "Stage II: materialize R6-grade semantic evidence packets"
          git push origin "$branch"
          gh issue comment "$AUTH_ISSUE" --repo "$GITHUB_REPOSITORY" --body "R6-grade offline material branch pushed: $branch. 21/21 frozen first attempts expanded; subject_calls=0; natural_reruns=0; contrasts_spent=0."
          gh issue close "$AUTH_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
