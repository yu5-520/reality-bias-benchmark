name: Process Reality v4.5.1 Methodological Closure Validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/R_Plan_v4.5.1.md"
      - "theory/theory_contract_v0.10.md"
      - "docs/system_behavior_measurement_plan_v4.5.1.md"
      - "docs/R6_inertia_identification_protocol_v0.4.md"
      - "docs/R5_R6_specificity_protocol_v0.4.md"
      - "docs/R7_structural_inertia_control_protocol_v0.5.md"
      - "docs/ALR_authority_localized_recovery_contract_v0.4.md"
      - "docs/R7_process_integrity_engineering_profile_v0.2.md"
      - "configs/first_paper_analysis_contract_v0.7.json"
      - "configs/process_reality_measurement_contract_v0.9.json"
      - "configs/r7_process_integrity_engineering_contract_v0.2.json"
      - "configs/r6/r6d_methodological_interpretation_gate_v0.1.json"
      - "schemas/process_integrity_event_v0.2.schema.json"
      - "schemas/process_integrity_relation_evidence_v0.1.schema.json"
      - "schemas/process_integrity_lineage_record_v0.2.schema.json"
      - "docs/reporting/process_reality_report_standard_v1_3.md"
      - "schemas/process_reality_report_template_v1_3.json"
      - "scripts/validate_process_reality_v4_5_1.py"
      - ".github/workflows/r6d-specificity-subject-real.yml"
      - ".github/workflows/process-reality-v4-5-1-offline-validate.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  validate-method-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate v4.5.1 methodological closure
        run: python scripts/validate_process_reality_v4_5_1.py

      - name: Revalidate v4.5 forward stack
        run: python scripts/validate_process_reality_v4_5.py

      - name: Revalidate frozen exact R6-D plan
        run: python scripts/validate_r6d_specificity_exact_plan_v0_1.py

      - name: Run full Arena offline tests
        run: python -m unittest discover arena/tests -v

      - name: Materialize atomic preflight without provider call
        run: |
          set -euo pipefail
          rm -rf /tmp/r6d_v451_atomic_preflight
          python -m arena.r5r6_specificity_atomic_preflight_v0_2 --outdir /tmp/r6d_v451_atomic_preflight
          test -s /tmp/r6d_v451_atomic_preflight/plan.json
          test -s /tmp/r6d_v451_atomic_preflight/summary.json

      - name: Assert this validation workflow is provider-secret free
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/process-reality-v4-5-1-offline-validate.yml')
          text=p.read_text(encoding='utf-8')
          forbidden=['DEEPSEEK_'+'API_KEY','OPENAI_'+'API_KEY','DASHSCOPE_'+'API_KEY','--execute-'+'real']
          found=[x for x in forbidden if x in text]
          assert not found, found
          print('PASS: v4.5.1 validation path has no provider credential or real-run capability')
          PY
