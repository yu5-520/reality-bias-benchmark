name: Stage-II P2 Corrected Native Evidence Replay

on:
  push:
    paths:
      - 'scripts/*stage2*p2*v2.py'
      - 'scripts/inspect_stage2_evidence_graph.py'
      - 'configs/stage2_p2_evidence_graph_replay_v2.json'
      - 'stage2/monitor_enhancement/**'
      - '.github/workflows/stage2-p2-evidence-graph-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage2-p2-native-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate monitor and repair authority boundaries
        run: |
          python -m unittest discover -s stage2/monitor_enhancement/tests -v
          python -m unittest discover -s stage2/route_repair/tests -v
      - name: Read frozen public Natural A archives
        shell: bash
        run: |
          set -euo pipefail
          for g in 2 3 4 5; do
            commit=$(python -c "import json; print(json.load(open('configs/stage2_g${g}_ab_paired_semantic_audit_v1.json'))['source']['natural_A_evidence_commit'])")
            git archive "$commit" "stage2/replication_v2/G${g}/natural_A" | tar -x
          done
      - name: Replay without any subject or provider execution
        run: python scripts/run_stage2_p2_evidence_graph_replay_v2.py --out "$RUNNER_TEMP/p2-replay"
      - name: Validate persisted graph and field bindings
        run: python scripts/validate_stage2_p2_replay_v2.py --root "$RUNNER_TEMP/p2-replay" --receipt "$RUNNER_TEMP/p2-validation.json"
      - name: Retain complete generated graphs and maps
        uses: actions/upload-artifact@v4
        with:
          name: p2-native-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p2-replay
            ${{ runner.temp }}/p2-validation.json
          retention-days: 90
          if-no-files-found: error
