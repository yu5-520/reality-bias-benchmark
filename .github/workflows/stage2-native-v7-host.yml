name: Stage-II v7 software host freeze

on:
  push:
    paths:
      - 'stage2/native_v7/software_host_v1.py'
      - 'stage2/native_v7/software_host_smoke.py'
      - 'stage2/native_v7/registry.json'
      - 'stage2/native_v7/policy.py'
      - 'stage2/native_v7/freeze.py'
      - 'stage2/native_v7/matrix.json'
      - 'stage2/native_v7/tests/**'
      - 'docs/R_Plan_v7.2.md'
      - '.github/workflows/stage2-native-v7-host.yml'
  pull_request:
    paths:
      - 'stage2/native_v7/software_host_v1.py'
      - 'stage2/native_v7/software_host_smoke.py'
      - 'stage2/native_v7/registry.json'
      - 'stage2/native_v7/policy.py'
      - 'stage2/native_v7/freeze.py'
      - 'stage2/native_v7/matrix.json'
      - 'stage2/native_v7/tests/**'
      - 'docs/R_Plan_v7.2.md'
      - '.github/workflows/stage2-native-v7-host.yml'

jobs:
  host-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run de-instrumented host equivalence smoke
        run: python -m stage2.native_v7.software_host_smoke --out-root stage2_host_smoke
      - name: Verify frozen v7 matrix and architecture
        run: |
          python -m stage2.native_v7.freeze
          python -m unittest stage2.native_v7.tests.test_architecture -v
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-v7-software-host-${{ github.run_id }}
          path: stage2_host_smoke
          retention-days: 30
          if-no-files-found: error
