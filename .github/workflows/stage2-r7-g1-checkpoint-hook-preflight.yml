name: Stage-II R7 G1 Checkpoint Hook Preflight

on:
  push:
    branches:
      - stage2-r7-g1-contract-v1
    paths:
      - "configs/stage2_r7_g1_*.json"
      - "stage2/r7_checkpoint_v1/**"
      - "stage2/r7_prospective_v1/**"
      - ".github/workflows/stage2-r7-g1-checkpoint-hook-preflight.yml"
  pull_request:
    paths:
      - "configs/stage2_r7_g1_*.json"
      - "stage2/r7_checkpoint_v1/**"
      - "stage2/r7_prospective_v1/**"
      - ".github/workflows/stage2-r7-g1-checkpoint-hook-preflight.yml"
  workflow_dispatch:

jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate X1/X3 fail-closed checkpoint boundaries
        run: python -m stage2.r7_prospective_v1.preflight --system static --out-root preflight_static
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-r7-g1-static-${{ github.run_id }}
          path: preflight_static
          retention-days: 30

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify X4-X7 prospective host hook equivalence
        run: python -m stage2.r7_prospective_v1.preflight --system host --out-root preflight_host
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-r7-g1-host-${{ github.run_id }}
          path: preflight_host
          retention-days: 30

  metagpt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Bind pinned MetaGPT
        run: |
          set -euo pipefail
          git clone -q https://github.com/FoundationAgents/MetaGPT upstream
          git -C upstream checkout -q 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          test "$(git -C upstream rev-parse HEAD)" = 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          python -m pip install -q --upgrade pip
          grep -v '^lancedb==0.4.0$' upstream/requirements.txt > /tmp/metagpt-requirements-stage2.txt
          python -m pip install -q -r /tmp/metagpt-requirements-stage2.txt
          python -m pip install -q 'pyarrow==14.0.2'
          python -m pip install -q --no-deps -e upstream
      - name: Verify MetaGPT prospective round checkpoint equivalence
        run: python -m stage2.r7_prospective_v1.preflight --system metagpt --out-root preflight_metagpt
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-r7-g1-metagpt-${{ github.run_id }}
          path: preflight_metagpt
          retention-days: 30
