name: Process Reality Reporting v1.1 Validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/reporting/process_reality_report_standard_v1_1.md"
      - "schemas/process_reality_report_template_v1_1.json"
      - "scripts/validate_process_reality_reporting_v1_1.py"
      - ".github/workflows/process-reality-reporting-v1-1-validate.yml"
      - "docs/reports/**"

permissions:
  contents: read

jobs:
  validate-reporting-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate reporting standard and template
        run: python scripts/validate_process_reality_reporting_v1_1.py

      - name: Assert reporting path has no execution authorization
        shell: bash
        run: |
          set -euo pipefail
          files=(
            docs/reporting/process_reality_report_standard_v1_1.md
            schemas/process_reality_report_template_v1_1.json
            scripts/validate_process_reality_reporting_v1_1.py
            .github/workflows/process-reality-reporting-v1-1-validate.yml
          )
          if grep -RniE 'CALL_REAL_|DEEPSEEK_API_KEY|DASHSCOPE_API_KEY|OPENAI_API_KEY|--execute-real' "${files[@]}"; then
            echo 'Reporting contract must not contain a real-provider execution route.' >&2
            exit 2
          fi
          echo 'PASS: reporting layer contains no real-provider authorization route'
