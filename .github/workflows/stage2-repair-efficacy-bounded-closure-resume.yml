name: Resume bounded closure F after frozen first response

on:
  push:
    branches: [fix/p2-native-evidence-replay]
    paths:
      - 'configs/stage2_repair_efficacy_bounded_closure_resume_request_v1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage2-bounded-closure-F-resume-v1
  cancel-in-progress: false

jobs:
  resume-F:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind interrupted scientific attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          req=json.load(open('configs/stage2_repair_efficacy_bounded_closure_resume_request_v1.json'))
          c=json.load(open(req['contract']))
          assert req['resume_same_F_attempt'] is True
          assert req['provider_recall_for_first_response'] is False
          assert c['status']=='FROZEN_RESUME_AFTER_SINGLE_PROVIDER_ZERO_NATIVE_EFFECT'
          inc=c['resumable_incident']
          assert inc['workflow_run']==req['interrupted_workflow_run']
          assert inc['artifact_id']==req['interrupted_artifact_id']
          repo=os.environ['GITHUB_REPOSITORY']
          meta=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/artifacts/{inc['artifact_id']}"]))
          assert meta['workflow_run']['id']==inc['workflow_run']
          assert meta['digest']=='sha256:'+inc['artifact_sha256']
          run=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"]))
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',
              f"repos/{repo}/actions/workflows/{run['workflow_id']}/runs?per_page=100"]))
          earlier=[r for page in pages for r in page['workflow_runs'] if r['id']<run['id']]
          assert not earlier,'F_RESUME_ALREADY_REGISTERED_NO_SECOND_CONTINUATION'
          PY

      - name: Download frozen parent and interrupted F evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prior" "$RUNNER_TEMP/interrupted"
          gh run download 37349337495 --repo "$GITHUB_REPOSITORY"             --name repair-efficacy-first-contrast-408258db42df4a016276ea9f5ecebb8c49e584d9             --dir "$RUNNER_TEMP/prior"
          gh run download 37421493309 --repo "$GITHUB_REPOSITORY"             --name repair-efficacy-bounded-closure-F-476c5e9c7b759fa229a1727c3626c6d7744bf99c             --dir "$RUNNER_TEMP/interrupted"

      - name: Bind unchanged official MCP runtime
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk "$RUNNER_TEMP/mcp-sdk"
          git -C "$RUNNER_TEMP/mcp-sdk" checkout -q f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol "$RUNNER_TEMP/mcp-protocol"
          git -C "$RUNNER_TEMP/mcp-protocol" checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          cd "$RUNNER_TEMP/mcp-sdk"
          uv sync --frozen --no-default-groups --python "$(command -v python)"

      - name: Preflight exact resume without provider calls
        run: |
          "$RUNNER_TEMP/mcp-sdk/.venv/bin/python" scripts/run_stage2_repair_efficacy_bounded_closure.py             --prior-artifact-root "$RUNNER_TEMP/prior"             --resume-artifact-root "$RUNNER_TEMP/interrupted"             --sdk-root "$RUNNER_TEMP/mcp-sdk"             --protocol-root "$RUNNER_TEMP/mcp-protocol"             --out "$RUNNER_TEMP/f-resume-preflight"

      - name: Continue the same F attempt
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          "$RUNNER_TEMP/mcp-sdk/.venv/bin/python" scripts/run_stage2_repair_efficacy_bounded_closure.py             --prior-artifact-root "$RUNNER_TEMP/prior"             --resume-artifact-root "$RUNNER_TEMP/interrupted"             --sdk-root "$RUNNER_TEMP/mcp-sdk"             --protocol-root "$RUNNER_TEMP/mcp-protocol"             --out "$RUNNER_TEMP/f-resume-treatment"             --execute

      - name: Print retained continuation result
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'f-resume-treatment'
          for rel in ['preflight.json','treatment_F/summary.json','treatment_F/resume_binding.json',
                      'treatment_F/closure_events.json','treatment_F/authority_events.json',
                      'treatment_F/schedule_retirements.json','treatment_F/native_result.json']:
              p=root/rel
              if p.exists(): print(json.dumps({'source':rel,'value':json.loads(p.read_bytes())},ensure_ascii=False))
          PY

      - name: Retain resumed F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-efficacy-bounded-closure-F-resumed-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f-resume-preflight
            ${{ runner.temp }}/f-resume-treatment
          retention-days: 90
          if-no-files-found: warn
