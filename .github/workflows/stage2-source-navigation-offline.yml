name: Source navigation frozen failure replay
on:
  push:
    branches: [fix/p2-native-evidence-replay]
    paths:
      - 'stage2/route_repair/source_navigation.py'
      - 'scripts/inspect_stage2_final_interface_failure.py'
      - '.github/workflows/stage2-source-navigation-offline.yml'
permissions:
  contents: read
  actions: read
jobs:
  frozen-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original failed artifact without model execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/yu5-520/reality-bias-benchmark/actions/artifacts/11314621407/zip > "$RUNNER_TEMP/original-failure.zip"
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'sources'/'G3A'
          root.mkdir(parents=True)
          commit=json.load(open('configs/stage2_g3_ab_paired_semantic_audit_v1.json'))['source']['natural_A_evidence_commit']
          with subprocess.Popen(['git','archive',commit,'stage2/replication_v2/G3/natural_A'],stdout=subprocess.PIPE) as proc:
              subprocess.run(['tar','-x','-C',str(root)],stdin=proc.stdout,check=True)
              assert proc.wait()==0
          PY
      - name: Replay exact old query and verify new handles against the same frozen prefix
        run: |
          python scripts/inspect_stage2_final_interface_failure.py --artifact "$RUNNER_TEMP/original-failure.zip" --source-root "$RUNNER_TEMP/sources" --out "$RUNNER_TEMP/inspection.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-navigation-failure-inspection-${{ github.sha }}
          path: |
            ${{ runner.temp }}/original-failure.zip
            ${{ runner.temp }}/inspection.json
          retention-days: 90
          if-no-files-found: error
