name: Stage-II v7 T1 X2-X5 Natural Batch

on:
  workflow_dispatch:
    inputs:
      expected_execution_sha:
        description: Exact main SHA pinned by the one-time issue bridge
        required: true
        type: string
      authorization_issue:
        description: Issue number carrying the exact one-time authorization
        required: true
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: stage2-v7-natural-t1-x2-x5
  cancel-in-progress: false

jobs:
  t1-x2-x5-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {probe: X2, python: "3.10"}
          - {probe: X3, python: "3.11"}
          - {probe: X4, python: "3.11"}
          - {probe: X5, python: "3.11"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify pinned one-time authorization and frozen collection gate
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_ISSUE: ${{ inputs.authorization_issue }}
          EXPECTED_SHA: ${{ inputs.expected_execution_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_REF" = refs/tags/stage2-natural-t1-x2-x5-authorization
          python - <<'PY'
          import json, os, re, subprocess
          issue = os.environ['AUTH_ISSUE']
          if not re.fullmatch(r'[1-9][0-9]*', issue):
              raise SystemExit('invalid authorization issue number')
          raw = subprocess.check_output([
              'gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue}",
          ], text=True)
          data = json.loads(raw)
          expected_body = '\n'.join([
              'cells=X2-T1,X3-T1,X4-T1,X5-T1',
              'control_plane=CHAT_AUTHORIZATION_BRIDGE_STAGE2_T1_X2_X5_v1',
              f"expected_main_sha={os.environ['GITHUB_SHA']}",
              'max_natural_trajectories=4',
              'preserve_failed_attempt=true',
          ])
          if data['user']['login'] != 'yu5-520' or data['title'] != 'STAGE2 T1 X2-X5 NATURAL BATCH AUTHORIZATION':
              raise SystemExit('authorization issue identity mismatch')
          if data['body'].strip() != expected_body:
              raise SystemExit('authorization body mismatch')
          print('PASS: exact one-time ${{ matrix.probe }}-T1 authorization')
          PY
          python -m stage2.native_v7.freeze
          python -m unittest discover -s stage2/native_v7/tests -v
          python - <<'PY'
          from stage2.native_v7.collect import validate_request
          validate_request('${{ matrix.probe }}', 'T1')
          print('PASS: ${{ matrix.probe }}-T1 collection is subject-ready')
          PY

      - name: Install pinned X2 MetaGPT environment before reservation
        if: matrix.probe == 'X2'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/FoundationAgents/MetaGPT upstream
          git -C upstream checkout -q 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          test "$(git -C upstream rev-parse HEAD)" = 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          python -m pip install -q --upgrade pip
          grep -v '^lancedb==0.4.0$' upstream/requirements.txt > /tmp/metagpt-requirements-stage2.txt
          python -m pip install -q -r /tmp/metagpt-requirements-stage2.txt
          python -m pip install -q 'pyarrow==14.0.2'
          python -m pip install -q --no-deps -e upstream
          python -c 'from importlib.metadata import version; assert version("metagpt") == "1.0.0"'

      - name: Install pinned X3 A2A protocol and SDK before reservation
        if: matrix.probe == 'X3'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/a2aproject/a2a-python upstream
          git -C upstream checkout -q 0d5473ca4fa6d40034a6a7c8d65bce5cd85d8167
          test "$(git -C upstream rev-parse HEAD)" = 0d5473ca4fa6d40034a6a7c8d65bce5cd85d8167
          python -m pip install -q -e './upstream[http-server]' 'uvicorn>=0.35.0'
          git clone -q https://github.com/a2aproject/A2A protocol
          git -C protocol checkout -q 173695755607e884aa9acf8ce4feed90e32727a1
          test "$(git -C protocol rev-parse HEAD)" = 173695755607e884aa9acf8ce4feed90e32727a1

      - name: Install pinned X4 MCP protocol and SDK before reservation
        if: matrix.probe == 'X4'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk upstream
          git -C upstream checkout -q f1b6589088534632fef92238ee9750951e3c0185
          test "$(git -C upstream rev-parse HEAD)" = f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol protocol
          git -C protocol checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          test "$(git -C protocol rev-parse HEAD)" = 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          (cd upstream && uv sync --frozen --no-default-groups)
          test -x upstream/.venv/bin/python

      - name: Verify frozen X5 RAG source before reservation
        if: matrix.probe == 'X5'
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum stage2/retrieval.py | awk '{print $1}')" = baf19cd7f7dde0a2f7ebfde254bffac6690e018b88d8d9ea4a811d37a53b12c4

      - name: Irrevocably claim ${{ matrix.probe }}-T1 before any possible reservation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/stage2-natural-${{ matrix.probe }}-t1-execution-claimed \
            -f "sha=$GITHUB_SHA" >/dev/null
          echo "PASS: unique ${{ matrix.probe }}-T1 execution claim created; retries must fail"

      - name: Execute and seal exactly one ${{ matrix.probe }}-T1 natural attempt
        id: collect
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AUTH_ISSUE: ${{ inputs.authorization_issue }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/stage2_t1_batch
          printf '%s\n' "$GITHUB_SHA" > /tmp/stage2_t1_batch/execution_sha.txt
          printf '%s\n' "$AUTH_ISSUE" > /tmp/stage2_t1_batch/authorization_issue.txt
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          if [ "${{ matrix.probe }}" = X4 ]; then
            export PATH="$GITHUB_WORKSPACE/upstream/.venv/bin:$PATH"
          fi
          timeout --signal=TERM --kill-after=30s 150m \
            python -m stage2.native_v7.collect \
              --probe ${{ matrix.probe }} --task T1 --out-root /tmp/stage2_t1_batch \
              > /tmp/stage2_t1_batch/collect_stdout.txt \
              2> /tmp/stage2_t1_batch/collect_stderr.txt
          code=$?
          printf '%s\n' "$code" > /tmp/stage2_t1_batch/collect_exit_code.txt
          echo "collect_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Package attempt and hash inventory before judging outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage2_t1_batch
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/stage2_t1_batch')
          files = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'archive_inventory.json'
          }
          (root / 'archive_inventory.json').write_text(json.dumps(files, indent=2, sort_keys=True) + '\n')
          PY
          tar -czf /tmp/stage2-v7-${{ matrix.probe }}-t1-${{ github.run_id }}.tar.gz -C /tmp/stage2_t1_batch .
          sha256sum /tmp/stage2-v7-${{ matrix.probe }}-t1-${{ github.run_id }}.tar.gz \
            > /tmp/stage2-v7-${{ matrix.probe }}-t1-${{ github.run_id }}.tar.gz.sha256

      - name: Upload immutable single-attempt evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-v7-${{ matrix.probe }}-t1-${{ github.run_id }}
          path: |
            /tmp/stage2-v7-${{ matrix.probe }}-t1-${{ github.run_id }}.tar.gz
            /tmp/stage2-v7-${{ matrix.probe }}-t1-${{ github.run_id }}.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Report frozen outcome after preservation
        if: always()
        env:
          COLLECT_CODE: ${{ steps.collect.outputs.collect_exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          test "$COLLECT_CODE" = 0
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/stage2_t1_batch/${{ matrix.probe }}-T1')
          seal = json.loads((root / 'seal.json').read_text())
          assert seal['cell'] == '${{ matrix.probe }}-T1'
          assert seal['returncode'] == 0
          assert seal['status'] == 'RECORDED_PENDING_POSTHOC_AUDIT'
          print('PASS: ${{ matrix.probe }}-T1 recorded once and pending post-hoc audit')
          PY
