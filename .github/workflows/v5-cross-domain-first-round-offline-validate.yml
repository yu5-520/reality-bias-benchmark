name: V5 Cross-Domain First-Round Offline Validate

on:
  pull_request:
    paths:
      - "docs/cross_domain_first_round_experiment_plan_v0.2.md"
      - "docs/cross_domain_case_progression_contract_v0.1.md"
      - "docs/cross_domain_case_progression_contract_v0.2.md"
      - "docs/cross_domain_probability_structure_interpretation_addendum_v0.1.md"
      - "docs/R_Plan_v5.3.md"
      - "theory/theory_contract_v0.14.md"
      - "docs/first_paper_v5_3_scope.md"
      - "docs/R5_structural_scouting_and_driver_probe_protocol_v1.1.md"
      - "docs/R6_structural_support_trace_control_surface_protocol_v1.1.md"
      - "docs/v5_whole_process_experiment_protocol_v0.2.md"
      - "docs/reporting/process_reality_theory_experiment_report_standard_v1_1.md"
      - "docs/cross_domain_semantic_triage_protocol_v0.1.md"
      - "docs/cross_domain_localized_semantic_audit_protocol_v0.1.md"
      - "docs/v5_cross_domain_r5_first_wave_protocol_v0.1.md"
      - "manifests/v5_cross_domain_localized_semantic_audit_review_2026-09-19_v0_1.json"
      - "configs/v5_cross_domain_first_round_v0.2.json"
      - "configs/v5_cross_domain_subject_gate_v0.2.json"
      - "configs/v5_cross_domain_semantic_triage_v0.1.json"
      - "configs/v5_cross_domain_r5_first_wave_v0.1.json"
      - "configs/v5_cross_domain_r6_targeted_specificity_v0.1.json"
      - "configs/process_reality_probability_structure_separation_v1.0.json"
      - "manifests/v5_cross_domain_probability_structure_reclassification_2026-09-19_v0_1.json"
      - "scripts/validate_probability_structure_separation_v1.py"
      - "schemas/v5_cross_domain_*"
      - "arena/build_v5_cross_domain_manifest.py"
      - "arena/v5_cross_domain_preflight.py"
      - "arena/run_v5_cross_domain_real.py"
      - "arena/freeze_v5_cross_domain_evidence.py"
      - "arena/build_v5_cross_domain_case_ledger.py"
      - "arena/build_v5_cross_domain_first_round_registry.py"
      - "arena/build_v5_cross_domain_semantic_triage.py"
      - "arena/build_v5_cross_domain_localized_semantic_audit.py"
      - "arena/prepare_v5_cross_domain_r5_first_wave.py"
      - "arena/run_v5_cross_domain_r5_first_wave.py"
      - "arena/freeze_v5_cross_domain_r5_first_wave.py"
      - "arena/derive_v5_cross_domain_r5_local_response.py"
      - "arena/prepare_v5_cross_domain_r6_targeted_specificity.py"
      - "arena/run_v5_cross_domain_r6_targeted_specificity.py"
      - "arena/freeze_v5_cross_domain_r6_targeted_specificity.py"
      - "arena/derive_v5_whole_process_structural.py"
      - "arena/tests/test_v5_cross_domain*.py"
      - ".github/workflows/v5-cross-domain-first-round-*.yml"
      - ".github/workflows/r7-chat-authorization-bridge.yml"
      - "README.md"
      - "arena/README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile cross-domain modules
        run: |
          python -m py_compile arena/build_v5_cross_domain_manifest.py arena/v5_cross_domain_preflight.py
          python -m py_compile arena/run_v5_cross_domain_real.py arena/freeze_v5_cross_domain_evidence.py
          python -m py_compile arena/build_v5_cross_domain_case_ledger.py arena/build_v5_cross_domain_first_round_registry.py
          python -m py_compile arena/build_v5_cross_domain_semantic_triage.py
          python -m py_compile arena/build_v5_cross_domain_localized_semantic_audit.py
          python -m py_compile arena/prepare_v5_cross_domain_r5_first_wave.py arena/run_v5_cross_domain_r5_first_wave.py
          python -m py_compile arena/freeze_v5_cross_domain_r5_first_wave.py arena/derive_v5_cross_domain_r5_local_response.py
          python -m py_compile arena/prepare_v5_cross_domain_r6_targeted_specificity.py arena/run_v5_cross_domain_r6_targeted_specificity.py arena/freeze_v5_cross_domain_r6_targeted_specificity.py
          python -m py_compile arena/derive_v5_whole_process_structural.py

      - name: Run cross-domain tests
        run: |
          python -m unittest arena.tests.test_v5_cross_domain arena.tests.test_v5_cross_domain_runtime_guard arena.tests.test_v5_cross_domain_semantic_triage arena.tests.test_v5_cross_domain_localized_semantic_audit arena.tests.test_v5_cross_domain_r5_first_wave -v

      - name: Run held-out cross-domain offline preflight
        run: |
          python -m arena.v5_cross_domain_preflight --outdir results/v5_cross_domain_preflight --code-sha "$GITHUB_SHA"

      - name: Assert fixed 90-row six-wave geometry
        run: |
          test "$(wc -l < results/v5_cross_domain_preflight/manifest_candidate.jsonl)" -eq 90
          python - <<'PY'
          import json
          from collections import Counter
          rows=[json.loads(x) for x in open('results/v5_cross_domain_preflight/manifest_candidate.jsonl',encoding='utf-8') if x.strip()]
          assert Counter(r['domain_id'] for r in rows)=={
              'finance':30,'supply_chain':30,'software_engineering':30
          }
          assert 'ecommerce' not in Counter(r['domain_id'] for r in rows)
          assert Counter(r['wave_id'] for r in rows)=={1:15,2:15,3:15,4:15,5:15,6:15}
          expected={1:'finance',2:'finance',3:'supply_chain',4:'supply_chain',5:'software_engineering',6:'software_engineering'}
          for wave_id,domain_id in expected.items():
              group=[r for r in rows if r['wave_id']==wave_id]
              assert {r['domain_id'] for r in group}=={domain_id}
              assert len(group)==15
          assert all(r['automatic_paid_evaluator'] is False for r in rows)
          assert all(r['no_outcome_aware_rerun'] is True for r in rows)
          print('PASS: held-out 3 domains x 30, 2 domain-pure waves each')
          PY

      - name: Validate deterministic semantic-triage contract
        run: |
          python -m json.tool configs/v5_cross_domain_semantic_triage_v0.1.json >/dev/null
          python -m json.tool schemas/v5_cross_domain_semantic_triage_case_v0.1.schema.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('configs/v5_cross_domain_semantic_triage_v0.1.json'))
          assert p['status']=='FROZEN_DETERMINISTIC_TRIAGE_NO_SEMANTIC_ADJUDICATION'
          assert p['authorization']['provider_calls'] is False
          assert p['authorization']['paid_evaluator_calls'] is False
          assert p['authorization']['r5_probe'] is False
          assert p['authorization']['r7_repair'] is False
          assert p['authorization']['r8_cpr_adjudication'] is False
          print('PASS: semantic triage is deterministic and authorizes no active scientific stage')
          PY

      - name: Validate localized semantic-audit pass-1 contract
        run: |
          python -m json.tool manifests/v5_cross_domain_localized_semantic_audit_review_2026-09-19_v0_1.json >/dev/null
          python -m json.tool schemas/v5_cross_domain_localized_semantic_audit_record_v0.1.schema.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('manifests/v5_cross_domain_localized_semantic_audit_review_2026-09-19_v0_1.json'))
          assert p['status']=='MODEL_REVIEW_PASS1_APPEND_ONLY'
          assert p['selection_rule']['reviewed_case_count']==29
          assert p['domain_counts']=={'finance':5,'software_engineering':8,'supply_chain':16}
          assert len(p['reviewed_case_hashes'])==29
          assert len(set(p['reviewed_case_hashes']))==29
          assert p['uniform_review_decision']['r5_probe_authorized'] is False
          assert p['uniform_review_decision']['r7_repair_authorized'] is False
          print('PASS: localized semantic audit pass 1 freezes review decisions but authorizes no active stage')
          PY

      - name: Validate cross-domain R5 first-wave frozen plan
        run: |
          python -m json.tool configs/v5_cross_domain_r5_first_wave_v0.1.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('configs/v5_cross_domain_r5_first_wave_v0.1.json'))
          assert p['status']=='FROZEN_PRE_EXECUTION_PLAN'
          assert p['geometry']=={
              'case_count':6,
              'replicate_pairs_per_case':2,
              'branches_per_case':4,
              'total_branch_count':24,
              'pair_order_policy':'REPLICATE_1_CONTROL_FIRST_REPLICATE_2_INTERVENTION_FIRST',
          }
          assert [x['wave_id'] for x in p['selected_cases']]==[1,2,3,4,5,6]
          assert len({x['source_case_hash'] for x in p['selected_cases']})==6
          assert all(x['parent_state_hash'] for x in p['selected_cases'])
          assert p['operator']['from_status']=='fact'
          assert p['operator']['to_status']=='unconfirmed'
          assert p['operator']['direct_exposure_limit']==1
          assert p['operator']['persistent_state_mutation'] is False
          assert p['budget']['per_branch_spending_ceiling_usd']==0.25
          assert p['budget']['global_spending_ceiling_usd']==6.0
          assert p['authorization']['paid_evaluator'] is False
          assert p['authorization']['r7_repair'] is False
          assert p['authorization']['r8_cpr_adjudication'] is False
          print('PASS: cross-domain R5 first-wave selection, operator and active-stage boundaries are frozen')
          PY

      - name: Validate historical fixed-parent local-sensitivity frozen plan
        run: |
          python -m json.tool configs/v5_cross_domain_r6_targeted_specificity_v0.1.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('configs/v5_cross_domain_r6_targeted_specificity_v0.1.json'))
          assert p['status']=='FROZEN_POSTHOC_MECHANISM_FOLLOWUP'
          assert p['target_case']['case_id']=='wave-4-8b1731b57396'
          assert p['followup_geometry']['new_pair_count']==8
          assert p['followup_geometry']['new_branch_count']==16
          assert p['followup_geometry']['combined_pair_count_after_success']==10
          assert p['operator']['from_status']=='fact'
          assert p['operator']['to_status']=='unconfirmed'
          assert p['operator']['direct_exposure_limit']==1
          assert p['operator']['persistent_state_mutation'] is False
          assert p['budget']['global_spending_ceiling_usd']==4.0
          assert p['authorization']['paid_evaluator'] is False
          assert p['authorization']['r7_repair'] is False
          assert p['authorization']['r8_cpr_adjudication'] is False
          print('PASS: historical fixed-parent follow-up remains frozen and is interpreted as supplementary local sensitivity')
          PY

      - name: Validate v5.3 probability / structure separation
        run: |
          python scripts/validate_probability_structure_separation_v1.py

      - name: Revalidate Process Reality method layer
        run: python scripts/validate_process_reality_v5.py

      - name: Assert offline path has no provider authorization
        run: |
          python - <<'PY'
          import json
          p=json.load(open('configs/v5_cross_domain_first_round_v0.2.json'))
          g=json.load(open('configs/v5_cross_domain_subject_gate_v0.2.json'))
          assert p['planned_new_natural_trajectories']==90
          assert p['method_development_reference']['included_in_new_replication_sample'] is False
          assert p['paid_subject_execution_authorized'] is False
          assert p['active_probe_authorized'] is False
          assert p['active_repair_authorized'] is False
          assert g['single_authorization_event_for_all_six_waves'] is True
          assert g['provider_execution_authorized'] is False
          print('PASS: v0.2 offline update authorizes no provider/probe/repair calls')
          PY
