name: Single hard post-repair authority contrast E

on:
  push:
    branches: [fix/p2-native-evidence-replay]
    paths:
      - 'configs/stage2_repair_efficacy_hard_authority_request_v1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage2-hard-post-repair-authority-E-v1
  cancel-in-progress: false

jobs:
  hard-authority-E:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enforce one E treatment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          req=json.load(open('configs/stage2_repair_efficacy_hard_authority_request_v1.json'))
          c=json.load(open(req['contract']))
          assert req['execute_single_E'] is True and req['automatic_replay'] is False
          assert c['status']=='FROZEN_BEFORE_SINGLE_E_EXECUTION'
          assert c['control_D']['rerun'] is False
          assert c['arm_E_hard_authority']['automatic_retry'] is False
          repo=os.environ['GITHUB_REPOSITORY']
          run=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"]))
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',
              f"repos/{repo}/actions/workflows/{run['workflow_id']}/runs?per_page=100"]))
          earlier=[r for page in pages for r in page['workflow_runs'] if r['id']<run['id']]
          assert not earlier,'HARD_AUTHORITY_E_ALREADY_REGISTERED_NO_REPLAY'
          PY

      - name: Bind frozen B parent and D control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          c=json.load(open('configs/stage2_repair_efficacy_hard_authority_v1.json'))
          for key in ['source_treatment_B','control_D']:
              row=c[key]
              meta=json.loads(subprocess.check_output(['gh','api',
                f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{row['artifact_id']}"]))
              assert meta['workflow_run']['id']==row['workflow_run']
              assert meta['digest']=='sha256:'+row['artifact_sha256']
          PY
          mkdir -p "$RUNNER_TEMP/prior"
          gh run download 37349337495 --repo "$GITHUB_REPOSITORY"             --name repair-efficacy-first-contrast-408258db42df4a016276ea9f5ecebb8c49e584d9             --dir "$RUNNER_TEMP/prior"

      - name: Bind unchanged official MCP runtime
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk "$RUNNER_TEMP/mcp-sdk"
          git -C "$RUNNER_TEMP/mcp-sdk" checkout -q f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol "$RUNNER_TEMP/mcp-protocol"
          git -C "$RUNNER_TEMP/mcp-protocol" checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          cd "$RUNNER_TEMP/mcp-sdk"
          uv sync --frozen --no-default-groups --python "$(command -v python)"

      - name: Preflight hard authority envelope without provider calls
        run: |
          "$RUNNER_TEMP/mcp-sdk/.venv/bin/python" scripts/run_stage2_repair_efficacy_hard_authority.py             --prior-artifact-root "$RUNNER_TEMP/prior"             --sdk-root "$RUNNER_TEMP/mcp-sdk"             --protocol-root "$RUNNER_TEMP/mcp-protocol"             --out "$RUNNER_TEMP/e-preflight"

      - name: Execute the single E treatment
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          "$RUNNER_TEMP/mcp-sdk/.venv/bin/python" scripts/run_stage2_repair_efficacy_hard_authority.py             --prior-artifact-root "$RUNNER_TEMP/prior"             --sdk-root "$RUNNER_TEMP/mcp-sdk"             --protocol-root "$RUNNER_TEMP/mcp-protocol"             --out "$RUNNER_TEMP/e-treatment"             --execute

      - name: Print retained result
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'e-treatment'
          for rel in ['preflight.json','treatment_E/summary.json','treatment_E/authority_events.json','treatment_E/repair_executor_exit.json']:
              p=root/rel
              if p.exists(): print(json.dumps({'source':rel,'value':json.loads(p.read_bytes())},ensure_ascii=False))
          PY

      - name: Retain full E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-efficacy-hard-authority-E-${{ github.sha }}
          path: |
            ${{ runner.temp }}/e-preflight
            ${{ runner.temp }}/e-treatment
          retention-days: 90
          if-no-files-found: warn
