name: R2-R4 Qwen Reviewer v2 Small Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BAI: ${{ secrets.BAI }}
      BAILIAN_BASE_URL: ${{ vars.BAILIAN_BASE_URL }}
      BAILIAN_MODEL: ${{ vars.BAILIAN_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Download frozen compact R2 packets
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34990393003
          name: r234-reviewer-v2-compact-packets-34990393003
          path: inputs/compact
      - name: Run five-packet runtime preflight
        run: |
          python -m arena.run_bailian_reviewer_v2_preflight --r2 inputs/compact/compact_r2_packets.jsonl --count 5 --outdir qwen_preflight
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r234-qwen-reviewer-v2-preflight-${{ github.run_id }}
          path: qwen_preflight/
          if-no-files-found: error
          retention-days: 90
