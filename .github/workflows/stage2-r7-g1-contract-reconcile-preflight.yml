name: Stage-II R7 G1 Contract Reconcile Preflight

on:
  push:
    branches:
      - stage2-gpt56sol-full-context-audit-results-v1
    paths:
      - "stage2/r7_prospective_v1/replication_contract.py"
      - "scripts/validate_stage2_r7_g1_execution_readiness_v1.py"
      - ".github/workflows/stage2-r7-g1-contract-reconcile-preflight.yml"

permissions:
  contents: write

concurrency:
  group: stage2-r7-g1-contract-reconcile-preflight-v1
  cancel-in-progress: false

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate reconciled G1 contract
        run: |
          set -euo pipefail
          python scripts/validate_stage2_r7_g1_execution_readiness_v1.py
          python - <<'PY'
          import json
          from stage2.r7_prospective_v1.replication_contract import resolve_decision_horizon, run_id, semantic_audit_state
          subject=json.load(open("stage2/subject.json"))
          assert subject["limits"]["max_turns"]==32
          assert subject["limits"]["max_total_model_invocations"]==64
          assert resolve_decision_horizon(group_id="StageII-R7-G1",subject=subject,requested=64)==64
          assert run_id(group_id="StageII-R7-G1",cell_id="X2-T1")=="StageII-R7-G1-X2-T1"
          assert semantic_audit_state(group_id="StageII-R7-G1")=="LOCKED_UNTIL_A_AND_B_FROZEN"
          print("G1_CONTRACT_RECONCILIATION=PASS")
          print("PROVIDER_CALLS=0")
          PY

  x2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}}
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - name: Bind pinned MetaGPT
        run: |
          set -euo pipefail
          git clone -q https://github.com/FoundationAgents/MetaGPT upstream
          git -C upstream checkout -q 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          python -m pip install -q --upgrade pip
          grep -v '^lancedb==0.4.0$' upstream/requirements.txt > /tmp/metagpt-requirements-stage2.txt
          python -m pip install -q -r /tmp/metagpt-requirements-stage2.txt
          python -m pip install -q 'pyarrow==14.0.2'
          python -m pip install -q --no-deps -e upstream
      - run: python -m stage2.r7_prospective_v1.execution_readiness_preflight --system X2 --out-root readiness_x2
      - uses: actions/upload-artifact@v4
        with: {name: g1-reconcile-x2-${{ github.run_id }}, path: readiness_x2, retention-days: 30}

  x4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Bind exact MCP
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk upstream
          git -C upstream checkout -q f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol protocol
          git -C protocol checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          (cd upstream && uv sync --frozen --no-default-groups)
      - name: Run X4 zero-provider wrapper preflight
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: upstream/.venv/bin/python -m stage2.r7_prospective_v1.execution_readiness_preflight --system X4 --out-root readiness_x4
      - uses: actions/upload-artifact@v4
        with: {name: g1-reconcile-x4-${{ github.run_id }}, path: readiness_x4, retention-days: 30}

  x5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m stage2.r7_prospective_v1.execution_readiness_preflight --system X5 --out-root readiness_x5
      - uses: actions/upload-artifact@v4
        with: {name: g1-reconcile-x5-${{ github.run_id }}, path: readiness_x5, retention-days: 30}

  x6:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}}
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - name: Bind exact MemoryBank
        run: |
          set -euo pipefail
          git clone -q https://github.com/zhongwanjun/MemoryBank-SiliconFriend upstream
          git -C upstream checkout -q cf61c4196e4cfdb0f2b7a0316249fa40312dc3a9
          python -m pip install -q --upgrade pip
          python -m pip install -q 'torch==2.0.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'numpy==1.24.4' 'pydantic==1.10.13' 'huggingface-hub==0.14.1' 'tokenizers==0.13.3' 'transformers==4.28.0' 'faiss-cpu==1.7.4' 'scipy==1.10.1' 'scikit-learn==1.3.2' 'nltk==3.9.1' 'Pillow==10.4.0' 'unstructured==0.6.10' 'langchain==0.0.146'
          python -m pip install -q --no-deps 'sentence-transformers==2.2.2'
      - env: {TOKENIZERS_PARALLELISM: "false", HF_HUB_OFFLINE: "1", TRANSFORMERS_OFFLINE: "1"}
        run: python -m stage2.r7_prospective_v1.execution_readiness_preflight --system X6 --out-root readiness_x6 --upstream-root upstream
      - uses: actions/upload-artifact@v4
        with: {name: g1-reconcile-x6-${{ github.run_id }}, path: readiness_x6, retention-days: 30}

  x7:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Bind exact LongLLMLingua
        run: |
          set -euo pipefail
          git clone -q https://github.com/microsoft/LLMLingua upstream
          git -C upstream checkout -q 5a4c78ae18ab17a98cf997e8259354e546081d64
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' 'accelerate>=0.33,<1' tiktoken nltk numpy tokenizers safetensors
          python -m pip install -q --no-deps -e upstream
      - env: {TOKENIZERS_PARALLELISM: "false"}
        run: python -m stage2.r7_prospective_v1.execution_readiness_preflight --system X7 --out-root readiness_x7
      - uses: actions/upload-artifact@v4
        with: {name: g1-reconcile-x7-${{ github.run_id }}, path: readiness_x7, retention-days: 30}

  freeze:
    runs-on: ubuntu-latest
    needs: [static-contract, x2, x4, x5, x6, x7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Freeze zero-provider contract reconciliation
        run: |
          set -euo pipefail
          mkdir -p stage2/r7_g1_v1/control
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          payload={
            "schema":"stage2-r7-g1-contract-reconcile-freeze-v1",
            "state":"PASS_ZERO_PROVIDER",
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "science_sha":os.environ["GITHUB_SHA"],
            "subject_provider_calls":0,
            "paid_evaluator_calls":0,
            "active_repairs":0,
            "native_role_turn_ceiling":32,
            "logical_model_decision_ceiling":64,
            "prospective_group_id":"StageII-R7-G1",
            "legacy_alias":"StageII-R7-G1-LEGACY",
            "active_systems":["X2","X4","X5","X6","X7"],
            "all_active_zero_provider_preflights_passed":True,
            "external_frameworks_modified":False,
            "subject_config_modified":False,
            "next_gate":"NEW_EXPLICIT_PROVIDER_BACKED_PHASE_A_AUTHORIZATION"
          }
          Path("stage2/r7_g1_v1/control/contract_reconcile_freeze_v1.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name "stage2-r7-g1-reconcile-bot"
          git config user.email "stage2-r7-g1-reconcile@users.noreply.github.com"
          git add stage2/r7_g1_v1/control/contract_reconcile_freeze_v1.json
          git commit -m "Freeze G1 zero-provider contract reconciliation [run $GITHUB_RUN_ID]"
          git push origin HEAD:stage2-gpt56sol-full-context-audit-results-v1
