name: NMI P4 FA03 Validate
on:
  push:
    branches: [main]
    paths:
      - 'docs/submission/nmi/NMI_Manuscript_v0.8.md'
      - 'docs/submission/nmi/NMI_P4_Recursive_Monitor_Repair_Governance_Attack_v1.md'
      - 'docs/submission/nmi/NMI_Reviewer_Attack_Matrix_v1.7.md'
      - 'docs/submission/nmi/NMI_P4_Reviewer_Attack_Status_v0.7.md'
      - 'configs/nmi_submission_contract_v1.9.json'
      - 'manifests/nmi_p4_fa03_recursive_monitor_repair_2026-09-21_v0_1.json'
      - 'scripts/validate_nmi_p4_fa03_v0_1.py'
      - '.github/workflows/nmi-p4-fa03-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate_nmi_p4_fa03_v0_1.py
