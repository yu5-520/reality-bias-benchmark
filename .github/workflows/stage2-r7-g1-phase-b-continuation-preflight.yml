name: Stage-II R7 G1 Phase B Zero-Call Continuation Preflight

on:
  push:
    branches:
      - stage2-gpt56sol-full-context-audit-results-v1
    paths:
      - ".github/workflows/stage2-r7-g1-phase-b-continuation-preflight.yml"

permissions:
  contents: read

concurrency:
  group: stage2-r7-g1-phase-b-continuation-preflight-v1
  cancel-in-progress: true

env:
  B_CODE_SHA: 2dcfbd46551842bb96a7ea295f69adcdc2abd745
  EVIDENCE_SHA: 9d2e568274cada672501b08515476a61ab92e4bc

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {system: X2, task: T1, python: "3.10"}
          - {system: X2, task: T2, python: "3.10"}
          - {system: X2, task: T3, python: "3.10"}
          - {system: X4, task: T1, python: "3.11"}
          - {system: X4, task: T2, python: "3.11"}
          - {system: X4, task: T3, python: "3.11"}
          - {system: X5, task: T1, python: "3.11"}
          - {system: X5, task: T2, python: "3.11"}
          - {system: X5, task: T3, python: "3.11"}
          - {system: X7, task: T1, python: "3.11"}
          - {system: X7, task: T2, python: "3.11"}
          - {system: X7, task: T3, python: "3.11"}

    steps:
      - name: Checkout exact B code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.B_CODE_SHA }}
          path: bcode
          fetch-depth: 1

      - name: Checkout exact frozen evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          path: evidence
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Bind exact X2 MetaGPT environment
        if: matrix.system == 'X2'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/FoundationAgents/MetaGPT /tmp/stage2-x2-metagpt
          git -C /tmp/stage2-x2-metagpt checkout -q 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          python -m pip install -q --upgrade pip
          grep -v '^lancedb==0.4.0$' /tmp/stage2-x2-metagpt/requirements.txt > /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q -r /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q 'pyarrow==14.0.2'
          python -m pip install -q --no-deps -e /tmp/stage2-x2-metagpt

      - name: Bind exact X4 MCP environment
        if: matrix.system == 'X4'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk /tmp/stage2-x4-mcp
          git -C /tmp/stage2-x4-mcp checkout -q f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol /tmp/stage2-x4-protocol
          git -C /tmp/stage2-x4-protocol checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          (cd /tmp/stage2-x4-mcp && uv sync --frozen --no-default-groups)
          test -x /tmp/stage2-x4-mcp/.venv/bin/python

      - name: Bind exact X7 LongLLMLingua environment and study checkpoint
        if: matrix.system == 'X7'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/microsoft/LLMLingua /tmp/stage2-x7-longllmlingua
          git -C /tmp/stage2-x7-longllmlingua checkout -q 5a4c78ae18ab17a98cf997e8259354e546081d64
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' 'accelerate>=0.33,<1' tiktoken nltk numpy tokenizers safetensors
          python -m pip install -q --no-deps -e /tmp/stage2-x7-longllmlingua
          rm -rf /tmp/stage2-x7-study
          (cd bcode && python -m stage2.study_assets.validate --probe X7 --out-root /tmp/stage2-x7-study)

      - name: Exercise full restore-repair-continuation path with local fake provider
        env:
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/bcode${PYTHONPATH:+:$PYTHONPATH}"
          PYBIN=python
          if [ "$SYS" = X4 ]; then PYBIN=/tmp/stage2-x4-mcp/.venv/bin/python; fi
          "$PYBIN" - <<'PY'
          import asyncio, json, os
          from pathlib import Path
          import stage2.r7_prospective_v1.repair_b_runner as rb

          class LocalFakeProvider:
              def complete_agent(self, messages, metadata=None):
                  metadata=metadata or {}
                  if metadata.get("role")=="r7_repair_agent":
                      spec=json.loads(messages[-1]["content"])
                      target=spec["repair_target_ref"]
                      if target.startswith("file:"):
                          current=spec["current_target_content"]
                          repair={"kind":"file_replace","target_ref":target,
                                  "content":current+"\n# zero-call full-continuation preflight\n",
                                  "reason":"local fake repair for execution-path validation"}
                      else:
                          repair={"kind":"process_revision","target_ref":target,
                                  "instruction":"Revalidate only the frozen targeted process state before continuing.",
                                  "reason":"local fake repair for execution-path validation"}
                      return {"content":json.dumps({"repair":repair})}
                  return {"content":json.dumps({"actions":[{"type":"finalize","answer":"zero-call continuation preflight"}]})}

          rb._build_subject_provider=lambda subject: LocalFakeProvider()
          cell=f'{os.environ["SYS"]}-{os.environ["TASK"]}'
          readiness=json.loads(Path("evidence/stage2/r7_g1_v1/control/phase_b_readiness_v2.json").read_text())
          row=next(x for x in readiness["cells"] if x["cell_id"]==cell)
          kwargs={}
          if os.environ["SYS"]=="X7":
              kwargs={
                  "x7_checkpoint":"/tmp/stage2-x7-study/checkpoint",
                  "x7_checkpoint_manifest":"bcode/stage2/native_v7/study/x7_checkpoint_manifest.json",
              }
          result=asyncio.run(rb.run_one(
              cell=cell,
              a_archive=Path(f"evidence/stage2/r7_g1_v1/natural_A_provider_v2/{cell}/first_attempt.tar.gz"),
              selection_row=row,
              out_root=Path(f"/tmp/stage2-r7-g1-b-continuation-preflight/{cell}"),
              dry_run=False,
              **kwargs,
          ))
          assert result["status"]=="REPAIR_B_FROZEN"
          assert result["repair_action_count"]==1
          assert result["repair_agent_calls"]==1
          assert result["post_repair_monitor_mode"]=="WATCH_ONLY"
          assert result["post_repair_repair_packages"]==0
          print(json.dumps({"cell":cell,"status":"PASS","fake_provider_calls":result["total_B_provider_calls"]},sort_keys=True))
          PY

      - name: Upload continuation-preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage2-r7-g1-b-continuation-preflight-${{ matrix.system }}-${{ matrix.task }}-${{ github.run_id }}
          path: /tmp/stage2-r7-g1-b-continuation-preflight/
          if-no-files-found: error
          retention-days: 30
