name: V5.4 Cross-Domain R5 Canonical Wave4

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  execute:
    if: >-
      github.event.issue.user.login == 'yu5-520' &&
      github.event.issue.title == 'V5.4 CROSS-DOMAIN R5 CANONICAL WAVE4'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AUTH_BODY: ${{ github.event.issue.body }}
      PLAN_CONFIG: configs/v5_4_cross_domain_r5_canonical_wave4_v0.1.json
      EXPECTED_AUTHORIZATION_PHRASE: CALL_REAL_V5_CROSS_DOMAIN_R5_CANONICAL_API
      PER_BRANCH_MAX_CALLS: '64'
      PER_BRANCH_CEILING_USD: '0.25'
      GLOBAL_CEILING_USD: '1.00'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact canonical Wave4 authorization
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          rows={}
          for raw in os.environ['AUTH_BODY'].splitlines():
              line=raw.strip()
              if not line: continue
              if '=' not in line: raise SystemExit('invalid authorization line')
              k,v=line.split('=',1)
              if k in rows: raise SystemExit('duplicate authorization key '+k)
              rows[k]=v
          required={'authorization_phrase','expected_main_sha','authorization_id','control_plane'}
          assert set(rows)==required, sorted(rows)
          assert rows['authorization_phrase']==os.environ['EXPECTED_AUTHORIZATION_PHRASE']
          assert rows['expected_main_sha']==os.environ['GITHUB_SHA']
          assert rows['control_plane']=='CHAT_AUTHORIZATION_BRIDGE_V5_4_R5_CANONICAL_WAVE4_v0.1'
          assert re.fullmatch(r'[A-Za-z0-9._-]{8,80}',rows['authorization_id'])
          print('PASS: exact canonical Wave4 authorization')
          PY

      - name: Verify exact frozen natural source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          p=json.load(open(os.environ['PLAN_CONFIG']))
          repo=os.environ['GITHUB_REPOSITORY']
          run_id=p['source_subject']['workflow_run_id']
          payload=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}/artifacts'],text=True))
          expected=[p['source_subject']['manifest_artifact'],*p['source_subject']['wave_artifacts']]
          for item in expected:
              rows=[x for x in payload['artifacts'] if x['id']==item['id'] and x['name']==item['name']]
              assert len(rows)==1
              assert rows[0].get('digest')==item['digest']
              assert not rows[0].get('expired')
          print('PASS: exact natural source artifacts verified')
          PY

      - name: Download natural source bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source/manifest source/waves
          python - <<'PY' > "$RUNNER_TEMP/v54_wave4.env"
          import json,os
          p=json.load(open(os.environ['PLAN_CONFIG']))
          print('RUN_ID='+str(p['source_subject']['workflow_run_id']))
          print('MANIFEST_NAME='+p['source_subject']['manifest_artifact']['name'])
          for x in p['source_subject']['wave_artifacts']:
              print('WAVE_NAME_'+str(x['wave_id'])+'='+x['name'])
          PY
          source "$RUNNER_TEMP/v54_wave4.env"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$MANIFEST_NAME" --dir source/manifest
          for i in 1 3 4 6; do
            var="WAVE_NAME_$i"
            mkdir -p "source/waves/artifact-$i"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "${!var}" --dir "source/waves/artifact-$i"
          done
          test "$(find source/manifest -name subject_manifest.jsonl -type f | wc -l)" -eq 1
          test "$(find source/waves -name traces.jsonl -type f | wc -l)" -eq 4

      - name: Prepare canonical four-branch R5 plan
        run: |
          set -euo pipefail
          SOURCE_MANIFEST="$(find source/manifest -name subject_manifest.jsonl -type f)"
          python -m arena.prepare_v5_cross_domain_r5_canonical             --case-config "$PLAN_CONFIG"             --source-manifest "$SOURCE_MANIFEST"             --source-root source/waves             --branch-code-sha "$GITHUB_SHA"             --outdir prepared/r5_canonical_wave4
          python - <<'PY'
          import json
          p=json.load(open('prepared/r5_canonical_wave4/plan.json'))
          assert p['case_count']==4
          assert p['branch_count']==4
          assert p['synthetic_control_branch_count']==0
          assert p['canonical_replicate_count']==1
          assert p['natural_reference_rerun_required'] is False
          print('PASS: canonical Wave4 geometry is exactly four paid branches')
          PY

      - name: Run offline lifecycle preflight
        run: |
          python -m arena.run_v5_cross_domain_r5_canonical             --plan-dir prepared/r5_canonical_wave4             --provider deepseek             --execution-code-sha "$GITHUB_SHA"             --per-branch-max-calls "$PER_BRANCH_MAX_CALLS"             --per-branch-spending-ceiling "$PER_BRANCH_CEILING_USD"             --global-spending-ceiling "$GLOBAL_CEILING_USD"             --currency USD             --preflight-only

      - name: Execute four canonical R5-I continuations
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m arena.run_v5_cross_domain_r5_canonical             --plan-dir prepared/r5_canonical_wave4             --outdir results/v5_4_cross_domain_r5_canonical_wave4/raw             --provider deepseek             --execution-code-sha "$GITHUB_SHA"             --per-branch-max-calls "$PER_BRANCH_MAX_CALLS"             --per-branch-spending-ceiling "$PER_BRANCH_CEILING_USD"             --global-spending-ceiling "$GLOBAL_CEILING_USD"             --currency USD             --authorization-phrase "$EXPECTED_AUTHORIZATION_PHRASE"             --execute-real-api

      - name: Freeze canonical R5 evidence
        if: always()
        run: |
          set -euo pipefail
          if [ -s results/v5_4_cross_domain_r5_canonical_wave4/raw/traces.jsonl ]; then
            python -m arena.freeze_v5_cross_domain_r5_canonical               --raw-dir results/v5_4_cross_domain_r5_canonical_wave4/raw               --plan-dir prepared/r5_canonical_wave4               --out results/v5_4_cross_domain_r5_canonical_wave4/evidence_batch.json
          else
            echo 'No canonical Wave4 traces available to freeze.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable canonical Wave4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-4-cross-domain-r5-canonical-wave4-${{ github.run_id }}
          path: |
            configs/v5_4_cross_domain_r5_canonical_wave4_v0.1.json
            prepared/r5_canonical_wave4/
            results/v5_4_cross_domain_r5_canonical_wave4/
          if-no-files-found: warn
          retention-days: 90

      - name: Record completed canonical Wave4 R5
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/v54_wave4_done.env"
          import json
          p=json.load(open('results/v5_4_cross_domain_r5_canonical_wave4/raw/summary.json'))
          e=json.load(open('results/v5_4_cross_domain_r5_canonical_wave4/evidence_batch.json'))
          print('TRACE_COUNT='+str(p['preserved_trace_count']))
          print('SPEND='+str(p['estimated_total_spend']))
          print('SUMMARY_HASH='+p['summary_hash'])
          print('EVIDENCE_HASH='+e['evidence_batch_hash'])
          PY
          source "$RUNNER_TEMP/v54_wave4_done.env"
          body="V5.4 canonical R5 Wave4 completed.\n\nCases: 4. New R5-I trajectories: $TRACE_COUNT. Synthetic controls: 0. Canonical replicates: 1.\nEstimated provider spend: USD $SPEND.\nRun summary hash: $SUMMARY_HASH.\nEvidence batch hash: $EVIDENCE_HASH.\n\nNext stage is passive R6 structural + semantic audit. R7 not authorized. CPR NOT_ADJUDICATED."
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
