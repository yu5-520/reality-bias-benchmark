name: Stage-II native v7 offline architecture

on:
  push:
    paths:
      - 'stage2/native_v7/**'
      - 'stage2/tasks.json'
      - 'stage2/roles.json'
      - 'stage2/subject.json'
      - 'stage2/fixtures/project/**'
      - 'docs/R_Plan_v7.9.md'
      - 'schemas/stage2_subject_readiness_receipt_v1.schema.json'
      - '.github/workflows/stage2-native-v7-offline.yml'
  pull_request:
    paths:
      - 'stage2/native_v7/**'
      - 'stage2/tasks.json'
      - 'stage2/roles.json'
      - 'stage2/subject.json'
      - 'stage2/fixtures/project/**'
      - 'docs/R_Plan_v7.9.md'
      - 'schemas/stage2_subject_readiness_receipt_v1.schema.json'
      - '.github/workflows/stage2-native-v7-offline.yml'

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m stage2.native_v7.freeze
      - run: python -m unittest discover -s stage2/native_v7/tests -v
