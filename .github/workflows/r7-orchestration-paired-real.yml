name: R7 Three-Arm Frozen-Parent Prepare

on:
  workflow_dispatch:
    inputs:
      replicates:
        description: 'Matched same-parent triads to prepare; same-parent repeats are not independent samples'
        required: true
        default: '1'
        type: string

concurrency:
  group: r7-three-arm-frozen-parent-prepare
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current R7 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate current R7 three-arm protocol
        run: |
          set -euo pipefail
          python scripts/validate_r7_protocol.py configs/r7/r7_three_arm_fixture.example.json
          python -m arena.r7_structural_control_preflight --outdir /tmp/r7_structural_control_preflight

      - name: Verify exact frozen R5 prepared source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/r7_source.env"
          import json
          p=json.load(open('configs/r7/r7_three_arm_fixture.example.json'))['frozen_parent']
          print('SOURCE_RUN_ID='+str(p['prepared_workflow_run_id']))
          print('SOURCE_ARTIFACT_ID='+str(p['prepared_artifact_id']))
          print('SOURCE_ARTIFACT_NAME='+p['prepared_artifact_name'])
          print('SOURCE_ARTIFACT_DIGEST='+p['prepared_artifact_digest'])
          print('SOURCE_INNER_SHA='+p['prepared_inner_tar_sha256'])
          PY
          source "$RUNNER_TEMP/r7_source.env"
          python - <<'PY'
          import json, subprocess
          p=json.load(open('configs/r7/r7_three_arm_fixture.example.json'))['frozen_parent']
          payload=json.loads(subprocess.check_output(['gh','api',f"repos/${{ github.repository }}/actions/runs/{p['prepared_workflow_run_id']}/artifacts"], text=True))
          rows=[x for x in payload['artifacts'] if x['id']==p['prepared_artifact_id'] and x['name']==p['prepared_artifact_name']]
          assert len(rows)==1
          assert rows[0].get('digest')==p['prepared_artifact_digest']
          assert not rows[0].get('expired')
          print('R7_SOURCE_R5_PREPARED_ARTIFACT=EXACT_MATCH')
          PY

      - name: Download and verify frozen R5 parent plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/r7_source.env"
          mkdir -p "$RUNNER_TEMP/r7_r5_artifact" "$RUNNER_TEMP/r7_r5_prepared"
          gh run download "$SOURCE_RUN_ID" \
            --repo '${{ github.repository }}' \
            --name "$SOURCE_ARTIFACT_NAME" \
            --dir "$RUNNER_TEMP/r7_r5_artifact"
          cd "$RUNNER_TEMP/r7_r5_artifact"
          sha256sum -c r5mid_prospective_one_shot_prepared_v0_3.tar.gz.sha256
          test "$(sha256sum r5mid_prospective_one_shot_prepared_v0_3.tar.gz | awk '{print $1}')" = "$SOURCE_INNER_SHA"
          tar -xzf r5mid_prospective_one_shot_prepared_v0_3.tar.gz -C "$RUNNER_TEMP/r7_r5_prepared"

      - name: Build exact R7 Phase-1 parent-bound plan — zero provider calls
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python -m arena.prepare_r7_three_arm_plan \
            --protocol configs/r7/r7_three_arm_fixture.example.json \
            --r5-plan-dir "$RUNNER_TEMP/r7_r5_prepared/results/r5mid_prospective_one_shot_plan_v0_3" \
            --replicates '${{ inputs.replicates }}' \
            --plan-code-sha '${{ github.sha }}' \
            --outdir results/r7_three_arm_parent_bound_plan

      - name: Fail closed on current C3 execution boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('results/r7_three_arm_parent_bound_plan/r7_plan.json'))
          rows=[json.loads(x) for x in open('results/r7_three_arm_parent_bound_plan/arm_manifests.jsonl')]
          assert p['phase']=='R7_PHASE1_REAL_PARENT_BINDING_PREPARED_ONLY'
          assert p['source_binding']['source_parent_state_hash']=='aca000a63106a393efe35dad4e0051e09f0e0cf0d6ced09640f6f9fd2eb2a47c'
          assert p['matched_horizon']['post_jump_turn_cap']==8
          assert p['paid_subject_authorization_status']=='NOT_AUTHORIZED'
          assert p['automatic_paid_evaluator'] is False
          assert p['real_three_arm_execution_ready'] is False
          assert p['blocking_reason']=='C3_ACTIVE_ALR_LOCALIZED_REEXECUTION_NOT_IMPLEMENTED'
          assert all(x['execution_readiness']=='RUNTIME_TRANSFORM_READY' for x in rows if x['arm_id'] in ('C1_ONE_SHOT','C2_PERSISTENT_FIELD'))
          assert all(x['execution_readiness']=='BLOCKED_PENDING_ACTIVE_ALR_EXECUTOR' for x in rows if x['arm_id']=='C3_ALR')
          print('R7_PARENT_BOUND_PREPARE=PASS')
          print('PAID_SUBJECT_CALLS=DISABLED')
          print('C3_REAL_EXECUTION=FAIL_CLOSED')
          PY

      - name: Archive R7 parent-bound plan
        run: |
          set -euo pipefail
          tar -czf r7_three_arm_parent_bound_plan.tar.gz results/r7_three_arm_parent_bound_plan
          sha256sum r7_three_arm_parent_bound_plan.tar.gz > r7_three_arm_parent_bound_plan.tar.gz.sha256
          cat results/r7_three_arm_parent_bound_plan/r7_plan.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prepared R7 plan
        uses: actions/upload-artifact@v4
        with:
          name: r7-three-arm-parent-bound-plan-${{ github.run_id }}
          path: |
            r7_three_arm_parent_bound_plan.tar.gz
            r7_three_arm_parent_bound_plan.tar.gz.sha256
          retention-days: 90
