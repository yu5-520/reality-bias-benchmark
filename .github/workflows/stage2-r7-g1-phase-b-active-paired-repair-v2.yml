name: Stage-II R7 G1 Phase B Active Paired Repair v2 Zero-Call Recovery

on:
  push:
    branches:
      - stage2-gpt56sol-full-context-audit-results-v1
    paths:
      - ".github/workflows/stage2-r7-g1-phase-b-active-paired-repair-v2.yml"
      - "configs/stage2_r7_g1_phase_b_active_authorization_v2.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: stage2-r7-g1-phase-b-active-paired-repair-v2
  cancel-in-progress: false

env:
  B_CODE_SHA: 2dcfbd46551842bb96a7ea295f69adcdc2abd745
  AUTH_CONFIG_SHA: 02c447155e3586d2c17231d802938f678e658b75
  INPUT_EVIDENCE_SHA: c62fd836cb25171f428fe0cc7b54e457c76efe8a
  EVIDENCE_BRANCH: stage2-r7-g1-evidence-v1
  AUTH_ISSUE: "286"
  B_EVIDENCE_ROOT: stage2/r7_g1_v1/repair_B_provider_v2

jobs:
  paired-b:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {system: X2, task: T1, python: "3.10"}
          - {system: X2, task: T2, python: "3.10"}
          - {system: X2, task: T3, python: "3.10"}
          - {system: X4, task: T1, python: "3.11"}
          - {system: X4, task: T2, python: "3.11"}
          - {system: X4, task: T3, python: "3.11"}
          - {system: X5, task: T1, python: "3.11"}
          - {system: X5, task: T2, python: "3.11"}
          - {system: X5, task: T3, python: "3.11"}
          - {system: X7, task: T1, python: "3.11"}
          - {system: X7, task: T2, python: "3.11"}
          - {system: X7, task: T3, python: "3.11"}

    steps:
      - name: Checkout exact authorization config
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTH_CONFIG_SHA }}
          path: auth
          fetch-depth: 1

      - name: Checkout exact frozen B code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.B_CODE_SHA }}
          path: bcode
          fetch-depth: 1

      - name: Checkout exact frozen A and preflight evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INPUT_EVIDENCE_SHA }}
          path: evidence-input
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify Phase B authorization and frozen gates
        env:
          GH_TOKEN: ${{ github.token }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C auth rev-parse HEAD)" = "$AUTH_CONFIG_SHA"
          test "$(git -C bcode rev-parse HEAD)" = "$B_CODE_SHA"
          test "$(git -C evidence-input rev-parse HEAD)" = "$INPUT_EVIDENCE_SHA"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          cfg=json.loads(Path("auth/configs/stage2_r7_g1_phase_b_active_authorization_v2.json").read_text())
          cell=f'{os.environ["SYS"]}-{os.environ["TASK"]}'
          expected=[
              "X2-T1","X2-T2","X2-T3",
              "X4-T1","X4-T2","X4-T3",
              "X5-T1","X5-T2","X5-T3",
              "X7-T1","X7-T2","X7-T3",
          ]
          assert cfg["status"]=="AUTHORIZED_ZERO_CALL_PREPROVIDER_RECOVERY_V2"
          assert cfg["authorization_issue"]==286
          assert cfg["phase"]=="PHASE_B_PAIRED_REPAIR_12_READY_CELLS_ZERO_CALL_RECOVERY_V2"
          assert cfg["b_code_sha"]==os.environ["B_CODE_SHA"]
          assert cfg["input_evidence_sha"]==os.environ["INPUT_EVIDENCE_SHA"]
          assert cfg["evidence_branch"]==os.environ["EVIDENCE_BRANCH"]
          assert cfg["b_evidence_root"]==os.environ["B_EVIDENCE_ROOT"]
          assert cfg["ready_cells"]==expected
          assert cell in expected
          assert cfg["blocked_cells"]==["X6-T1","X6-T2","X6-T3"]
          assert cfg["blocked_reason"]=="FOREIGN_PARENT_STATE_RECONSTRUCTION_BLOCKED"
          assert cfg["one_B_per_cell"] is True
          assert cfg["first_B_stochastic_attempt_only"] is True
          assert cfg["repair_agent_calls_per_cell"]==1
          assert cfg["repair_agent_retries"]==0
          assert cfg["max_parallel"]==4
          assert cfg["preserve_failed_B_attempt"] is True
          assert cfg["repair_executor_exits_after_one_package"] is True
          assert cfg["post_repair_monitor_mode"]=="WATCH_ONLY"
          assert cfg["post_repair_additional_repair_packages"]==0
          assert cfg["semantic_audit_locked_until_all_B_frozen"] is True
          assert cfg["selection_uses_semantic_audit"] is False
          assert cfg["selection_uses_cpr_labels"] is False
          assert cfg["paid_evaluator_calls"]==0
          assert cfg["natural_A_reruns"]==0
          assert cfg["x6_provider_calls"]==0
          assert cfg["zero_call_continuation_preflight_run"]==36298772109
          assert cfg["source_failed_run"]==36299266423
          assert cfg["source_failed_total_B_provider_calls"]==0
          assert cfg["source_failed_B_stochastic_attempts_consumed"]==0
          assert cfg["group_claim_commit"]==os.environ["INPUT_EVIDENCE_SHA"]

          readiness=json.loads(Path("evidence-input/stage2/r7_g1_v1/control/phase_b_readiness_v2.json").read_text())
          assert readiness["status"]=="PASS_WITH_FAIL_CLOSED_SUBSET"
          assert readiness["execution_ready_count"]==12
          assert readiness["execution_ready_cells"]==expected
          assert readiness["execution_blocked_count"]==3

          p1=json.loads(Path("evidence-input/stage2/r7_g1_v1/control/phase_b_zero_call_preflight_seal_v1.json").read_text())
          assert p1["status"]=="PASS_12_OF_12_EXECUTION_READY_CELLS"
          assert p1["provider_calls"]==0
          p2=json.loads(Path("evidence-input/stage2/r7_g1_v1/control/phase_b_zero_call_continuation_preflight_seal_v1.json").read_text())
          assert p2["status"]=="PASS_12_OF_12_FULL_RESTORE_REPAIR_CONTINUATION"
          assert p2["workflow_run_id"]==36298772109
          assert p2["b_code_sha"]==os.environ["B_CODE_SHA"]
          assert p2["external_provider_calls"]==0
          assert p2["scientific_repair_actions"]==0

          quarantine=json.loads(Path("evidence-input/stage2/r7_g1_v1/control/phase_b_active_v1_preprovider_abort_quarantine_v1.json").read_text())
          assert quarantine["state"]=="QUARANTINED_NOT_B_EVIDENCE"
          assert quarantine["source_workflow_run_id"]==36299266423
          assert quarantine["claim_markers_created"]==0
          assert quarantine["repair_b_runner_invoked_cells"]==0
          assert quarantine["total_B_provider_calls"]==0
          assert quarantine["B_stochastic_attempts_consumed"]==0
          claim=json.loads(Path("evidence-input/stage2/r7_g1_v1/control/phase_b_provider_v2_group_claim_v1.json").read_text())
          assert claim["state"]=="IRREVERSIBLY_CLAIMED_BEFORE_ANY_B_PROVIDER_CALL"
          assert claim["authorization_issue"]==286
          assert claim["claimed_cells"]==expected
          assert claim["b_code_sha"]==os.environ["B_CODE_SHA"]
          assert claim["b_evidence_root"]==os.environ["B_EVIDENCE_ROOT"]
          assert claim["preclaim_total_B_provider_calls"]==0
          assert claim["preclaim_B_stochastic_attempts_consumed"]==0

          issue=json.loads(subprocess.check_output([
              "gh","api",f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/286'
          ],text=True))
          assert issue["user"]["login"]=="yu5-520"
          assert issue["title"]=="STAGE2 R7 G1 PHASE B ZERO-CALL CLAIM RECOVERY v2 AUTHORIZATION"
          body=issue["body"]
          for needle in [
              "phase=PHASE_B_PAIRED_REPAIR_12_READY_CELLS_ZERO_CALL_RECOVERY_V2",
              "cells="+",".join(expected),
              "blocked_cells=X6-T1,X6-T2,X6-T3",
              "group_claim_required_before_provider_calls=true",
              "one_B_per_cell=true",
              "repair_agent_calls_per_cell=1",
              "repair_agent_retries=0",
              "post_repair_monitor_mode=WATCH_ONLY",
              "natural_A_reruns=0",
              "x6_provider_calls=0",
          ]:
              assert needle in body
          print("PASS: Phase B recovery-v2 authorization, zero-call abort quarantine, irreversible group claim and exact inputs are frozen")
          PY

      - name: Bind exact X2 MetaGPT environment
        if: matrix.system == 'X2'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/FoundationAgents/MetaGPT /tmp/stage2-x2-metagpt
          git -C /tmp/stage2-x2-metagpt checkout -q 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          test "$(git -C /tmp/stage2-x2-metagpt rev-parse HEAD)" = 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          python -m pip install -q --upgrade pip
          grep -v '^lancedb==0.4.0$' /tmp/stage2-x2-metagpt/requirements.txt > /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q -r /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q 'pyarrow==14.0.2'
          python -m pip install -q --no-deps -e /tmp/stage2-x2-metagpt

      - name: Bind exact X4 MCP environment
        if: matrix.system == 'X4'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk /tmp/stage2-x4-mcp
          git -C /tmp/stage2-x4-mcp checkout -q f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol /tmp/stage2-x4-protocol
          git -C /tmp/stage2-x4-protocol checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          test "$(git -C /tmp/stage2-x4-mcp rev-parse HEAD)" = f1b6589088534632fef92238ee9750951e3c0185
          test "$(git -C /tmp/stage2-x4-protocol rev-parse HEAD)" = 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          (cd /tmp/stage2-x4-mcp && uv sync --frozen --no-default-groups)
          test -x /tmp/stage2-x4-mcp/.venv/bin/python

      - name: Bind exact X7 LongLLMLingua environment and study checkpoint
        if: matrix.system == 'X7'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/microsoft/LLMLingua /tmp/stage2-x7-longllmlingua
          git -C /tmp/stage2-x7-longllmlingua checkout -q 5a4c78ae18ab17a98cf997e8259354e546081d64
          test "$(git -C /tmp/stage2-x7-longllmlingua rev-parse HEAD)" = 5a4c78ae18ab17a98cf997e8259354e546081d64
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' 'accelerate>=0.33,<1' tiktoken nltk numpy tokenizers safetensors
          python -m pip install -q --no-deps -e /tmp/stage2-x7-longllmlingua
          rm -rf /tmp/stage2-x7-study
          (cd bcode && python -m stage2.study_assets.validate --probe X7 --out-root /tmp/stage2-x7-study)

      - name: Verify provider credential before irreversible B claim
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY"
          echo "PASS: provider credential and native prerequisites are ready; no B provider call made"

      - name: Verify irreversible group claim and reserve first paired B attempt
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          CELL="$SYS-$TASK"
          export CELL
          python - <<'PY'
          import json,os
          from pathlib import Path
          claim=json.loads(Path("evidence-input/stage2/r7_g1_v1/control/phase_b_provider_v2_group_claim_v1.json").read_text())
          assert claim["state"]=="IRREVERSIBLY_CLAIMED_BEFORE_ANY_B_PROVIDER_CALL"
          assert claim["authorization_issue"]==286
          assert os.environ["CELL"] in claim["claimed_cells"]
          assert claim["attempt_index_by_cell"]==1
          assert claim["b_code_sha"]==os.environ["B_CODE_SHA"]
          assert claim["b_evidence_root"]==os.environ["B_EVIDENCE_ROOT"]
          assert claim["preclaim_total_B_provider_calls"]==0
          assert claim["preclaim_B_stochastic_attempts_consumed"]==0
          print("PASS: append-only group claim binds this cell before provider execution")
          PY
          EVIDENCE_PATH="$B_EVIDENCE_ROOT/$CELL/attempt_receipt.json"
          if gh api "repos/$GITHUB_REPOSITORY/contents/$EVIDENCE_PATH?ref=$EVIDENCE_BRANCH" >/dev/null 2>&1; then
            echo "FAIL: $CELL provider-v2 B evidence already exists; no second stochastic B attempt is permitted"
            exit 42
          fi
          echo "claimed=true" >> "$GITHUB_OUTPUT"
          echo "claim_tag=group-claim:$INPUT_EVIDENCE_SHA:$CELL" >> "$GITHUB_OUTPUT"
          echo "PASS: $CELL is reserved by frozen group claim; no provider call made yet"

      - name: Execute exactly one provider-backed paired Repair B
        id: execute
        if: steps.claim.outputs.claimed == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -uo pipefail
          CELL="$SYS-$TASK"
          OUT="/tmp/stage2-r7-g1-b-run/$CELL"
          LOG_ROOT="/tmp/stage2-r7-g1-b-control/$CELL"
          rm -rf "$OUT" "$LOG_ROOT"
          mkdir -p "$LOG_ROOT"
          printf '%s\n' "$B_CODE_SHA" > "$LOG_ROOT/b_code_sha.txt"
          printf '%s\n' "$INPUT_EVIDENCE_SHA" > "$LOG_ROOT/input_evidence_sha.txt"
          printf '%s\n' "$AUTH_ISSUE" > "$LOG_ROOT/authorization_issue.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$LOG_ROOT/workflow_run_id.txt"
          printf '%s\n' "$CELL" > "$LOG_ROOT/cell_id.txt"
          export PYTHONPATH="$GITHUB_WORKSPACE/bcode${PYTHONPATH:+:$PYTHONPATH}"
          export TOKENIZERS_PARALLELISM=false
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          PYBIN=python
          if [ "$SYS" = X4 ]; then PYBIN=/tmp/stage2-x4-mcp/.venv/bin/python; fi
          EXTRA=()
          if [ "$SYS" = X7 ]; then
            EXTRA+=(--x7-checkpoint /tmp/stage2-x7-study/checkpoint)
            EXTRA+=(--x7-checkpoint-manifest "$GITHUB_WORKSPACE/bcode/stage2/native_v7/study/x7_checkpoint_manifest.json")
          fi
          set +e
          "$PYBIN" -m stage2.r7_prospective_v1.repair_b_runner \
            --cell "$CELL" \
            --a-archive "$GITHUB_WORKSPACE/evidence-input/stage2/r7_g1_v1/natural_A_provider_v2/$CELL/first_attempt.tar.gz" \
            --readiness "$GITHUB_WORKSPACE/evidence-input/stage2/r7_g1_v1/control/phase_b_readiness_v2.json" \
            --out-root "$OUT" \
            "${EXTRA[@]}" \
            > "$LOG_ROOT/runner_stdout.txt" 2> "$LOG_ROOT/runner_stderr.txt"
          CODE=$?
          set -e
          printf '%s\n' "$CODE" > "$LOG_ROOT/runner_exit_code.txt"
          echo "runner_exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Package immutable first paired B attempt
        id: package
        if: always() && steps.claim.outputs.claimed == 'true'
        env:
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
          CLAIM_TAG: ${{ steps.claim.outputs.claim_tag }}
          RUNNER_EXIT_CODE: ${{ steps.execute.outputs.runner_exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          CELL="$SYS-$TASK"
          OUT="/tmp/stage2-r7-g1-b-run/$CELL"
          LOG_ROOT="/tmp/stage2-r7-g1-b-control/$CELL"
          mkdir -p "$OUT/control"
          if [ -d "$LOG_ROOT" ]; then cp -a "$LOG_ROOT"/. "$OUT/control"/; fi
          export OUT CELL CLAIM_TAG RUNNER_EXIT_CODE
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ["OUT"])
          seal_path=out/"seal.json"
          seal=json.loads(seal_path.read_text()) if seal_path.is_file() else None
          meta={
              "schema":"stage2-r7-g1-phase-b-provider-v2-first-attempt-metadata-v1",
              "group_id":"StageII-R7-G1",
              "phase":"PHASE_B_PAIRED_REPAIR_12_READY_CELLS_ZERO_CALL_RECOVERY_V2",
              "cell_id":os.environ["CELL"],
              "attempt_index":1,
              "authorization_issue":286,
              "b_code_sha":os.environ["B_CODE_SHA"],
              "input_evidence_sha":os.environ["INPUT_EVIDENCE_SHA"],
              "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "claim_tag":os.environ["CLAIM_TAG"],
              "runner_exit_code":int(os.environ.get("RUNNER_EXIT_CODE") or -999),
              "seal_present":seal is not None,
              "seal_status":seal.get("status") if seal else None,
              "package_id":seal.get("package_id") if seal else None,
              "parent_checkpoint_hash":seal.get("parent_checkpoint_hash") if seal else None,
              "repair_action_count":seal.get("repair_action_count") if seal else None,
              "repair_agent_calls":seal.get("repair_agent_calls") if seal else None,
              "subject_continuation_calls":seal.get("subject_continuation_calls") if seal else None,
              "total_B_provider_calls":seal.get("total_B_provider_calls") if seal else None,
              "same_parent_checkpoint":seal.get("same_parent_checkpoint") if seal else None,
              "repair_executor_exited":seal.get("repair_executor_exited") if seal else None,
              "post_repair_monitor_mode":seal.get("post_repair_monitor_mode") if seal else None,
              "post_repair_repair_packages":seal.get("post_repair_repair_packages") if seal else None,
              "semantic_audit_used":False,
              "cpr_labels_used":False,
              "preserved_failed_attempt":True,
              "repair_request_present":(out/"repair_request.json").is_file(),
              "repair_response_present":(out/"repair_response.json").is_file(),
          }
          (out/"control"/"attempt_metadata.json").write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
          PY
          ART="/tmp/stage2-r7-g1-b-artifact/$CELL"
          mkdir -p "$ART"
          ARCHIVE="$ART/first_B_attempt.tar.gz"
          tar -czf "$ARCHIVE" -C "$OUT" .
          sha256sum "$ARCHIVE" > "$ART/first_B_attempt.tar.gz.sha256"
          export ART ARCHIVE
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          art=Path(os.environ["ART"])
          archive=Path(os.environ["ARCHIVE"])
          meta=json.loads((Path(os.environ["OUT"])/"control"/"attempt_metadata.json").read_text())
          receipt=dict(meta)
          receipt.update({
              "schema":"stage2-r7-g1-phase-b-provider-v2-first-attempt-receipt-v1",
              "archive_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
              "archive_bytes":archive.stat().st_size,
              "preserved":True,
              "scientific_success_not_inferred":True,
              "no_automatic_retry":True,
          })
          (art/"attempt_receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY
          echo "packaged=true" >> "$GITHUB_OUTPUT"
          echo "PASS: $CELL first paired B attempt preserved; runner exit code=$RUNNER_EXIT_CODE"

      - name: Upload immutable paired B cell artifact
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage2-r7-g1-b-v2-${{ matrix.system }}-${{ matrix.task }}-${{ github.run_id }}
          path: /tmp/stage2-r7-g1-b-artifact/
          retention-days: 90
          if-no-files-found: error

      - name: Assert first B attempt was preserved
        if: always() && steps.claim.outputs.claimed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.package.outputs.packaged }}" = true
          echo "PASS: immutable first B attempt preserved; no retry executed"

  freeze-b:
    needs: paired-b
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current evidence branch for append-only freeze
        uses: actions/checkout@v4
        with:
          ref: stage2-r7-g1-evidence-v1
          path: evidence
          fetch-depth: 0

      - name: Verify input evidence ancestry
        shell: bash
        run: |
          set -euo pipefail
          git -C evidence merge-base --is-ancestor "$INPUT_EVIDENCE_SHA" HEAD
          test -f evidence/stage2/r7_g1_v1/control/phase_b_zero_call_continuation_preflight_seal_v1.json

      - name: Download all preserved B attempts
        uses: actions/download-artifact@v4
        with:
          pattern: stage2-r7-g1-b-v2-*-${{ github.run_id }}
          path: /tmp/stage2-r7-g1-b-downloaded
          merge-multiple: true

      - name: Freeze immutable B evidence and group index
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          export ROOT="$GITHUB_WORKSPACE/evidence"
          export DL="/tmp/stage2-r7-g1-b-downloaded"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          dl=Path(os.environ["DL"])
          expected=[
              "X2-T1","X2-T2","X2-T3",
              "X4-T1","X4-T2","X4-T3",
              "X5-T1","X5-T2","X5-T3",
              "X7-T1","X7-T2","X7-T3",
          ]
          receipts=[]
          missing=[]
          for cell in expected:
              src=dl/cell
              receipt=src/"attempt_receipt.json"
              archive=src/"first_B_attempt.tar.gz"
              sha_file=src/"first_B_attempt.tar.gz.sha256"
              if not (receipt.is_file() and archive.is_file() and sha_file.is_file()):
                  missing.append(cell)
                  continue
              r=json.loads(receipt.read_text())
              assert r["cell_id"]==cell
              assert r["attempt_index"]==1
              assert r["authorization_issue"]==285
              assert r["b_code_sha"]==os.environ["B_CODE_SHA"]
              assert r["input_evidence_sha"]==os.environ["INPUT_EVIDENCE_SHA"]
              assert r["no_automatic_retry"] is True
              observed=hashlib.sha256(archive.read_bytes()).hexdigest()
              assert observed==r["archive_sha256"]
              assert sha_file.read_text().split()[0]==observed
              dest=root/os.environ["B_EVIDENCE_ROOT"]/cell
              dest.mkdir(parents=True,exist_ok=True)
              (dest/"first_B_attempt.tar.gz").write_bytes(archive.read_bytes())
              (dest/"first_B_attempt.tar.gz.sha256").write_text(sha_file.read_text())
              (dest/"attempt_receipt.json").write_text(receipt.read_text())
              receipts.append(r)

          success=[r for r in receipts if r.get("runner_exit_code")==0 and r.get("seal_status")=="REPAIR_B_FROZEN"]
          failed=[r for r in receipts if r not in success]
          known_calls=[r.get("total_B_provider_calls") for r in success if isinstance(r.get("total_B_provider_calls"),int)]
          group={
              "schema":"stage2-r7-g1-phase-b-provider-v2-group-index-v1",
              "state":"FROZEN_B_FIRST_ATTEMPTS" if len(receipts)==12 else "PARTIAL_B_FIRST_ATTEMPTS_FAIL_CLOSED",
              "group_id":"StageII-R7-G1",
              "phase":"PHASE_B_PAIRED_REPAIR_12_READY_CELLS_ZERO_CALL_RECOVERY_V2",
              "authorization_issue":286,
              "b_code_sha":os.environ["B_CODE_SHA"],
              "input_evidence_sha":os.environ["INPUT_EVIDENCE_SHA"],
              "source_A_workflow_run":36296703851,
              "source_A_evidence_commit":"012530514bb2c6d8a0d7c89bebec6e60028995db",
              "zero_call_preflight_run":36298466846,
              "zero_call_continuation_preflight_run":36298772109,
              "source_failed_active_v1_run":36299266423,
              "source_zero_call_quarantine_commit":"b354e294a19b903499448bd87b84b4cf7bfdc0c4",
              "group_claim_commit":"c62fd836cb25171f428fe0cc7b54e457c76efe8a",
              "expected_cells":expected,
              "preserved_cells":[r["cell_id"] for r in receipts],
              "missing_cells":missing,
              "preserved_count":len(receipts),
              "successful_B_cells":[r["cell_id"] for r in success],
              "successful_B_count":len(success),
              "failed_B_cells":[r["cell_id"] for r in failed],
              "failed_B_count":len(failed),
              "blocked_cells":["X6-T1","X6-T2","X6-T3"],
              "blocked_reason":"FOREIGN_PARENT_STATE_RECONSTRUCTION_BLOCKED",
              "one_B_per_cell":True,
              "automatic_retries":0,
              "repair_agent_calls_expected_per_attempt":1,
              "known_successful_total_B_provider_calls":sum(known_calls),
              "repair_executor_exit_required":True,
              "post_repair_monitor_mode":"WATCH_ONLY",
              "semantic_audit_execution":"NOT_EXECUTED",
              "semantic_audit_gate":"OPEN_AFTER_B_FREEZE" if len(receipts)==12 else "CLOSED_INCOMPLETE_B_FREEZE",
              "paid_evaluator_calls":0,
              "natural_A_reruns":0,
              "x6_provider_calls":0,
              "receipts":receipts,
          }
          path=root/"stage2/r7_g1_v1/phase_b_provider_v2_group_index.json"
          path.write_text(json.dumps(group,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "preserved":len(receipts),
              "success":len(success),
              "failed":len(failed),
              "missing":missing,
              "state":group["state"],
          },sort_keys=True))
          PY
          git -C evidence config user.name "stage2-r7-g1-evidence-bot"
          git -C evidence config user.email "stage2-r7-g1-evidence@users.noreply.github.com"
          git -C evidence add stage2/r7_g1_v1
          if git -C evidence diff --cached --quiet; then
            echo "FAIL: no B evidence to freeze"
            exit 50
          fi
          git -C evidence commit -m "evidence: freeze Stage-II R7 G1 provider-v2 paired Repair B first attempts [run $GITHUB_RUN_ID]"
          git -C evidence push origin "HEAD:$EVIDENCE_BRANCH"
          echo "frozen=true" >> "$GITHUB_OUTPUT"

      - name: Report B freeze to authorization issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f evidence/stage2/r7_g1_v1/phase_b_provider_v2_group_index.json ]; then
            SUMMARY="$(python - <<'PY'
          import json,os
          from pathlib import Path
          g=json.loads(Path("evidence/stage2/r7_g1_v1/phase_b_provider_v2_group_index.json").read_text())
          print(
              f"StageII-R7-G1 provider-v2 paired Repair B freeze: preserved={g['preserved_count']}/12, "
              f"successful={g['successful_B_count']}, failed={g['failed_B_count']}, "
              f"missing={','.join(g['missing_cells']) or 'none'}. "
              f"X6-T1/T2/T3 remain fail-closed with zero B calls. "
              f"No semantic audit or paid evaluator executed. "
              f"Workflow: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          PY
          )"
            gh issue comment "$AUTH_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$SUMMARY"
          fi
