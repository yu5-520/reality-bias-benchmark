name: Node-route repair offline integration

on:
  push:
    branches: [fix/p2-native-evidence-replay]
    paths:
      - 'stage2/route_repair/**'
      - 'scripts/*stage2*terminal*route*.py'
      - 'configs/stage2_terminal_route_repair_first_round_v1.json'
      - '.github/workflows/stage2-terminal-route-repair.yml'
      - 'scripts/prepare_stage2_node_route_context.py'
      - 'configs/stage2_node_route_repair_design_v1.json'
      - 'scripts/check_stage2_route_planning_session.py'
      - 'stage2/replication_v2/route_planning_session_integration_v1/**'
      - 'configs/stage2_monitor_repair_system_v1.json'
      - 'scripts/check_stage2_monitor_repair_system.py'
      - 'stage2/replication_v2/monitor_repair_system_integration_v1/**'
      - 'scripts/check_stage2_independent_repair_review.py'
      - 'configs/stage2_independent_repair_review_v1.json'
      - 'stage2/replication_v2/independent_repair_review_preparation_v1/**'
      - 'scripts/check_stage2_native_continuation_authority.py'
      - 'configs/stage2_native_continuation_authority_v1.json'
      - 'stage2/replication_v2/native_continuation_authority_integration_v1/**'
      - 'scripts/run_stage2_connected_repair.py'
      - 'scripts/check_stage2_connected_repair.py'
      - 'configs/stage2_connected_provider_v1.json'
      - 'configs/stage2_connected_mechanism_v1.json'
      - 'scripts/check_stage2_message_repair.py'
      - 'scripts/validate_stage2_message_followup_evidence.py'
      - 'stage2/replication_v2/message_corrected_contract_followup_v1/**'
      - 'scripts/validate_stage2_message_source_read_trial.py'
      - 'stage2/replication_v2/message_source_read_contract_trial_v1/**'
      - 'scripts/validate_stage2_field_link_frozen_failure.py'
      - 'stage2/replication_v2/message_field_link_trial_v1/**'
      - 'scripts/review_stage2_connected_repair.py'
      - 'stage2/replication_v2/pending_message_repair_v1/**'
      - 'stage2/replication_v2/connected_http_mcp_preflight_v1/**'
      - 'scripts/check_stage2_provider_phase.py'
      - 'configs/stage2_bound_provider_phase_v1.json'
      - 'configs/stage2_monitor_repair_active.json'
      - 'configs/stage2_paper_mechanism_contract_v1.json'
      - 'scripts/prepare_stage2_paper_alignment.py'
      - 'stage2/replication_v2/paper_mechanism_alignment_v1/**'
      - 'stage2/replication_v2/bound_provider_phase_preflight_v1/**'
      - 'scripts/check_stage2_read_only_planning_entry.py'
      - 'configs/stage2_read_only_planning_entry_v1.json'
      - 'stage2/replication_v2/read_only_planning_entry_integration_v1/**'
      - 'scripts/check_stage2_same_parent_native_mcp.py'
      - 'configs/stage2_same_parent_native_mcp_v1.json'
      - 'stage2/replication_v2/same_parent_native_mcp_integration_v1/**'
      - 'scripts/check_stage2_source_based_host_branch.py'
      - 'scripts/validate_stage2_source_based_host_branch.py'
      - 'stage2/replication_v2/source_based_host_branch_integration_v1/**'
      - 'scripts/check_stage2_field_branch_native.py'
      - 'scripts/validate_stage2_field_branch_integration.py'
      - 'stage2/monitor_enhancement/snapshot_append.py'
      - 'stage2/replication_v2/field_branch_native_integration_v1/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage2-terminal-route-repair-first-round
  cancel-in-progress: false

jobs:
  terminal-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .historical-route-repair
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retain historical reproduction sources
        working-directory: .
        run: git worktree add --detach "$GITHUB_WORKSPACE/.historical-route-repair" d1507b1711efc02ece3168d31e9a03dfc8575922
      - name: Verify boundaries and unit checks
        working-directory: .
        run: python -m unittest discover -s stage2/route_repair/tests -v
      - name: Verify retained live follow-up without provider dispatch
        working-directory: .
        run: |
          python scripts/validate_stage2_message_followup_evidence.py
          python scripts/validate_stage2_message_source_read_trial.py
      - name: Materialize the two frozen source archives
        shell: bash
        run: |
          set -euo pipefail
          for g in 2 3; do
            commit=$(python -c "import json; print(json.load(open('configs/stage2_g${g}_ab_paired_semantic_audit_v1.json'))['source']['natural_A_evidence_commit'])")
            mkdir -p "$RUNNER_TEMP/sources/G${g}A"
            git cat-file -e "$commit^{commit}" || git fetch origin "$commit"
            git archive "$commit" "stage2/replication_v2/G${g}/natural_A" | tar -x -C "$RUNNER_TEMP/sources/G${g}A"
          done
          python scripts/materialize_stage2_terminal_route_graphs.py --source-root "$RUNNER_TEMP/sources" --out "$RUNNER_TEMP/terminal-graphs"
          python "$GITHUB_WORKSPACE/scripts/validate_stage2_message_source_read_trial.py" --source-root "$RUNNER_TEMP/sources"
      - name: Run zero-call preflight
        run: |
          python scripts/run_stage2_terminal_route_repair.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs" --out "$RUNNER_TEMP/terminal-preflight"
          python -c "import json,os; s=json.load(open(os.environ['RUNNER_TEMP']+'/terminal-preflight/summary.json')); assert s['provider_calls']==0 and len(s['arms'])==4 and all(x['status']=='PASS' for x in s['arms'])"
      - name: Verify the native host bridge with a scripted response
        run: |
          python scripts/check_stage2_terminal_route_native_bridge.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs" --out "$RUNNER_TEMP/terminal-bridge"
      - name: Prepare complete node-route context without repair calls
        run: |
          python scripts/prepare_stage2_node_route_context.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs" --out "$RUNNER_TEMP/node-route-context"
      - name: Verify field-bounded native branch and enhanced full graphs
        run: |
          python -m unittest discover -s stage2/monitor_enhancement/tests -v
          python scripts/check_stage2_field_branch_native.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs" --out "$RUNNER_TEMP/field-branch-native"
          python scripts/validate_stage2_field_branch_integration.py --reproduced "$RUNNER_TEMP/field-branch-native"
      - name: Verify source-based application and current host answer coordination
        run: |
          python scripts/check_stage2_source_based_host_branch.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs" --out "$RUNNER_TEMP/source-based-host-branch"
          python scripts/validate_stage2_source_based_host_branch.py --reproduced "$RUNNER_TEMP/source-based-host-branch"
      - name: Verify inspected-source route proposal compilation
        run: |
          python scripts/check_stage2_route_planning_session.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs" --out "$RUNNER_TEMP/route-planning-session" --compare-frozen
      - name: Verify historical attempts against archived execution sources
        run: |
          python scripts/validate_stage2_terminal_route_first_attempt.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs"
      - name: Verify automatic offline coordination and continuation pending gate
        run: |
          python scripts/check_stage2_monitor_repair_system.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs" --out "$RUNNER_TEMP/monitor-repair-system" --compare-frozen
      - name: Verify independent read-only review preparation without invoking a reviewer
        run: |
          python scripts/check_stage2_independent_repair_review.py --source-root "$RUNNER_TEMP/sources" --out "$RUNNER_TEMP/independent-repair-review" --compare-frozen
      - name: Verify nonterminal native host restore and automatic proposal authority
        run: |
          python scripts/check_stage2_native_continuation_authority.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs" --out "$RUNNER_TEMP/native-continuation-authority" --compare-frozen
      - name: Bind the unchanged frozen official MCP runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk "$RUNNER_TEMP/same-parent-mcp-sdk"
          git -C "$RUNNER_TEMP/same-parent-mcp-sdk" checkout -q f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol "$RUNNER_TEMP/same-parent-mcp-protocol"
          git -C "$RUNNER_TEMP/same-parent-mcp-protocol" checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          cd "$RUNNER_TEMP/same-parent-mcp-sdk"
          uv sync --frozen --no-default-groups --python "$(command -v python)"
      - name: Verify prefix-safe same-parent MCP repair and scripted continuation
        run: |
          git worktree add --detach "$RUNNER_TEMP/connected-predecessor" c5c6516a1646690cdf600f1794f4eee138c5c9fd
          cd "$RUNNER_TEMP/connected-predecessor"
          "$RUNNER_TEMP/same-parent-mcp-sdk/.venv/bin/python" scripts/check_stage2_same_parent_native_mcp.py --source-root "$RUNNER_TEMP/sources" --sdk-root "$RUNNER_TEMP/same-parent-mcp-sdk" --protocol-root "$RUNNER_TEMP/same-parent-mcp-protocol" --out "$RUNNER_TEMP/same-parent-native-mcp" --compare-frozen
      - name: Verify read-only planning protocol and same-parent MCP host entry
        run: |
          cd "$RUNNER_TEMP/connected-predecessor"
          "$RUNNER_TEMP/same-parent-mcp-sdk/.venv/bin/python" scripts/check_stage2_read_only_planning_entry.py --source-root "$RUNNER_TEMP/sources" --sdk-root "$RUNNER_TEMP/same-parent-mcp-sdk" --protocol-root "$RUNNER_TEMP/same-parent-mcp-protocol" --out "$RUNNER_TEMP/read-only-planning-entry" --compare-frozen
      - name: Verify frozen provider profiles and explicit native repair release phases
        run: |
          # The predecessor seal binds its old active registry. Reproduce the
          # entire predecessor tree, without restoring it as today's entry.
          git worktree add --detach "$RUNNER_TEMP/provider-predecessor" a9df69ede037b2f27af1545f928e3f4c19daab02
          cd "$RUNNER_TEMP/provider-predecessor"
          "$RUNNER_TEMP/same-parent-mcp-sdk/.venv/bin/python" scripts/check_stage2_provider_phase.py --source-root "$RUNNER_TEMP/sources" --sdk-root "$RUNNER_TEMP/same-parent-mcp-sdk" --protocol-root "$RUNNER_TEMP/same-parent-mcp-protocol" --out "$RUNNER_TEMP/bound-provider-phase" --compare-frozen
      - name: Verify captured loopback HTTP planning and returned-turn MCP censor
        run: |
          # Its seal binds the engineering entry and registry before the paper gate.
          cd "$RUNNER_TEMP/connected-predecessor"
          "$RUNNER_TEMP/same-parent-mcp-sdk/.venv/bin/python" scripts/check_stage2_connected_repair.py --source-root "$RUNNER_TEMP/sources" --sdk-root "$RUNNER_TEMP/same-parent-mcp-sdk" --protocol-root "$RUNNER_TEMP/same-parent-mcp-protocol" --out "$RUNNER_TEMP/connected-http-mcp" --compare-frozen
      - name: Verify corrected paper reference partitions and native prefix readiness
        run: |
          python scripts/validate_stage2_chronology_semantic_review.py
          python "$GITHUB_WORKSPACE/scripts/validate_stage2_field_link_frozen_failure.py"
          python scripts/prepare_stage2_paper_alignment.py --source-root "$RUNNER_TEMP/sources" --out "$RUNNER_TEMP/paper-alignment" --compare-frozen
      - name: Verify active exact message repair through native closure
        working-directory: .
        run: |
          git worktree add --detach "$RUNNER_TEMP/message-repair-predecessor" 96acfc60970109591f08213fd26a3ca2cc0ff23f
          cd "$RUNNER_TEMP/message-repair-predecessor"
          "$RUNNER_TEMP/same-parent-mcp-sdk/.venv/bin/python" scripts/check_stage2_message_repair.py --source-root "$RUNNER_TEMP/sources" --sdk-root "$RUNNER_TEMP/same-parent-mcp-sdk" --protocol-root "$RUNNER_TEMP/same-parent-mcp-protocol" --out "$RUNNER_TEMP/message-repair" --compare-frozen
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/same-parent-mcp-sdk/.venv/bin/python" scripts/check_stage2_message_repair.py --source-root "$RUNNER_TEMP/sources" --sdk-root "$RUNNER_TEMP/same-parent-mcp-sdk" --protocol-root "$RUNNER_TEMP/same-parent-mcp-protocol" --out "$RUNNER_TEMP/current-message-repair"
          "$RUNNER_TEMP/same-parent-mcp-sdk/.venv/bin/python" scripts/run_stage2_connected_repair.py --source-root "$RUNNER_TEMP/sources" --sdk-root "$RUNNER_TEMP/same-parent-mcp-sdk" --protocol-root "$RUNNER_TEMP/same-parent-mcp-protocol" --out "$RUNNER_TEMP/paper-entry-preflight"
      - name: Retain offline preparation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-route-context-${{ github.sha }}
          path: |
            ${{ runner.temp }}/terminal-preflight
            ${{ runner.temp }}/terminal-bridge
            ${{ runner.temp }}/node-route-context
            ${{ runner.temp }}/field-branch-native
            ${{ runner.temp }}/source-based-host-branch
            ${{ runner.temp }}/route-planning-session
            ${{ runner.temp }}/monitor-repair-system
            ${{ runner.temp }}/independent-repair-review
            ${{ runner.temp }}/native-continuation-authority
            ${{ runner.temp }}/same-parent-native-mcp
            ${{ runner.temp }}/read-only-planning-entry
            ${{ runner.temp }}/bound-provider-phase
            ${{ runner.temp }}/connected-http-mcp
            ${{ runner.temp }}/paper-alignment
            ${{ runner.temp }}/paper-entry-preflight
            ${{ runner.temp }}/message-repair
            ${{ runner.temp }}/current-message-repair
          retention-days: 90
          if-no-files-found: error
