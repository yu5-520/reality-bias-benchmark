name: Historical diagnostic harness offline preflight

on:
  push:
    branches: [fix/p2-native-evidence-replay]
    paths:
      - 'stage2/route_repair/**'
      - 'scripts/*stage2*terminal*route*.py'
      - 'configs/stage2_terminal_route_repair_first_round_v1.json'
      - '.github/workflows/stage2-terminal-route-repair.yml'
      - 'scripts/prepare_stage2_node_route_context.py'
      - 'configs/stage2_node_route_repair_design_v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage2-terminal-route-repair-first-round
  cancel-in-progress: false

jobs:
  terminal-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify boundaries and unit checks
        run: python -m unittest discover -s stage2/route_repair/tests -v
      - name: Materialize the two frozen source archives
        shell: bash
        run: |
          set -euo pipefail
          for g in 2 3; do
            commit=$(python -c "import json; print(json.load(open('configs/stage2_g${g}_ab_paired_semantic_audit_v1.json'))['source']['natural_A_evidence_commit'])")
            mkdir -p "$RUNNER_TEMP/sources/G${g}A"
            git cat-file -e "$commit^{commit}" || git fetch origin "$commit"
            git archive "$commit" "stage2/replication_v2/G${g}/natural_A" | tar -x -C "$RUNNER_TEMP/sources/G${g}A"
          done
          python scripts/materialize_stage2_terminal_route_graphs.py --source-root "$RUNNER_TEMP/sources" --out "$RUNNER_TEMP/terminal-graphs"
      - name: Run zero-call preflight
        run: |
          python scripts/run_stage2_terminal_route_repair.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs" --out "$RUNNER_TEMP/terminal-preflight"
          python -c "import json,os; s=json.load(open(os.environ['RUNNER_TEMP']+'/terminal-preflight/summary.json')); assert s['provider_calls']==0 and len(s['arms'])==4 and all(x['status']=='PASS' for x in s['arms'])"
      - name: Verify the native host bridge with a scripted response
        run: |
          python scripts/check_stage2_terminal_route_native_bridge.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs" --out "$RUNNER_TEMP/terminal-bridge"
      - name: Prepare complete node-route context without repair calls
        run: |
          python scripts/prepare_stage2_node_route_context.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs" --out "$RUNNER_TEMP/node-route-context"
      - name: Verify historical attempts against archived execution sources
        run: |
          python scripts/validate_stage2_terminal_route_first_attempt.py --source-root "$RUNNER_TEMP/sources" --graph-root "$RUNNER_TEMP/terminal-graphs"
      - name: Retain offline preparation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-route-context-${{ github.sha }}
          path: |
            ${{ runner.temp }}/terminal-preflight
            ${{ runner.temp }}/terminal-bridge
            ${{ runner.temp }}/node-route-context
          retention-days: 90
          if-no-files-found: error
