name: R2 Free-Agent Arena Subject Run

on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'Comma-separated domain ids: ecommerce,finance,supply_chain,software_engineering or all'
        required: true
        default: 'ecommerce'
        type: string
      repeats:
        description: 'Repeated runs per domain'
        required: true
        default: '5'
        type: string
      confirm:
        description: 'Type CALL_REAL_API to execute subject provider calls'
        required: true
        default: 'PREPARE_ONLY'
        type: string

concurrency:
  group: r2-free-agent-arena-subject
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate v0.2 environment
        run: |
          python arena/validate_environment.py
          python arena/preflight.py
          python -m unittest discover -s arena/tests -v
      - name: Build exact requested manifest
        run: |
          python -m arena.build_manifest \
            --domains '${{ inputs.domains }}' \
            --repeats '${{ inputs.repeats }}' \
            --arena-config arena/config/arena_v0.2.json \
            --out results/arena_manifest.jsonl
          wc -l results/arena_manifest.jsonl
      - name: Upload prepared manifest
        uses: actions/upload-artifact@v4
        with:
          name: r2-arena-prepared-manifest-${{ github.run_id }}
          path: results/arena_manifest.jsonl
          retention-days: 30

  subject_run:
    needs: prepare
    if: ${{ inputs.confirm == 'CALL_REAL_API' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact manifest
        run: |
          python -m arena.build_manifest \
            --domains '${{ inputs.domains }}' \
            --repeats '${{ inputs.repeats }}' \
            --arena-config arena/config/arena_v0.2.json \
            --out results/arena_manifest.jsonl
      - name: Run self-organizing multi-agent subject experiment
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python arena/run_real.py \
            --manifest results/arena_manifest.jsonl \
            --out results/arena_traces.jsonl \
            --arena-config arena/config/arena_v0.2.json \
            --max-workers 2 \
            --execute-real-api
      - name: Validate and freeze raw evidence, compute objective facts, export review packets
        if: always()
        run: |
          python -m arena.evidence \
            --manifest results/arena_manifest.jsonl \
            --traces results/arena_traces.jsonl \
            --errors results/arena_traces.jsonl.errors.json \
            --outdir results/evidence_batch \
            --code-sha '${{ github.sha }}'
          cat results/evidence_batch/RUN_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable evidence batch — no paid evaluator called
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-arena-evidence-${{ github.run_id }}
          path: |
            results/arena_manifest.jsonl
            results/arena_traces.jsonl
            results/arena_traces.jsonl.errors.json
            results/json_format_retries.jsonl
            results/evidence_batch/
          if-no-files-found: warn
          retention-days: 90
