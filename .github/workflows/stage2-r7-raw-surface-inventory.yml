name: Stage-II R7 Raw Surface Inventory

on:
  push:
    branches:
      - stage2-r7-structural-monitor-v1
    paths:
      - "scripts/stage2_r7_raw_surface_inventory.py"
      - ".github/workflows/stage2-r7-raw-surface-inventory.yml"
      - "stage2/natural_v7/**/first_attempt.tar.gz"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2-r7-structural-monitor-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build raw structural inventory
        run: python scripts/stage2_r7_raw_surface_inventory.py
      - name: Commit generated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage2/r7_monitor_v1/raw_surface_inventory.json
          if git diff --cached --quiet; then
            echo "No inventory changes"
          else
            git commit -m "data: materialize Stage-II R7 raw surface inventory [skip ci]"
            git push origin HEAD:stage2-r7-structural-monitor-v1
          fi
