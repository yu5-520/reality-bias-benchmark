name: R2 Final R Calibration and Confirmatory Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r2-final-r-v0.7.yml'
      - 'benchmark/r2_primary_mapping_items_v0.7_final_candidate.jsonl'
      - 'analysis/check_r2_final_r_gate.py'
      - 'theory/change_notes/CN-R2-009.md'
  workflow_dispatch:

concurrency:
  group: r2-final-r-v0.7
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  r_calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provider smoke on revised R medium item
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python runners/run_r2_calibration_v04.py \
            --benchmark benchmark/r2_primary_mapping_items_v0.7_final_candidate.jsonl \
            --item-ids R2-R03 \
            --repeats 1 --max-workers 1 \
            --out results/r2_v0.7_r_smoke.jsonl
      - name: Run final 20-cell R-only calibration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python runners/run_r2_calibration_v04.py \
            --benchmark benchmark/r2_primary_mapping_items_v0.7_final_candidate.jsonl \
            --item-ids R2-R01,R2-R03,R2-R02,R2-R04 \
            --repeats 5 --max-workers 4 \
            --out results/r2_r_calibration_v0.7_raw.jsonl
      - name: Analyze final R calibration
        run: |
          python analysis/analyze_r2_calibration.py \
            --input results/r2_r_calibration_v0.7_raw.jsonl \
            --outdir results/r2_r_calibration_v0.7_analysis
          cat results/r2_r_calibration_v0.7_analysis/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Apply final frozen R gate
        run: |
          set -o pipefail
          python analysis/check_r2_final_r_gate.py \
            --csv results/r2_r_calibration_v0.7_analysis/item_calibration.csv \
            | tee results/r2_r_calibration_v0.7_analysis/GATE.md
          cat results/r2_r_calibration_v0.7_analysis/GATE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload final R calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-final-r-calibration-v0.7-${{ github.run_id }}
          path: |
            results/r2_v0.7_r_smoke.jsonl
            results/r2_r_calibration_v0.7_raw.jsonl
            results/r2_r_calibration_v0.7_raw.jsonl.errors.json
            results/json_format_retries.jsonl
            results/r2_r_calibration_v0.7_analysis/
          if-no-files-found: warn
          retention-days: 90

  confirmatory:
    needs: r_calibration
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run matched confirmatory R2
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python runners/run_r2_confirmatory_v2.py \
            --benchmark benchmark/r2_primary_mapping_items_v0.7_final_candidate.jsonl \
            --repeats 3 --max-workers 6 \
            --out results/r2_confirmatory_v2_raw.jsonl
      - name: Analyze confirmatory 252-cell matrix
        run: |
          python analysis/analyze_r2_confirmatory_v1.py \
            --input results/r2_confirmatory_v2_raw.jsonl \
            --outdir results/r2_confirmatory_v2_analysis
          cat results/r2_confirmatory_v2_analysis/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze confirmatory run metadata
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('results/r2_confirmatory_v2_raw.jsonl')
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          unique={r['shared_trace_id'] for r in rows}
          meta={
            'status':'CONFIRMATORY_R2_DATA_GENERATED',
            'git_commit_sha':rows[0]['git_commit_sha'],
            'github_run_id':rows[0]['github_run_id'],
            'benchmark_version':rows[0]['benchmark_version'],
            'benchmark_hash':rows[0]['benchmark_hash'],
            'model_config_hash':rows[0]['model_config_hash'],
            'conditions_hash':rows[0]['conditions_hash'],
            'manifest_hash':rows[0]['manifest_hash'],
            'configured_model_alias':rows[0]['configured_model_alias'],
            'expected_model_version':rows[0]['expected_model_version'],
            'evaluator_version':rows[0]['evaluator_version'],
            'condition_cells':len(rows),
            'unique_api_traces':len(unique),
          }
          out=pathlib.Path('results/r2_confirmatory_v2_analysis/FREEZE_METADATA.json')
          out.write_text(json.dumps(meta,indent=2),encoding='utf-8')
          print(json.dumps(meta,indent=2))
          PY
      - name: Upload confirmatory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-confirmatory-v2-${{ github.run_id }}
          path: |
            results/r2_confirmatory_v2_raw.jsonl
            results/r2_confirmatory_v2_raw.jsonl.errors.json
            results/json_format_retries.jsonl
            results/r2_confirmatory_v2_analysis/
          if-no-files-found: warn
          retention-days: 90
