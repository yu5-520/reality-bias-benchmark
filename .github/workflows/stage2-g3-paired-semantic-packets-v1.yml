name: Stage-II G3 Paired Semantic Packet Freeze

on:
  pull_request:
    branches:
      - main
    paths:
      - "configs/stage2_g3_paired_audit_launch_v1.json"

permissions:
  contents: write
  issues: write

jobs:
  freeze-packets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout paired-audit result branch
        uses: actions/checkout@v4
        with:
          ref: stage2-g3-paired-audit-v1
          path: repo
          fetch-depth: 0

      - name: Checkout exact G3 Natural-A evidence
        uses: actions/checkout@v4
        with:
          ref: 858796145d912562cf8ef889b4d4083175d1f21e
          path: a-evidence
          fetch-depth: 1

      - name: Checkout exact frozen G3 Engineering-B evidence
        uses: actions/checkout@v4
        with:
          ref: 9d50bedb9564b31da5e92eecf2d6330a24d2373c
          path: b-evidence
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify audit authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          cfg=json.loads(Path("repo/configs/stage2_g3_ab_paired_semantic_audit_v1.json").read_text())
          assert cfg["authorization_issue"]==314
          assert cfg["reviewer"]["model"]=="GPT-5.6 Sol"
          assert cfg["reviewer"]["execution_mode"]=="CHATGPT_NATIVE_REASONING"
          assert cfg["source"]["natural_A_evidence_commit"]=="858796145d912562cf8ef889b4d4083175d1f21e"
          assert cfg["source"]["repair_B_evidence_commit"]=="9d50bedb9564b31da5e92eecf2d6330a24d2373c"
          assert len(cfg["population"]["valid_paired_cells"])==12
          assert cfg["population"]["execution_boundary_cells"]==[]
          assert cfg["synthesis"]["paired_effect_denominator"]==12
          assert cfg["primary_audit_isolation"]["prior_group_paired_audit_labels_read"] is False
          issue=json.loads(subprocess.check_output(["gh","api",f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/314'],text=True))
          assert issue["state"]=="open"
          assert issue["user"]["login"]=="yu5-520"
          assert issue["title"]=="STAGE2 G3 A-B PAIRED PROCESS-SEMANTIC AUDIT AUTHORIZATION"
          assert "paired_cells=X2-T1,X2-T2,X2-T3,X4-T1,X4-T2,X4-T3,X5-T1,X5-T2,X5-T3,X7-T1,X7-T2,X7-T3" in issue["body"]
          assert "paired_effect_denominator=12" in issue["body"]
          print("PASS: G3 paired-audit authorization bound")
          PY

      - name: Build 12 paired packets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="stage2/replication_v2/G3/paired_semantic_audit_v1"
          test ! -e "repo/$ROOT"
          (cd repo && python arena/build_stage2_g3_ab_semantic_packets_v1.py \
            --a-root "$GITHUB_WORKSPACE/a-evidence" \
            --b-root "$GITHUB_WORKSPACE/b-evidence" \
            --config configs/stage2_g3_ab_paired_semantic_audit_v1.json \
            --out "$ROOT")
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("repo/stage2/replication_v2/G3/paired_semantic_audit_v1")
          idx=json.loads((root/"packets"/"packet_index.json").read_text())
          assert idx["status"]=="FROZEN_12_VALID_PAIRS_NO_EXECUTION_BOUNDARY"
          assert idx["attempted_cell_count"]==12
          assert idx["paired_cell_count"]==12
          assert idx["execution_boundary_count"]==0
          assert len(idx["cells"])==12
          assert idx["new_subject_provider_calls"]==0
          assert idx["repair_calls"]==0
          assert idx["paid_evaluator_calls"]==0
          print("PASS: G3 12-pair packet population frozen")
          PY

      - name: Freeze packets append-only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="stage2/replication_v2/G3/paired_semantic_audit_v1"
          git -C repo config user.name "stage2-g3-paired-audit"
          git -C repo config user.email "stage2-g3-paired-audit@users.noreply.github.com"
          git -C repo add "$ROOT"
          git -C repo commit -m "audit: freeze G3 paired semantic packets [run $GITHUB_RUN_ID]"
          git -C repo push origin HEAD:stage2-g3-paired-audit-v1

      - name: Report packet freeze
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 314 --repo "$GITHUB_REPOSITORY" --body "G3 paired semantic audit inputs frozen: 12/12 valid same-parent A↔B packets. No subject/provider, repair, or evaluator calls were used. G2 paired-audit labels were not imported."
