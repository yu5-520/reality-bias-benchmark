name: Stage-II v7 X2 MetaGPT native environment

on:
  push:
    paths:
      - 'stage2/native_v7/x2_metagpt/**'
      - 'stage2/tasks.json'
      - 'stage2/roles.json'
      - 'stage2/subject.json'
      - 'stage2/fixtures/project/**'
      - '.github/workflows/stage2-native-v7-x2.yml'
  pull_request:
    paths:
      - 'stage2/native_v7/x2_metagpt/**'
      - 'stage2/tasks.json'
      - 'stage2/roles.json'
      - 'stage2/subject.json'
      - 'stage2/fixtures/project/**'
      - '.github/workflows/stage2-native-v7-x2.yml'

jobs:
  x2-metagpt-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Bind exact frozen MetaGPT source
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/FoundationAgents/MetaGPT upstream
          git -C upstream checkout -q 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          test "$(git -C upstream rev-parse HEAD)" = 11cdf466d042aece04fc6cfd13b28e1a70341b1f
      - name: Install exact MetaGPT runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q --no-deps -e upstream
          python -m pip install -q \
            'pydantic>=2.5.3,<3' 'openai~=1.64.0' 'loguru==0.6.0' 'PyYAML==6.0.1' \
            'tenacity==8.2.3' 'tiktoken==0.7.0' 'gymnasium==0.29.1' 'gitpython==3.1.40' \
            'aiofiles==23.2.1' 'numpy~=1.26.4' 'pandas==2.1.1' 'openpyxl~=3.1.5' \
            'networkx~=3.2.1' 'anytree' 'typing-inspect==0.8.0' 'libcst==1.0.1' \
            'rich==13.6.0' 'fire==0.4.0' 'typer==0.9.0' 'beautifulsoup4==4.12.3' \
            'httpx==0.28.1' 'websockets>=10,<12' 'scikit_learn==1.3.2' \
            'channels==4.0.0' 'faiss_cpu==1.7.4' 'meilisearch==0.21.0' \
            'qdrant-client==1.7.0' 'redis~=5.0.0' 'socksio~=1.0.0' 'fsspec'
          python - <<'PY'
          from importlib.metadata import version
          assert version("metagpt") == "1.0.0", version("metagpt")
          PY
      - name: Run X2 native MetaGPT Environment smoke
        shell: bash
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          set -euo pipefail
          python -m stage2.native_v7.x2_metagpt.smoke --out-root stage2_x2_smoke
      - name: Verify existing v7 architecture remains frozen
        run: |
          python -m stage2.native_v7.freeze
          python -m unittest stage2.native_v7.tests.test_architecture -v
      - name: Upload non-study X2 MetaGPT smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-v7-x2-metagpt-smoke-${{ github.run_id }}
          path: stage2_x2_smoke
          retention-days: 30
          if-no-files-found: error
