name: Stage-II R7 G1 Online Monitor Validate

on:
  pull_request:
    paths:
      - "configs/stage2_r7_g1_online_monitor_*.json"
      - "schemas/stage2_r7_g1_monitor_derived_repair_package_v1.schema.json"
      - "stage2/r7_prospective_v1/online_monitor.py"
      - "stage2/r7_prospective_v1/repair_boundary_watcher.py"
      - "stage2/r7_prospective_v1/online_monitor_preflight.py"
      - "scripts/validate_stage2_r7_g1_online_monitor_v1.py"
      - "docs/R_Plan_v7.41.md"
      - "docs/reports/2026-09-26/StageII_R7_G1_Online_Monitor_and_Repair_Boundary_Preflight_Report_v1.md"
      - "theory/change_notes/CN-R-115_stage2_r7_g1_online_monitor_freeze.md"
      - ".github/workflows/stage2-r7-g1-online-monitor-validate.yml"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate frozen G1 online monitor
        run: python scripts/validate_stage2_r7_g1_online_monitor_v1.py
      - name: Re-run deterministic online-monitor preflight
        run: python -m stage2.r7_prospective_v1.online_monitor_preflight
