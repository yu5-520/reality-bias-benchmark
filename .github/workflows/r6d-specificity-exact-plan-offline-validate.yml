name: R6-D Specificity Exact Plan Offline Validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "manifests/r6d_specificity_preexecution_design_freeze_2026-09-17_v0_1.json"
      - "configs/r6/r6d_specificity_formal_subject_gate_v0.1.json"
      - "docs/R6D_specificity_execution_freeze_v0.1.md"
      - "scripts/validate_r6d_specificity_exact_plan_v0_1.py"
      - ".github/workflows/r6d-specificity-exact-plan-offline-validate.yml"
      - "README.md"
      - "arena/r5r6_specificity_atomic_v0_2.py"
      - "arena/r5r6_specificity_atomic_preflight_v0_2.py"
      - "configs/r5r6_specificity_exact_source_binding_v0.2.json"
      - "configs/r5r6_specificity_field_selection_contract_v0.2.json"
      - "manifests/r5r6_specificity_s1_selection_2026-09-17_v0_2.json"
      - "manifests/r5r6_specificity_source_slice_2026-09-17_v0_2.json"

permissions:
  contents: read

jobs:
  exact-plan-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate exact frozen R6-D plan
        run: python scripts/validate_r6d_specificity_exact_plan_v0_1.py

      - name: Validate Process Reality v4.5 stack
        run: python scripts/validate_process_reality_v4_5.py

      - name: Validate exact-source specificity
        run: python scripts/validate_r5r6_specificity_source_audit_v0_2.py

      - name: Validate R6-D runtime/schema synchronization
        run: python scripts/validate_r6d_atomic_sync_v0_1.py

      - name: Run atomic specificity tests
        run: python -m unittest arena.tests.test_r5r6_specificity_atomic_v0_2 -v

      - name: Run full Arena offline tests
        run: python -m unittest discover arena/tests -v

      - name: Materialize deterministic atomic preflight
        run: |
          set -euo pipefail
          python -m arena.r5r6_specificity_atomic_preflight_v0_2 --outdir /tmp/r6d_specificity_exact_plan_preflight
          test -s /tmp/r6d_specificity_exact_plan_preflight/plan.json
          test -s /tmp/r6d_specificity_exact_plan_preflight/summary.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/r6d_specificity_exact_plan_preflight/plan.json'))
          s=json.load(open('/tmp/r6d_specificity_exact_plan_preflight/summary.json'))
          assert p['plan_hash']=='9850917c8af15a2cbf4209c324b8204e9f43e8923d95b41492b726127c0f9df6'
          assert s['summary_hash']=='b214f8c38e6857437f11fdb2217d30537b29dfefb043a0de49bf5ca151f6c296'
          assert p['authorization_status']=='NOT_AUTHORIZED'
          assert p['paid_provider_authorized'] is False
          assert p['paid_evaluator_authorized'] is False
          assert p['semantic_cpr_status']=='NOT_ADJUDICATED'
          print('R6D_DETERMINISTIC_ATOMIC_PREFLIGHT=EXACT_MATCH')
          PY

      - name: Assert exact-plan workflow is provider-secret free
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/r6d-specificity-exact-plan-offline-validate.yml').read_text(encoding='utf-8')
          forbidden=[
              'DEEPSEEK_' + 'API_KEY',
              'DASHSCOPE_' + 'API_KEY',
              'OPENAI_' + 'API_KEY',
              'secrets.' + 'BAI',
              'CALL_' + 'REAL_',
              '--execute-' + 'real',
          ]
          found=[x for x in forbidden if x in text]
          assert not found, 'forbidden real-call capability in offline workflow: '+repr(found)
          print('PASS: exact-plan workflow has no provider credential or real-run capability')
          PY

      - name: Upload engineering-only exact-plan preflight
        uses: actions/upload-artifact@v4
        with:
          name: r6d-specificity-exact-plan-offline-preflight
          path: /tmp/r6d_specificity_exact_plan_preflight
          if-no-files-found: error
          retention-days: 90
