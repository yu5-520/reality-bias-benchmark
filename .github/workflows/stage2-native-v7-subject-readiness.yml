name: Stage-II v7 Common Subject Readiness — Manual One Call

on:
  workflow_dispatch:
    inputs:
      expected_execution_sha:
        description: "Exact repository SHA frozen for the readiness handshake"
        required: true
        type: string
      authorization_phrase:
        description: "Exact explicit Stage-II readiness authorization phrase"
        required: true
        type: string
      max_subject_calls:
        description: "Must remain exactly 1"
        required: true
        default: "1"
        type: string
      spending_ceiling_usd:
        description: "Handshake spending ceiling in USD (max 0.05)"
        required: true
        default: "0.01"
        type: string

permissions:
  contents: read

concurrency:
  group: stage2-v7-subject-readiness-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  common-provider-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-verify frozen native architecture before any paid call
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.expected_execution_sha }}" = "$GITHUB_SHA"
          python -m stage2.native_v7.freeze
          python -m unittest discover -s stage2/native_v7/tests -v

      - name: Build fail-closed common readiness preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stage2_subject_readiness
          mkdir -p /tmp/stage2_subject_readiness
          python -m stage2.native_v7.subject_readiness preflight \
            --expected-execution-sha "${{ inputs.expected_execution_sha }}" \
            --actual-execution-sha "$GITHUB_SHA" \
            --authorization-phrase "${{ inputs.authorization_phrase }}" \
            --max-subject-calls "${{ inputs.max_subject_calls }}" \
            --spending-ceiling "${{ inputs.spending_ceiling_usd }}" \
            --out /tmp/stage2_subject_readiness/preflight.json

      - name: Execute exactly one non-scientific provider handshake
        id: handshake
        shell: bash
        env:
          DEEPSEEK_API_KEY: '${{ secrets.DEEPSEEK_API_KEY }}'
        run: |
          set +e
          python -m stage2.native_v7.subject_readiness handshake \
            --preflight /tmp/stage2_subject_readiness/preflight.json \
            --out /tmp/stage2_subject_readiness/receipt.json
          code=$?
          echo "runner_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Package immutable readiness material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > /tmp/stage2_subject_readiness/execution_code_sha.txt
          tar -czf /tmp/stage2-subject-readiness-${{ github.run_id }}.tar.gz -C /tmp/stage2_subject_readiness .
          sha256sum /tmp/stage2-subject-readiness-${{ github.run_id }}.tar.gz > /tmp/stage2-subject-readiness-${{ github.run_id }}.tar.gz.sha256

      - name: Upload readiness evidence before evaluating success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-v7-subject-readiness-${{ github.run_id }}
          path: |
            /tmp/stage2-subject-readiness-${{ github.run_id }}.tar.gz
            /tmp/stage2-subject-readiness-${{ github.run_id }}.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Fail closed after evidence preservation if handshake failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code="${{ steps.handshake.outputs.runner_exit_code }}"
          test -n "$code"
          test "$code" = "0"
          test -f /tmp/stage2_subject_readiness/receipt.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/stage2_subject_readiness/receipt.json'))
          assert p['status']=='COMMON_PROVIDER_HANDSHAKE_RECORDED_NOT_SUBJECT_READY'
          assert p['provider_call_count']==1
          assert p['automatic_paid_evaluator'] is False
          assert p['scientific_task_used'] is False
          assert p['natural_cell_reserved'] is False
          assert p['registry_mutated'] is False
          assert isinstance(p['natural_trajectories_before_handshake'], int)
          assert p['natural_trajectories_before_handshake'] >= 0
          assert p['natural_trajectories_after_handshake'] == p['natural_trajectories_before_handshake']
          print('PASS: common provider handshake recorded; registry remains closed')
          PY
