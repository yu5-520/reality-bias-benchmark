              return json.loads(subprocess.check_output(
                  ['gh','api',f'repos/{repo}/actions/runs/{run_id}/artifacts'],text=True
              ))['artifacts']
          subject=artifacts(p['source_subject']['workflow_run_id'])
          audit=artifacts(p['source_semantic_audit']['workflow_run_id'])
          expected=[p['source_subject']['manifest_artifact'],*p['source_subject']['wave_artifacts']]
          for item in expected:
              rows=[x for x in subject if x['id']==item['id'] and x['name']==item['name']]
              assert len(rows)==1, item
              assert rows[0].get('digest')==item['digest'], item['name']
              assert not rows[0].get('expired'), item['name']
          item=p['source_semantic_audit']
          rows=[x for x in audit if x['id']==item['artifact_id'] and x['name']==item['artifact_name']]
          assert len(rows)==1
          assert rows[0].get('digest')==item['artifact_digest']
          assert not rows[0].get('expired')
