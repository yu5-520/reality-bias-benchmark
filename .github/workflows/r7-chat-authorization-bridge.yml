              line=raw.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid R5 authorization line: {line!r}')
              key,value=line.split('=',1)
              if key in rows:
                  raise SystemExit(f'duplicate R5 authorization key: {key}')
              rows[key]=value
          required={'authorization_phrase','expected_main_sha','authorization_id','control_plane'}
          if set(rows)!=required:
              raise SystemExit(f'R5 authorization keys mismatch: {sorted(rows)}')
          if rows['authorization_phrase']!=os.environ['EXPECTED_AUTHORIZATION_PHRASE']:
              raise SystemExit('R5 authorization phrase mismatch')
          if rows['expected_main_sha']!=os.environ['GITHUB_SHA']:
              raise SystemExit(
                  f"R5 main SHA mismatch: authorized={rows['expected_main_sha']} event={os.environ['GITHUB_SHA']}"
              )
          if rows['control_plane']!='CHAT_AUTHORIZATION_BRIDGE_V5_CROSS_DOMAIN_R5_v0.1':
              raise SystemExit('R5 control-plane identifier mismatch')
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,80}',rows['authorization_id']):
              raise SystemExit('invalid R5 authorization_id')
          print('PASS: exact R5 first-wave authorization validated')
          PY

