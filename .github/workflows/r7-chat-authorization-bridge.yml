name: R7 Chat Authorization Bridge

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: r7-chat-authorization-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch-authorized-subject:
    if: >-
      github.event.issue.user.login == 'yu5-520' &&
      github.event.issue.title == 'R7 SCIENTIFIC AUTHORIZATION'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_AUTHORIZATION_PHRASE: CALL_REAL_R7_THREE_ARM_API
      SCIENTIFIC_WORKFLOW: r7-three-arm-subject-real.yml
      AUTH_BODY: ${{ github.event.issue.body }}
      R7_REPLICATES: '2'
      R7_PER_BRANCH_CEILING_USD: '0.25'
      R7_TOTAL_CEILING_USD: '1.50'
      R7_PER_BRANCH_MAX_CALLS: '64'

    steps:
      - name: Validate exact R7 authorization record
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re

          rows = {}
          for raw in os.environ['AUTH_BODY'].splitlines():
              line = raw.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid authorization line: {line!r}')
              key, value = line.split('=', 1)
              if key in rows:
                  raise SystemExit(f'duplicate authorization key: {key}')
              rows[key] = value

          required = {
              'authorization_phrase',
              'expected_main_sha',
              'authorization_id',
              'control_plane',
          }
          if set(rows) != required:
              raise SystemExit(f'authorization keys mismatch: {sorted(rows)}')
          if rows['authorization_phrase'] != os.environ['EXPECTED_AUTHORIZATION_PHRASE']:
              raise SystemExit('authorization phrase mismatch')
          if rows['expected_main_sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit(
                  f"main SHA mismatch: authorized={rows['expected_main_sha']} event={os.environ['GITHUB_SHA']}"
              )
          if rows['control_plane'] != 'CHAT_AUTHORIZATION_BRIDGE_R7_v0.1':
              raise SystemExit('control-plane identifier mismatch')
          auth_id = rows['authorization_id']
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,80}', auth_id):
              raise SystemExit('invalid authorization_id')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"authorization_id={auth_id}\n")
          print('PASS: exact R7 chat authorization validated against current default-branch SHA')
          print('R7_REPLICATES=' + os.environ['R7_REPLICATES'])
          print('R7_PER_BRANCH_CEILING_USD=' + os.environ['R7_PER_BRANCH_CEILING_USD'])
          print('R7_TOTAL_CEILING_USD=' + os.environ['R7_TOTAL_CEILING_USD'])
          print('R7_PER_BRANCH_MAX_CALLS=' + os.environ['R7_PER_BRANCH_MAX_CALLS'])
          PY

      - name: Pin authorized execution SHA and dispatch frozen R7 workflow
        id: dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTHORIZATION_ID: ${{ steps.auth.outputs.authorization_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          workflow = os.environ['SCIENTIFIC_WORKFLOW']
          auth_id = os.environ['AUTHORIZATION_ID']
          token = os.environ['GITHUB_TOKEN']
          tag = f"r7-auth-{auth_id}"
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2026-03-10',
              'User-Agent': 'r7-chat-authorization-bridge',
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode('utf-8')
                      return resp.status, (json.loads(body) if body else {})
              except urllib.error.HTTPError as e:
                  detail = e.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'GitHub API {method} {path} failed: HTTP {e.code}: {detail}')

          # A repeated authorization_id cannot dispatch twice because ref creation fails closed.
          request('POST', '/git/refs', {'ref': f'refs/tags/{tag}', 'sha': sha})

          payload = {
              'ref': tag,
              'inputs': {
                  'replicates': os.environ['R7_REPLICATES'],
                  'per_branch_spending_ceiling_usd': os.environ['R7_PER_BRANCH_CEILING_USD'],
                  'total_spending_ceiling_usd': os.environ['R7_TOTAL_CEILING_USD'],
                  'per_branch_max_calls': os.environ['R7_PER_BRANCH_MAX_CALLS'],
                  'execution_scope': 'FULL',
                  'confirm': os.environ['EXPECTED_AUTHORIZATION_PHRASE'],
              },
              'return_run_details': True,
          }
          status, result = request('POST', f'/actions/workflows/{workflow}/dispatches', payload)
          if status not in (200, 204):
              raise SystemExit(f'unexpected dispatch status: {status}')

          run_id = result.get('workflow_run_id', '')
          html_url = result.get('html_url', '')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"authorization_tag={tag}\n")
              f.write(f"workflow_run_id={run_id}\n")
              f.write(f"workflow_run_url={html_url}\n")
          print(f'PASS: R7 workflow dispatch accepted for pinned tag {tag} at {sha}')
          if html_url:
              print(f'RUN_URL={html_url}')
          PY

      - name: Record successful dispatch on authorization issue
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_TAG: ${{ steps.dispatch.outputs.authorization_tag }}
          RUN_ID: ${{ steps.dispatch.outputs.workflow_run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.workflow_run_url }}
        shell: bash
        run: |
          set -euo pipefail
          body="R7 authorization accepted and converted to the existing fail-closed subject workflow_dispatch.\n\nPinned execution ref: ${AUTH_TAG}\nExecution SHA: ${GITHUB_SHA}\nWorkflow run id: ${RUN_ID:-not-returned}\nWorkflow run: ${RUN_URL:-dispatch-accepted}\n\nFrozen inputs: 2 matched triads / 6 branches, USD 0.25 per branch, USD 1.50 total ceiling, 64 calls per branch. No paid evaluator is enabled; CPR remains NOT_ADJUDICATED."
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed


  dispatch-authorized-cross-domain-subject:
    if: >-
      github.event.issue.user.login == 'yu5-520' &&
      github.event.issue.title == 'V5 CROSS-DOMAIN SCIENTIFIC AUTHORIZATION'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_AUTHORIZATION_PHRASE: CALL_REAL_V5_CROSS_DOMAIN_FIRST_ROUND_API
      SCIENTIFIC_WORKFLOW: v5-cross-domain-first-round-subject-real.yml
      AUTH_BODY: ${{ github.event.issue.body }}
      PER_RUN_MAX_CALLS: '64'
      PER_RUN_CEILING_USD: '0.25'
      WAVE_CEILING_USD: '3.75'
      FIRST_ROUND_CEILING_USD: '22.50'

    steps:
      - name: Validate exact cross-domain authorization record
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          rows = {}
          for raw in os.environ['AUTH_BODY'].splitlines():
              line = raw.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid authorization line: {line!r}')
              key, value = line.split('=', 1)
              if key in rows:
                  raise SystemExit(f'duplicate authorization key: {key}')
              rows[key] = value
          required = {'authorization_phrase','expected_main_sha','authorization_id','control_plane'}
          if set(rows) != required:
              raise SystemExit(f'authorization keys mismatch: {sorted(rows)}')
          if rows['authorization_phrase'] != os.environ['EXPECTED_AUTHORIZATION_PHRASE']:
              raise SystemExit('authorization phrase mismatch')
          if rows['expected_main_sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit(
                  f"main SHA mismatch: authorized={rows['expected_main_sha']} event={os.environ['GITHUB_SHA']}"
              )
          if rows['control_plane'] != 'CHAT_AUTHORIZATION_BRIDGE_V5_CROSS_DOMAIN_v0.1':
              raise SystemExit('control-plane identifier mismatch')
          auth_id = rows['authorization_id']
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,80}', auth_id):
              raise SystemExit('invalid authorization_id')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"authorization_id={auth_id}\n")
          print('PASS: exact V5 cross-domain chat authorization validated against current default-branch SHA')
          PY

      - name: Pin authorized execution SHA and dispatch frozen cross-domain workflow
        id: dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTHORIZATION_ID: ${{ steps.auth.outputs.authorization_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          workflow = os.environ['SCIENTIFIC_WORKFLOW']
          auth_id = os.environ['AUTHORIZATION_ID']
          token = os.environ['GITHUB_TOKEN']
          tag = f"v5-xd-auth-{auth_id}"
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'scientific-chat-authorization-bridge',
          }
          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode('utf-8')
                      return resp.status, (json.loads(body) if body else {})
              except urllib.error.HTTPError as e:
                  detail = e.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'GitHub API {method} {path} failed: HTTP {e.code}: {detail}')
          request('POST', '/git/refs', {'ref': f'refs/tags/{tag}', 'sha': sha})
          payload = {
              'ref': tag,
              'inputs': {
                  'expected_execution_sha': sha,
                  'authorization_phrase': os.environ['EXPECTED_AUTHORIZATION_PHRASE'],
                  'per_run_max_calls': os.environ['PER_RUN_MAX_CALLS'],
                  'per_run_spending_ceiling': os.environ['PER_RUN_CEILING_USD'],
                  'wave_spending_ceiling': os.environ['WAVE_CEILING_USD'],
                  'first_round_spending_ceiling': os.environ['FIRST_ROUND_CEILING_USD'],
              },
          }
          status, _ = request('POST', f'/actions/workflows/{workflow}/dispatches', payload)
          if status not in (200, 204):
              raise SystemExit(f'unexpected dispatch status: {status}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"authorization_tag={tag}\n")
          print(f'PASS: V5 cross-domain workflow dispatch accepted for pinned tag {tag} at {sha}')
          PY

      - name: Record successful cross-domain dispatch on authorization issue
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_TAG: ${{ steps.dispatch.outputs.authorization_tag }}
        shell: bash
        run: |
          set -euo pipefail
          body="V5 cross-domain authorization accepted and converted to the existing fail-closed six-wave subject workflow_dispatch.\n\nPinned execution ref: ${AUTH_TAG}\nExecution SHA: ${GITHUB_SHA}\n\nFrozen geometry: 3 held-out domains / 90 natural trajectories / 6 domain-pure waves / 15 trajectories per wave.\nHard ceilings: 64 calls per run, USD 0.25 per run, USD 3.75 per wave, USD 22.50 first round.\nNo paid evaluator, R5 probe, R7 repair, or R8 CPR adjudication is enabled by this dispatch."
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed


  execute-cross-domain-semantic-triage:
    if: >-
      github.event.issue.user.login == 'yu5-520' &&
      github.event.issue.title == 'V5 CROSS-DOMAIN SEMANTIC TRIAGE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTH_BODY: ${{ github.event.issue.body }}
      EXPECTED_EXECUTION_PHRASE: RUN_FROZEN_V5_CROSS_DOMAIN_TRIAGE
      TRIAGE_CONTRACT: configs/v5_cross_domain_semantic_triage_v0.1.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact frozen-evidence triage request
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          rows={}
          for raw in os.environ['AUTH_BODY'].splitlines():
              line=raw.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid triage request line: {line!r}')
              key,value=line.split('=',1)
              if key in rows:
                  raise SystemExit(f'duplicate triage request key: {key}')
              rows[key]=value
          required={
              'execution_phrase',
              'source_run_id',
              'expected_source_sha',
              'authorization_id',
              'control_plane',
          }
          if set(rows)!=required:
              raise SystemExit(f'triage request keys mismatch: {sorted(rows)}')
          if rows['execution_phrase']!=os.environ['EXPECTED_EXECUTION_PHRASE']:
              raise SystemExit('triage execution phrase mismatch')
          if rows['control_plane']!='CHAT_EXECUTION_BRIDGE_V5_CROSS_DOMAIN_TRIAGE_v0.1':
              raise SystemExit('triage control-plane identifier mismatch')
          if not re.fullmatch(r'\d{6,20}', rows['source_run_id']):
              raise SystemExit('invalid source_run_id')
          if not re.fullmatch(r'[0-9a-f]{40}', rows['expected_source_sha']):
              raise SystemExit('invalid expected_source_sha')
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,80}', rows['authorization_id']):
              raise SystemExit('invalid authorization_id')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('source_run_id='+rows['source_run_id']+'\n')
              fh.write('expected_source_sha='+rows['expected_source_sha']+'\n')
              fh.write('authorization_id='+rows['authorization_id']+'\n')
          print('PASS: exact cross-domain frozen-evidence triage request validated')
          PY

      - name: Verify completed six-wave source workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.auth.outputs.source_run_id }}
          EXPECTED_SOURCE_SHA: ${{ steps.auth.outputs.expected_source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source_run.json"
          python - <<'PY'
          import json, os
          p=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'source_run.json')))
          assert p['status']=='completed'
          assert p['conclusion']=='success'
          assert p['head_sha']==os.environ['EXPECTED_SOURCE_SHA']
          assert p['path']=='.github/workflows/v5-cross-domain-first-round-subject-real.yml'
          print('PASS: source run is the completed cross-domain first-round workflow')
          PY

      - name: Download six immutable wave evidence bundles
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.auth.outputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p results/v5_cross_domain_source
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "v5-cross-domain-first-round-wave-*-$SOURCE_RUN_ID" \
            --dir results/v5_cross_domain_source
          test "$(find results/v5_cross_domain_source -name evidence_batch.json -type f | wc -l)" -eq 6
          test "$(find results/v5_cross_domain_source -name v5_structural_index.jsonl -type f | wc -l)" -eq 6
          test "$(find results/v5_cross_domain_source -name traces.jsonl -type f | wc -l)" -eq 6

      - name: Build deterministic localized semantic-audit queue
        run: |
          set -euo pipefail
          python -m arena.build_v5_cross_domain_semantic_triage \
            --input-root results/v5_cross_domain_source \
            --contract "$TRIAGE_CONTRACT" \
            --outdir results/v5_cross_domain_semantic_triage

      - name: Validate triage boundary and capture summary
        id: stats
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p=json.load(open('results/v5_cross_domain_semantic_triage/summary.json'))
          assert p['trajectory_count']==90
          assert p['source_wave_count']==6
          assert p['role_assignment_counts']['FORMATION_ANCHOR']==90
          assert p['role_assignment_counts']['PROPAGATION_ANCHOR']==90
          assert 0 <= p['role_assignment_counts'].get('AUTHORITY_REVIEW_ANCHOR',0) <= 90
          assert 90 <= p['selected_unique_case_count'] <= 270
          assert p['provider_calls']==0
          assert p['paid_evaluator_calls']==0
          assert p['r5_probe_calls']==0
          assert p['r7_repair_calls']==0
          assert p['r8_cpr_adjudication'] is False
          assert p['semantic_status']=='NOT_ADJUDICATED'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('case_count='+str(p['selected_unique_case_count'])+'\n')
              fh.write('authority_counts='+json.dumps(p['authority_review_trajectory_counts'],sort_keys=True,separators=(',',':'))+'\n')
              fh.write('summary_hash='+p['summary_hash']+'\n')
          print('PASS: deterministic triage preserves semantic and active-stage boundaries')
          PY

      - name: Upload append-only semantic-triage artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-cross-domain-semantic-triage-${{ steps.auth.outputs.source_run_id }}-${{ github.run_id }}
          path: results/v5_cross_domain_semantic_triage
          retention-days: 90
          if-no-files-found: error

      - name: Record completed triage on execution issue
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.auth.outputs.source_run_id }}
          CASE_COUNT: ${{ steps.stats.outputs.case_count }}
          AUTHORITY_COUNTS: ${{ steps.stats.outputs.authority_counts }}
          SUMMARY_HASH: ${{ steps.stats.outputs.summary_hash }}
        shell: bash
        run: |
          set -euo pipefail
          body="Frozen-evidence cross-domain semantic triage completed.\n\nSource subject run: ${SOURCE_RUN_ID}\nTriage workflow run: $GITHUB_RUN_ID\nSelected unique localized-audit cases: ${CASE_COUNT}\nAuthority-review trajectory counts: ${AUTHORITY_COUNTS}\nSummary hash: ${SUMMARY_HASH}\n\nProvider calls: 0. Paid evaluator calls: 0. R5/R7 calls: 0. CPR remains NOT_ADJUDICATED."
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed


  materialize-cross-domain-localized-semantic-audit-pass1:
    if: >-
      github.event.issue.user.login == 'yu5-520' &&
      github.event.issue.title == 'V5 CROSS-DOMAIN LOCALIZED SEMANTIC AUDIT'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_BODY: ${{ github.event.issue.body }}
      EXPECTED_EXECUTION_PHRASE: MATERIALIZE_FROZEN_V5_CROSS_DOMAIN_SEMANTIC_AUDIT_PASS1
      REVIEW_MANIFEST: manifests/v5_cross_domain_localized_semantic_audit_review_2026-09-19_v0_1.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact audit materialization request
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          rows={}
          for raw in os.environ['AUTH_BODY'].splitlines():
              line=raw.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid audit request line: {line!r}')
              key,value=line.split('=',1)
              if key in rows:
                  raise SystemExit(f'duplicate audit request key: {key}')
              rows[key]=value
          required={
              'execution_phrase',
              'source_triage_run_id',
              'expected_triage_summary_hash',
              'authorization_id',
              'control_plane',
          }
          if set(rows)!=required:
              raise SystemExit(f'audit request keys mismatch: {sorted(rows)}')
          if rows['execution_phrase']!=os.environ['EXPECTED_EXECUTION_PHRASE']:
              raise SystemExit('audit execution phrase mismatch')
          if rows['control_plane']!='CHAT_EXECUTION_BRIDGE_V5_CROSS_DOMAIN_SEMANTIC_AUDIT_v0.1':
              raise SystemExit('audit control-plane identifier mismatch')
          if not re.fullmatch(r'\d{6,20}', rows['source_triage_run_id']):
              raise SystemExit('invalid source_triage_run_id')
          if not re.fullmatch(r'[0-9a-f]{64}', rows['expected_triage_summary_hash']):
              raise SystemExit('invalid expected_triage_summary_hash')
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,80}', rows['authorization_id']):
              raise SystemExit('invalid authorization_id')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('source_triage_run_id='+rows['source_triage_run_id']+'\n')
              fh.write('expected_triage_summary_hash='+rows['expected_triage_summary_hash']+'\n')
          print('PASS: exact localized semantic-audit materialization request validated')
          PY

      - name: Verify frozen review manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p=json.load(open(os.environ['REVIEW_MANIFEST']))
          assert p['status']=='MODEL_REVIEW_PASS1_APPEND_ONLY'
          assert p['auditor']['auditor_id']=='GPT-5.6-Sol'
          assert p['selection_rule']['reviewed_case_count']==29
          assert p['domain_counts']=={'finance':5,'software_engineering':8,'supply_chain':16}
          assert len(p['reviewed_case_hashes'])==29
          assert len(set(p['reviewed_case_hashes']))==29
          assert p['uniform_review_decision']['r5_probe_authorized'] is False
          assert p['uniform_review_decision']['r7_repair_authorized'] is False
          print('PASS: frozen model-review decisions are internally consistent')
          PY

      - name: Verify completed triage source workflow and artifact digest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TRIAGE_RUN_ID: ${{ steps.auth.outputs.source_triage_run_id }}
          EXPECTED_TRIAGE_SUMMARY_HASH: ${{ steps.auth.outputs.expected_triage_summary_hash }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_TRIAGE_RUN_ID" > "$RUNNER_TEMP/triage_run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_TRIAGE_RUN_ID/artifacts" > "$RUNNER_TEMP/triage_artifacts.json"
          python - <<'PY'
          import json, os
          review=json.load(open(os.environ['REVIEW_MANIFEST']))
          run=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'triage_run.json')))
          arts=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'triage_artifacts.json')))['artifacts']
          assert run['status']=='completed' and run['conclusion']=='success'
          assert int(run['id'])==int(os.environ['SOURCE_TRIAGE_RUN_ID'])
