name: R7 Chat Authorization Bridge

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: r7-chat-authorization-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch-authorized-subject:
    if: >-
      github.event.issue.user.login == 'yu5-520' &&
      github.event.issue.title == 'R7 SCIENTIFIC AUTHORIZATION'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_AUTHORIZATION_PHRASE: CALL_REAL_R7_THREE_ARM_API
      SCIENTIFIC_WORKFLOW: r7-three-arm-subject-real.yml
      AUTH_BODY: ${{ github.event.issue.body }}
      R7_REPLICATES: '2'
      R7_PER_BRANCH_CEILING_USD: '0.25'
      R7_TOTAL_CEILING_USD: '1.50'
      R7_PER_BRANCH_MAX_CALLS: '64'

    steps:
      - name: Validate exact R7 authorization record
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re

          rows = {}
          for raw in os.environ['AUTH_BODY'].splitlines():
              line = raw.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid authorization line: {line!r}')
              key, value = line.split('=', 1)
              if key in rows:
                  raise SystemExit(f'duplicate authorization key: {key}')
              rows[key] = value

          required = {
              'authorization_phrase',
              'expected_main_sha',
              'authorization_id',
              'control_plane',
          }
          if set(rows) != required:
              raise SystemExit(f'authorization keys mismatch: {sorted(rows)}')
          if rows['authorization_phrase'] != os.environ['EXPECTED_AUTHORIZATION_PHRASE']:
              raise SystemExit('authorization phrase mismatch')
          if rows['expected_main_sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit(
                  f"main SHA mismatch: authorized={rows['expected_main_sha']} event={os.environ['GITHUB_SHA']}"
              )
          if rows['control_plane'] != 'CHAT_AUTHORIZATION_BRIDGE_R7_v0.1':
              raise SystemExit('control-plane identifier mismatch')
          auth_id = rows['authorization_id']
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,80}', auth_id):
              raise SystemExit('invalid authorization_id')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"authorization_id={auth_id}\n")
          print('PASS: exact R7 chat authorization validated against current default-branch SHA')
          print('R7_REPLICATES=' + os.environ['R7_REPLICATES'])
          print('R7_PER_BRANCH_CEILING_USD=' + os.environ['R7_PER_BRANCH_CEILING_USD'])
          print('R7_TOTAL_CEILING_USD=' + os.environ['R7_TOTAL_CEILING_USD'])
          print('R7_PER_BRANCH_MAX_CALLS=' + os.environ['R7_PER_BRANCH_MAX_CALLS'])
          PY

      - name: Pin authorized execution SHA and dispatch frozen R7 workflow
        id: dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTHORIZATION_ID: ${{ steps.auth.outputs.authorization_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          workflow = os.environ['SCIENTIFIC_WORKFLOW']
          auth_id = os.environ['AUTHORIZATION_ID']
          token = os.environ['GITHUB_TOKEN']
          tag = f"r7-auth-{auth_id}"
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2026-03-10',
              'User-Agent': 'r7-chat-authorization-bridge',
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode('utf-8')
                      return resp.status, (json.loads(body) if body else {})
              except urllib.error.HTTPError as e:
                  detail = e.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'GitHub API {method} {path} failed: HTTP {e.code}: {detail}')

          # A repeated authorization_id cannot dispatch twice because ref creation fails closed.
          request('POST', '/git/refs', {'ref': f'refs/tags/{tag}', 'sha': sha})

          payload = {
              'ref': tag,
              'inputs': {
                  'replicates': os.environ['R7_REPLICATES'],
                  'per_branch_spending_ceiling_usd': os.environ['R7_PER_BRANCH_CEILING_USD'],
                  'total_spending_ceiling_usd': os.environ['R7_TOTAL_CEILING_USD'],
                  'per_branch_max_calls': os.environ['R7_PER_BRANCH_MAX_CALLS'],
                  'execution_scope': 'FULL',
                  'confirm': os.environ['EXPECTED_AUTHORIZATION_PHRASE'],
              },
              'return_run_details': True,
          }
          status, result = request('POST', f'/actions/workflows/{workflow}/dispatches', payload)
          if status not in (200, 204):
              raise SystemExit(f'unexpected dispatch status: {status}')

          run_id = result.get('workflow_run_id', '')
          html_url = result.get('html_url', '')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"authorization_tag={tag}\n")
              f.write(f"workflow_run_id={run_id}\n")
              f.write(f"workflow_run_url={html_url}\n")
          print(f'PASS: R7 workflow dispatch accepted for pinned tag {tag} at {sha}')
          if html_url:
              print(f'RUN_URL={html_url}')
          PY

      - name: Record successful dispatch on authorization issue
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_TAG: ${{ steps.dispatch.outputs.authorization_tag }}
          RUN_ID: ${{ steps.dispatch.outputs.workflow_run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.workflow_run_url }}
        shell: bash
        run: |
          set -euo pipefail
          body="R7 authorization accepted and converted to the existing fail-closed subject workflow_dispatch.\n\nPinned execution ref: ${AUTH_TAG}\nExecution SHA: ${GITHUB_SHA}\nWorkflow run id: ${RUN_ID:-not-returned}\nWorkflow run: ${RUN_URL:-dispatch-accepted}\n\nFrozen inputs: 2 matched triads / 6 branches, USD 0.25 per branch, USD 1.50 total ceiling, 64 calls per branch. No paid evaluator is enabled; CPR remains NOT_ADJUDICATED."
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed


  dispatch-authorized-cross-domain-subject:
    if: >-
      github.event.issue.user.login == 'yu5-520' &&
      github.event.issue.title == 'V5 CROSS-DOMAIN SCIENTIFIC AUTHORIZATION'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_AUTHORIZATION_PHRASE: CALL_REAL_V5_CROSS_DOMAIN_FIRST_ROUND_API
      SCIENTIFIC_WORKFLOW: v5-cross-domain-first-round-subject-real.yml
      AUTH_BODY: ${{ github.event.issue.body }}
      PER_RUN_MAX_CALLS: '64'
      PER_RUN_CEILING_USD: '0.25'
      WAVE_CEILING_USD: '3.75'
      FIRST_ROUND_CEILING_USD: '22.50'

    steps:
      - name: Validate exact cross-domain authorization record
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          rows = {}
          for raw in os.environ['AUTH_BODY'].splitlines():
              line = raw.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid authorization line: {line!r}')
              key, value = line.split('=', 1)
              if key in rows:
                  raise SystemExit(f'duplicate authorization key: {key}')
              rows[key] = value
          required = {'authorization_phrase','expected_main_sha','authorization_id','control_plane'}
          if set(rows) != required:
              raise SystemExit(f'authorization keys mismatch: {sorted(rows)}')
          if rows['authorization_phrase'] != os.environ['EXPECTED_AUTHORIZATION_PHRASE']:
              raise SystemExit('authorization phrase mismatch')
          if rows['expected_main_sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit(
                  f"main SHA mismatch: authorized={rows['expected_main_sha']} event={os.environ['GITHUB_SHA']}"
              )
          if rows['control_plane'] != 'CHAT_AUTHORIZATION_BRIDGE_V5_CROSS_DOMAIN_v0.1':
              raise SystemExit('control-plane identifier mismatch')
          auth_id = rows['authorization_id']
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,80}', auth_id):
              raise SystemExit('invalid authorization_id')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"authorization_id={auth_id}\n")
          print('PASS: exact V5 cross-domain chat authorization validated against current default-branch SHA')
          PY

      - name: Pin authorized execution SHA and dispatch frozen cross-domain workflow
        id: dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTHORIZATION_ID: ${{ steps.auth.outputs.authorization_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          workflow = os.environ['SCIENTIFIC_WORKFLOW']
          auth_id = os.environ['AUTHORIZATION_ID']
          token = os.environ['GITHUB_TOKEN']
          tag = f"v5-xd-auth-{auth_id}"
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'scientific-chat-authorization-bridge',
          }
          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode('utf-8')
                      return resp.status, (json.loads(body) if body else {})
              except urllib.error.HTTPError as e:
                  detail = e.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'GitHub API {method} {path} failed: HTTP {e.code}: {detail}')
          request('POST', '/git/refs', {'ref': f'refs/tags/{tag}', 'sha': sha})
          payload = {
              'ref': tag,
              'inputs': {
                  'expected_execution_sha': sha,
                  'authorization_phrase': os.environ['EXPECTED_AUTHORIZATION_PHRASE'],
                  'per_run_max_calls': os.environ['PER_RUN_MAX_CALLS'],
                  'per_run_spending_ceiling': os.environ['PER_RUN_CEILING_USD'],
                  'wave_spending_ceiling': os.environ['WAVE_CEILING_USD'],
                  'first_round_spending_ceiling': os.environ['FIRST_ROUND_CEILING_USD'],
              },
          }
          status, _ = request('POST', f'/actions/workflows/{workflow}/dispatches', payload)
          if status not in (200, 204):
              raise SystemExit(f'unexpected dispatch status: {status}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"authorization_tag={tag}\n")
          print(f'PASS: V5 cross-domain workflow dispatch accepted for pinned tag {tag} at {sha}')
          PY

      - name: Record successful cross-domain dispatch on authorization issue
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_TAG: ${{ steps.dispatch.outputs.authorization_tag }}
        shell: bash
        run: |
          set -euo pipefail
          body="V5 cross-domain authorization accepted and converted to the existing fail-closed six-wave subject workflow_dispatch.\n\nPinned execution ref: ${AUTH_TAG}\nExecution SHA: ${GITHUB_SHA}\n\nFrozen geometry: 3 held-out domains / 90 natural trajectories / 6 domain-pure waves / 15 trajectories per wave.\nHard ceilings: 64 calls per run, USD 0.25 per run, USD 3.75 per wave, USD 22.50 first round.\nNo paid evaluator, R5 probe, R7 repair, or R8 CPR adjudication is enabled by this dispatch."
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed


  execute-cross-domain-semantic-triage:
    if: >-
      github.event.issue.user.login == 'yu5-520' &&
      github.event.issue.title == 'V5 CROSS-DOMAIN SEMANTIC TRIAGE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTH_BODY: ${{ github.event.issue.body }}
      EXPECTED_EXECUTION_PHRASE: RUN_FROZEN_V5_CROSS_DOMAIN_TRIAGE
      TRIAGE_CONTRACT: configs/v5_cross_domain_semantic_triage_v0.1.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact frozen-evidence triage request
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          rows={}
          for raw in os.environ['AUTH_BODY'].splitlines():
              line=raw.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid triage request line: {line!r}')
              key,value=line.split('=',1)
              if key in rows:
                  raise SystemExit(f'duplicate triage request key: {key}')
              rows[key]=value
          required={
              'execution_phrase',
              'source_run_id',
              'expected_source_sha',
              'authorization_id',
              'control_plane',
          }
          if set(rows)!=required:
              raise SystemExit(f'triage request keys mismatch: {sorted(rows)}')
          if rows['execution_phrase']!=os.environ['EXPECTED_EXECUTION_PHRASE']:
              raise SystemExit('triage execution phrase mismatch')
          if rows['control_plane']!='CHAT_EXECUTION_BRIDGE_V5_CROSS_DOMAIN_TRIAGE_v0.1':
              raise SystemExit('triage control-plane identifier mismatch')
          if not re.fullmatch(r'\d{6,20}', rows['source_run_id']):
              raise SystemExit('invalid source_run_id')
          if not re.fullmatch(r'[0-9a-f]{40}', rows['expected_source_sha']):
              raise SystemExit('invalid expected_source_sha')
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,80}', rows['authorization_id']):
              raise SystemExit('invalid authorization_id')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('source_run_id='+rows['source_run_id']+'\n')
              fh.write('expected_source_sha='+rows['expected_source_sha']+'\n')
              fh.write('authorization_id='+rows['authorization_id']+'\n')
          print('PASS: exact cross-domain frozen-evidence triage request validated')
          PY

      - name: Verify completed six-wave source workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.auth.outputs.source_run_id }}
          EXPECTED_SOURCE_SHA: ${{ steps.auth.outputs.expected_source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source_run.json"
          python - <<'PY'
          import json, os
          p=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'source_run.json')))
          assert p['status']=='completed'
          assert p['conclusion']=='success'
          assert p['head_sha']==os.environ['EXPECTED_SOURCE_SHA']
          assert p['path']=='.github/workflows/v5-cross-domain-first-round-subject-real.yml'
          print('PASS: source run is the completed cross-domain first-round workflow')
          PY

      - name: Download six immutable wave evidence bundles
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.auth.outputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p results/v5_cross_domain_source
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "v5-cross-domain-first-round-wave-*-$SOURCE_RUN_ID" \
            --dir results/v5_cross_domain_source
          test "$(find results/v5_cross_domain_source -name evidence_batch.json -type f | wc -l)" -eq 6
          test "$(find results/v5_cross_domain_source -name v5_structural_index.jsonl -type f | wc -l)" -eq 6
          test "$(find results/v5_cross_domain_source -name traces.jsonl -type f | wc -l)" -eq 6

      - name: Build deterministic localized semantic-audit queue
        run: |
          set -euo pipefail
          python -m arena.build_v5_cross_domain_semantic_triage \
            --input-root results/v5_cross_domain_source \
            --contract "$TRIAGE_CONTRACT" \
            --outdir results/v5_cross_domain_semantic_triage

      - name: Validate triage boundary and capture summary
        id: stats
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p=json.load(open('results/v5_cross_domain_semantic_triage/summary.json'))
          assert p['trajectory_count']==90
          assert p['source_wave_count']==6
          assert p['role_assignment_counts']['FORMATION_ANCHOR']==90
          assert p['role_assignment_counts']['PROPAGATION_ANCHOR']==90
          assert 0 <= p['role_assignment_counts'].get('AUTHORITY_REVIEW_ANCHOR',0) <= 90
          assert 90 <= p['selected_unique_case_count'] <= 270
          assert p['provider_calls']==0
          assert p['paid_evaluator_calls']==0
          assert p['r5_probe_calls']==0
          assert p['r7_repair_calls']==0
          assert p['r8_cpr_adjudication'] is False
          assert p['semantic_status']=='NOT_ADJUDICATED'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('case_count='+str(p['selected_unique_case_count'])+'\n')
              fh.write('authority_counts='+json.dumps(p['authority_review_trajectory_counts'],sort_keys=True,separators=(',',':'))+'\n')
              fh.write('summary_hash='+p['summary_hash']+'\n')
          print('PASS: deterministic triage preserves semantic and active-stage boundaries')
          PY

      - name: Upload append-only semantic-triage artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-cross-domain-semantic-triage-${{ steps.auth.outputs.source_run_id }}-${{ github.run_id }}
          path: results/v5_cross_domain_semantic_triage
          retention-days: 90
          if-no-files-found: error

      - name: Record completed triage on execution issue
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.auth.outputs.source_run_id }}
          CASE_COUNT: ${{ steps.stats.outputs.case_count }}
          AUTHORITY_COUNTS: ${{ steps.stats.outputs.authority_counts }}
          SUMMARY_HASH: ${{ steps.stats.outputs.summary_hash }}
        shell: bash
        run: |
          set -euo pipefail
          body="Frozen-evidence cross-domain semantic triage completed.\n\nSource subject run: ${SOURCE_RUN_ID}\nTriage workflow run: $GITHUB_RUN_ID\nSelected unique localized-audit cases: ${CASE_COUNT}\nAuthority-review trajectory counts: ${AUTHORITY_COUNTS}\nSummary hash: ${SUMMARY_HASH}\n\nProvider calls: 0. Paid evaluator calls: 0. R5/R7 calls: 0. CPR remains NOT_ADJUDICATED."
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed


  materialize-cross-domain-localized-semantic-audit-pass1:
    if: >-
      github.event.issue.user.login == 'yu5-520' &&
      github.event.issue.title == 'V5 CROSS-DOMAIN LOCALIZED SEMANTIC AUDIT'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_BODY: ${{ github.event.issue.body }}
      EXPECTED_EXECUTION_PHRASE: MATERIALIZE_FROZEN_V5_CROSS_DOMAIN_SEMANTIC_AUDIT_PASS1
      REVIEW_MANIFEST: manifests/v5_cross_domain_localized_semantic_audit_review_2026-09-19_v0_1.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact audit materialization request
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          rows={}
          for raw in os.environ['AUTH_BODY'].splitlines():
              line=raw.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid audit request line: {line!r}')
              key,value=line.split('=',1)
              if key in rows:
                  raise SystemExit(f'duplicate audit request key: {key}')
              rows[key]=value
          required={
              'execution_phrase',
              'source_triage_run_id',
              'expected_triage_summary_hash',
              'authorization_id',
              'control_plane',
          }
          if set(rows)!=required:
              raise SystemExit(f'audit request keys mismatch: {sorted(rows)}')
          if rows['execution_phrase']!=os.environ['EXPECTED_EXECUTION_PHRASE']:
              raise SystemExit('audit execution phrase mismatch')
          if rows['control_plane']!='CHAT_EXECUTION_BRIDGE_V5_CROSS_DOMAIN_SEMANTIC_AUDIT_v0.1':
              raise SystemExit('audit control-plane identifier mismatch')
          if not re.fullmatch(r'\d{6,20}', rows['source_triage_run_id']):
              raise SystemExit('invalid source_triage_run_id')
          if not re.fullmatch(r'[0-9a-f]{64}', rows['expected_triage_summary_hash']):
              raise SystemExit('invalid expected_triage_summary_hash')
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,80}', rows['authorization_id']):
              raise SystemExit('invalid authorization_id')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('source_triage_run_id='+rows['source_triage_run_id']+'\n')
              fh.write('expected_triage_summary_hash='+rows['expected_triage_summary_hash']+'\n')
          print('PASS: exact localized semantic-audit materialization request validated')
          PY

      - name: Verify frozen review manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          p=json.load(open(os.environ['REVIEW_MANIFEST']))
          assert p['status']=='MODEL_REVIEW_PASS1_APPEND_ONLY'
          assert p['auditor']['auditor_id']=='GPT-5.6-Sol'
          assert p['selection_rule']['reviewed_case_count']==29
          assert p['domain_counts']=={'finance':5,'software_engineering':8,'supply_chain':16}
          assert len(p['reviewed_case_hashes'])==29
          assert len(set(p['reviewed_case_hashes']))==29
          assert p['uniform_review_decision']['r5_probe_authorized'] is False
          assert p['uniform_review_decision']['r7_repair_authorized'] is False
          print('PASS: frozen model-review decisions are internally consistent')
          PY

      - name: Verify completed triage source workflow and artifact digest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TRIAGE_RUN_ID: ${{ steps.auth.outputs.source_triage_run_id }}
          EXPECTED_TRIAGE_SUMMARY_HASH: ${{ steps.auth.outputs.expected_triage_summary_hash }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_TRIAGE_RUN_ID" > "$RUNNER_TEMP/triage_run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_TRIAGE_RUN_ID/artifacts" > "$RUNNER_TEMP/triage_artifacts.json"
          python - <<'PY'
          import json, os
          review=json.load(open(os.environ['REVIEW_MANIFEST']))
          run=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'triage_run.json')))
          arts=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'triage_artifacts.json')))['artifacts']
          assert run['status']=='completed' and run['conclusion']=='success'
          assert int(run['id'])==int(os.environ['SOURCE_TRIAGE_RUN_ID'])
          assert review['source_triage']['workflow_run_id']==int(run['id'])
          matches=[a for a in arts if a['id']==review['source_triage']['artifact_id']]
          assert len(matches)==1
          assert matches[0].get('digest')==review['source_triage']['artifact_digest']
          assert review['source_triage']['summary_hash']==os.environ['EXPECTED_TRIAGE_SUMMARY_HASH']
          print('PASS: exact frozen triage artifact identity verified')
          PY

      - name: Download exact triage artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TRIAGE_RUN_ID: ${{ steps.auth.outputs.source_triage_run_id }}
        run: |
          set -euo pipefail
          mkdir -p results/v5_cross_domain_semantic_triage_source
          gh run download "$SOURCE_TRIAGE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "v5-cross-domain-semantic-triage-*-$SOURCE_TRIAGE_RUN_ID" \
            --dir results/v5_cross_domain_semantic_triage_source
          test "$(find results/v5_cross_domain_semantic_triage_source -name semantic_triage_cases.jsonl -type f | wc -l)" -eq 1
          test "$(find results/v5_cross_domain_semantic_triage_source -name summary.json -type f | wc -l)" -eq 1

      - name: Verify triage summary hash and materialize reviewed audit records
        id: materialize
        env:
          EXPECTED_TRIAGE_SUMMARY_HASH: ${{ steps.auth.outputs.expected_triage_summary_hash }}
        shell: bash
        run: |
          set -euo pipefail
          TRIAGE_CASES="$(find results/v5_cross_domain_semantic_triage_source -name semantic_triage_cases.jsonl -type f)"
          TRIAGE_SUMMARY="$(find results/v5_cross_domain_semantic_triage_source -name summary.json -type f)"
          export TRIAGE_SUMMARY
          python - <<'PY'
          import json, os
          from arena.core import stable_hash
          p=json.load(open(os.environ['TRIAGE_SUMMARY']))
          expected=os.environ['EXPECTED_TRIAGE_SUMMARY_HASH']
          assert p['summary_hash']==expected
          assert stable_hash({k:v for k,v in p.items() if k!='summary_hash'})==expected
          print('PASS: triage summary content hash verified')
          PY
          python -m arena.build_v5_cross_domain_localized_semantic_audit \
            --triage-cases "$TRIAGE_CASES" \
            --decisions "$REVIEW_MANIFEST" \
            --outdir results/v5_cross_domain_localized_semantic_audit
          python - <<'PY'
          import json, os
          p=json.load(open('results/v5_cross_domain_localized_semantic_audit/summary.json'))
          assert p['reviewed_case_count']==29
          assert p['domain_counts']=={'finance':5,'software_engineering':8,'supply_chain':16}
          assert p['r5_scientifically_eligible_count']==29
          assert p['r5_existing_fact_to_unconfirmed_compatible_count']==29
          assert p['deferred_authority_case_count']==56
          assert p['provider_calls']==0 and p['paid_evaluator_calls']==0
          assert p['r5_probe_calls']==0 and p['r7_repair_calls']==0
          assert p['r8_cpr_adjudication'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('summary_hash='+p['summary_hash']+'\n')
          print('PASS: localized semantic audit pass 1 materialized without active experiment calls')
          PY

      - name: Upload append-only localized semantic-audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-cross-domain-localized-semantic-audit-pass1-${{ steps.auth.outputs.source_triage_run_id }}-${{ github.run_id }}
          path: results/v5_cross_domain_localized_semantic_audit
          retention-days: 90
          if-no-files-found: error

      - name: Record completed semantic audit pass 1
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_HASH: ${{ steps.materialize.outputs.summary_hash }}
        shell: bash
        run: |
          set -euo pipefail
          body="Cross-domain localized semantic audit pass 1 materialized and frozen.\n\nReviewed cases: 29 fact-status authority-review anchors (finance 5 / software_engineering 8 / supply_chain 16).\nSemantic adoption: 29 SUPPORTED_CANDIDATE.\nDecision/action dependence: 29 SUPPORTED_CANDIDATE.\nUncertainty preservation: 29 SUPPORTED_CANDIDATE.\nAuthority escalation: 0 established.\nR5 scientific eligibility: 29; existing fact->unconfirmed operator compatible: 29.\nDeferred authority-review cases: 56 provisional/unspecified sources.\nSummary hash: ${SUMMARY_HASH}.\n\nProvider/evaluator/R5/R7 calls: 0. CPR remains NOT_ADJUDICATED."
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed


  execute-cross-domain-r5-first-wave:
    if: >-
      github.event.issue.user.login == 'yu5-520' &&
      github.event.issue.title == 'V5 CROSS-DOMAIN R5 FIRST WAVE'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AUTH_BODY: ${{ github.event.issue.body }}
      PLAN_CONFIG: configs/v5_cross_domain_r5_first_wave_v0.1.json
      EXPECTED_AUTHORIZATION_PHRASE: CALL_REAL_V5_CROSS_DOMAIN_R5_FIRST_WAVE_API
      PER_BRANCH_MAX_CALLS: '64'
      PER_BRANCH_CEILING_USD: '0.25'
      GLOBAL_CEILING_USD: '6.00'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact R5 first-wave authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          rows={}
          for raw in os.environ['AUTH_BODY'].splitlines():
              line=raw.strip()
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid R5 authorization line: {line!r}')
              key,value=line.split('=',1)
              if key in rows:
                  raise SystemExit(f'duplicate R5 authorization key: {key}')
              rows[key]=value
          required={'authorization_phrase','expected_main_sha','authorization_id','control_plane'}
          if set(rows)!=required:
              raise SystemExit(f'R5 authorization keys mismatch: {sorted(rows)}')
          if rows['authorization_phrase']!=os.environ['EXPECTED_AUTHORIZATION_PHRASE']:
              raise SystemExit('R5 authorization phrase mismatch')
          if rows['expected_main_sha']!=os.environ['GITHUB_SHA']:
              raise SystemExit(
                  f"R5 main SHA mismatch: authorized={rows['expected_main_sha']} event={os.environ['GITHUB_SHA']}"
              )
          if rows['control_plane']!='CHAT_AUTHORIZATION_BRIDGE_V5_CROSS_DOMAIN_R5_v0.1':
              raise SystemExit('R5 control-plane identifier mismatch')
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,80}',rows['authorization_id']):
              raise SystemExit('invalid R5 authorization_id')
          print('PASS: exact R5 first-wave authorization validated')
          PY

      - name: Verify exact frozen source artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          p=json.load(open(os.environ['PLAN_CONFIG']))
          repo=os.environ['GITHUB_REPOSITORY']
          def artifacts(run_id):
              return json.loads(subprocess.check_output(
                  ['gh','api',f'repos/{repo}/actions/runs/{run_id}/artifacts'],text=True
              ))['artifacts']
          subject=artifacts(p['source_subject']['workflow_run_id'])
          audit=artifacts(p['source_semantic_audit']['workflow_run_id'])
          expected=[p['source_subject']['manifest_artifact'],*p['source_subject']['wave_artifacts']]
          for item in expected:
              rows=[x for x in subject if x['id']==item['id'] and x['name']==item['name']]
              assert len(rows)==1, item
              assert rows[0].get('digest')==item['digest'], item['name']
              assert not rows[0].get('expired'), item['name']
          item=p['source_semantic_audit']
          rows=[x for x in audit if x['id']==item['artifact_id'] and x['name']==item['artifact_name']]
          assert len(rows)==1
          assert rows[0].get('digest')==item['artifact_digest']
          assert not rows[0].get('expired')
          print('PASS: exact natural and semantic-audit artifacts verified')
          PY

      - name: Download frozen natural manifest, six wave bundles and semantic audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source/manifest source/waves source/audit
          python - <<'PY' > "$RUNNER_TEMP/r5_source.env"
          import json, os
          p=json.load(open(os.environ['PLAN_CONFIG']))
          print('SUBJECT_RUN='+str(p['source_subject']['workflow_run_id']))
          print('MANIFEST_NAME='+p['source_subject']['manifest_artifact']['name'])
          print('AUDIT_RUN='+str(p['source_semantic_audit']['workflow_run_id']))
          print('AUDIT_NAME='+p['source_semantic_audit']['artifact_name'])
          for x in p['source_subject']['wave_artifacts']:
              print('WAVE_NAME_'+str(x['wave_id'])+'='+x['name'])
          PY
          source "$RUNNER_TEMP/r5_source.env"
          gh run download "$SUBJECT_RUN" --repo "$GITHUB_REPOSITORY" --name "$MANIFEST_NAME" --dir source/manifest
          for i in 1 2 3 4 5 6; do
            var="WAVE_NAME_$i"
            mkdir -p "source/waves/artifact-$i"
            gh run download "$SUBJECT_RUN" --repo "$GITHUB_REPOSITORY" --name "${!var}" --dir "source/waves/artifact-$i"
          done
          gh run download "$AUDIT_RUN" --repo "$GITHUB_REPOSITORY" --name "$AUDIT_NAME" --dir source/audit
          test "$(find source/waves -name traces.jsonl -type f | wc -l)" -eq 6
          test "$(find source/waves -path '*/snapshots/*.jsonl' -type f | wc -l)" -eq 90
          test "$(find source/manifest -name subject_manifest.jsonl -type f | wc -l)" -eq 1
          test "$(find source/audit -name localized_semantic_audit_records.jsonl -type f | wc -l)" -eq 1

      - name: Prepare exact six-case frozen-parent R5 plan
        run: |
          set -euo pipefail
          AUDIT_RECORDS="$(find source/audit -name localized_semantic_audit_records.jsonl -type f)"
          SOURCE_MANIFEST="$(find source/manifest -name subject_manifest.jsonl -type f)"
          python -m arena.prepare_v5_cross_domain_r5_first_wave \
            --audit-records "$AUDIT_RECORDS" \
            --source-manifest "$SOURCE_MANIFEST" \
            --source-root source/waves \
            --plan-config "$PLAN_CONFIG" \
            --branch-code-sha "$GITHUB_SHA" \
            --outdir prepared/r5_first_wave

      - name: Run exact offline R5 preflight before provider access
        run: |
          set -euo pipefail
          python -m arena.run_v5_cross_domain_r5_first_wave \
            --plan-dir prepared/r5_first_wave \
            --provider deepseek \
            --execution-code-sha "$GITHUB_SHA" \
            --per-branch-max-calls "$PER_BRANCH_MAX_CALLS" \
            --per-branch-spending-ceiling "$PER_BRANCH_CEILING_USD" \
            --global-spending-ceiling "$GLOBAL_CEILING_USD" \
            --currency USD \
            --preflight-only

      - name: Execute 24 frozen-parent R5 branches
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python -m arena.run_v5_cross_domain_r5_first_wave \
            --plan-dir prepared/r5_first_wave \
            --outdir results/v5_cross_domain_r5_first_wave/raw \
            --provider deepseek \
            --execution-code-sha "$GITHUB_SHA" \
            --per-branch-max-calls "$PER_BRANCH_MAX_CALLS" \
            --per-branch-spending-ceiling "$PER_BRANCH_CEILING_USD" \
            --global-spending-ceiling "$GLOBAL_CEILING_USD" \
            --currency USD \
            --authorization-phrase "$EXPECTED_AUTHORIZATION_PHRASE" \
            --execute-real-api

      - name: Freeze raw R5 evidence before any derived comparison
        if: always()
        run: |
          set -euo pipefail
          if [ -s results/v5_cross_domain_r5_first_wave/raw/traces.jsonl ]; then
            python -m arena.freeze_v5_cross_domain_r5_first_wave \
              --raw-dir results/v5_cross_domain_r5_first_wave/raw \
              --plan-dir prepared/r5_first_wave \
              --out results/v5_cross_domain_r5_first_wave/evidence_batch.json
          else
            echo 'No R5 traces available to freeze.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Derive structural local-response comparison only
        if: success()
        id: derive
        run: |
          set -euo pipefail
          python -m arena.derive_v5_cross_domain_r5_local_response \
            --traces results/v5_cross_domain_r5_first_wave/raw/traces.jsonl \
            --evidence-batch results/v5_cross_domain_r5_first_wave/evidence_batch.json \
            --outdir results/v5_cross_domain_r5_first_wave/local_response
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('results/v5_cross_domain_r5_first_wave/local_response/summary.json'))
          for k in (
              'pair_count','first_parsed_envelope_changed_pairs',
              'first_decision_summary_changed_pairs','agent_path_changed_pairs',
              'final_state_changed_pairs','summary_hash'
          ):
              print(k+'='+str(p[k]))
          PY

      - name: Upload immutable R5 first-wave evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-cross-domain-r5-first-wave-${{ github.run_id }}
          path: |
            configs/v5_cross_domain_r5_first_wave_v0.1.json
            prepared/r5_first_wave/
            results/v5_cross_domain_r5_first_wave/
          if-no-files-found: warn
          retention-days: 90

      - name: Record completed R5 first wave
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PAIR_COUNT: ${{ steps.derive.outputs.pair_count }}
          FIRST_ACTION_CHANGED: ${{ steps.derive.outputs.first_parsed_envelope_changed_pairs }}
          FIRST_DECISION_CHANGED: ${{ steps.derive.outputs.first_decision_summary_changed_pairs }}
          PATH_CHANGED: ${{ steps.derive.outputs.agent_path_changed_pairs }}
          FINAL_CHANGED: ${{ steps.derive.outputs.final_state_changed_pairs }}
          SUMMARY_HASH: ${{ steps.derive.outputs.summary_hash }}
        shell: bash
        run: |
          set -euo pipefail
          body="V5 cross-domain R5 first wave completed and raw evidence was frozen before derivation.\n\nGeometry: 6 source-bound cases / 12 matched pairs / 24 branches.\nOperator: one-shot fact -> unconfirmed on the first resumed Agent view only; no persistent mutation or reinjection.\nStructural pairs: $PAIR_COUNT.\nFirst parsed action changed: $FIRST_ACTION_CHANGED.\nFirst decision summary changed: $FIRST_DECISION_CHANGED.\nAgent path changed: $PATH_CHANGED.\nFinal state changed: $FINAL_CHANGED.\nDerived summary hash: $SUMMARY_HASH.\n\nPaid evaluator: 0. R6 semantic inertia remains NOT_ADJUDICATED. R7 not authorized. CPR NOT_ADJUDICATED."
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
