name: R6-D Matched Stock Robustness v0.1 Offline Validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/R6D_matched_stock_robustness_protocol_v0.1.md"
      - "configs/r6/r6d_matched_stock_robustness_candidate_audit_v0.1.json"
      - "configs/r6/r6d_matched_stock_robustness_plan_v0.1.json"
      - "configs/r6/r6d_matched_stock_robustness_formal_subject_gate_v0.1.json"
      - "configs/r6/r6d_s3_matched_stock_b_envelope_v0.1.json"
      - "configs/r6/r6d_s4_matched_stock_c_envelope_v0.1.json"
      - "manifests/r6d_matched_stock_robustness_design_freeze_2026-09-17_v0_1.json"
      - "scripts/validate_r6d_matched_stock_robustness_v0_1.py"
      - "scripts/validate_r6d_matched_stock_formal_gate_v0_1.py"
      - ".github/workflows/r6d-matched-stock-robustness-offline-validate.yml"

permissions:
  contents: read

jobs:
  matched-stock-design-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile matched-stock validators
        run: |
          python -m py_compile scripts/validate_r6d_matched_stock_robustness_v0_1.py
          python -m py_compile scripts/validate_r6d_matched_stock_formal_gate_v0_1.py

      - name: Validate matched-stock robustness design freeze
        run: python scripts/validate_r6d_matched_stock_robustness_v0_1.py

      - name: Validate fail-closed matched-stock formal subject gate
        run: python scripts/validate_r6d_matched_stock_formal_gate_v0_1.py

      - name: Re-check Process Reality v4.5.1 methodological gate
        run: python scripts/validate_process_reality_v4_5_1.py

      - name: Re-check predecessor exact R6-D design
        run: python scripts/validate_r6d_specificity_exact_plan_v0_1.py

      - name: Run full Arena offline tests
        run: python -m unittest discover arena/tests -v

      - name: Assert offline workflow has no provider credential or real-run capability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/r6d-matched-stock-robustness-offline-validate.yml').read_text(encoding='utf-8')
          forbidden=[
              'DEEPSEEK_' + 'API_KEY',
              'DASHSCOPE_' + 'API_KEY',
              'OPENAI_' + 'API_KEY',
              'secrets.' + 'BAI',
              'CALL_' + 'REAL_',
              '--execute-' + 'real',
          ]
          found=[x for x in forbidden if x in text]
          assert not found, 'forbidden real-call capability in offline workflow: '+repr(found)
          print('PASS: matched-stock robustness freeze/gate CI is provider-secret free and cannot execute a real subject')
          PY
