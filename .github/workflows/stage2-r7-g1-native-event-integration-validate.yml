name: Stage-II R7 G1 Native Event Integration Validate

on:
  pull_request:
    paths:
      - "configs/stage2_r7_g1_native_event_integration_freeze_v1.json"
      - "configs/stage2_r7_g1_parent_freeze_semantics_v1.json"
      - "schemas/stage2_r7_g1_run_manifest_v1.schema.json"
      - "stage2/r7_checkpoint_v1/controller.py"
      - "stage2/r7_prospective_v1/runtime_event_adapter.py"
      - "stage2/r7_prospective_v1/integration.py"
      - "stage2/r7_prospective_v1/run_manifest.py"
      - "stage2/r7_prospective_v1/native_event_integration_preflight.py"
      - "scripts/validate_stage2_r7_g1_native_event_integration_v1.py"
      - "docs/R_Plan_v7.42.md"
      - "docs/reports/2026-09-26/StageII_R7_G1_Native_Runtime_Event_Integration_Report_v1.md"
      - "theory/change_notes/CN-R-116_stage2_r7_g1_native_event_integration_freeze.md"
      - ".github/workflows/stage2-r7-g1-native-event-integration-validate.yml"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_stage2_r7_g1_native_event_integration_v1.py
