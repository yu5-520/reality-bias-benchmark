name: Stage-II G5 Engineering-B One-Shot Paired Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - "configs/stage2_g5_engineering_b_launch_v2.json"

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: stage2-g5-engineering-b-active-v1
  cancel-in-progress: false

env:
  GROUP_ID: G5
  AUTH_ISSUE: "326"
  B_CODE_SHA: c6be5dfc1ef83840251e9944f32424887fcd16f8
  SOURCE_A_EVIDENCE_SHA: 1409a07241ca8fc49485bd1c805e040d01ad6444
  SOURCE_A_SCIENCE_SHA: b4f1441a48b2bc6a2c61035311419fc4509e8913
  INPUT_CLAIM_SHA: 61a50470a89c1fe6b21e80f68d18074f6d24c231
  EVIDENCE_BRANCH: stage2-g5-engineering-b-evidence-v1
  B_EVIDENCE_ROOT: stage2/replication_v2/G5/engineering_B_v1

jobs:
  claim-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      execution_claim_sha: ${{ steps.claim.outputs.execution_claim_sha }}
    steps:
      - name: Checkout exact irreversible group claim
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INPUT_CLAIM_SHA }}
          path: evidence
          fetch-depth: 0

      - name: Atomically claim G5 execution window before any provider call
        id: claim
        env:
          LAUNCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C evidence rev-parse HEAD)" = "$INPUT_CLAIM_SHA"
          REMOTE="$(git -C evidence ls-remote origin "refs/heads/$EVIDENCE_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$INPUT_CLAIM_SHA"
          CLAIM_PATH="evidence/$B_EVIDENCE_ROOT/control/execution_claim.json"
          test ! -e "$CLAIM_PATH"
          export CLAIM_PATH LAUNCH_HEAD_SHA RUN_ATTEMPT
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected=[
              "X2-T1","X2-T2","X2-T3",
              "X4-T1","X4-T3",
              "X5-T1","X5-T2","X5-T3",
              "X7-T1","X7-T2","X7-T3",
          ]
          claim={
              "schema":"stage2-engineering-b-run-execution-claim-v1",
              "state":"ATOMICALLY_CLAIMED_BEFORE_ANY_PROVIDER_CALL",
              "group_id":"G5",
              "phase":"ENGINEERING_B_ONE_SHOT_PAIRED_REPAIR_V1",
              "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt":int(os.environ["RUN_ATTEMPT"]),
              "launch_head_sha":os.environ["LAUNCH_HEAD_SHA"],
              "input_group_claim_sha":os.environ["INPUT_CLAIM_SHA"],
              "claimed_cells":expected,
              "attempt_index_by_cell":1,
              "created_before_provider_calls":True,
              "receipt_absence_is_not_authorization":True,
              "automatic_retry":False,
              "provider_calls_before_claim":0,
          }
          p=Path(os.environ["CLAIM_PATH"])
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(claim,indent=2,sort_keys=True)+"\n")
          PY
          git -C evidence config user.name "stage2-g5-engineering-b-execution-claim"
          git -C evidence config user.email "stage2-g5-engineering-b-execution-claim@users.noreply.github.com"
          git -C evidence add "$B_EVIDENCE_ROOT/control/execution_claim.json"
          git -C evidence commit -m "control: atomically claim G5 Engineering-B execution [run $GITHUB_RUN_ID attempt $RUN_ATTEMPT]"
          git -C evidence push origin "HEAD:$EVIDENCE_BRANCH"
          SHA="$(git -C evidence rev-parse HEAD)"
          echo "execution_claim_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "PASS: G5 execution window atomically claimed at $SHA before provider calls"

  paired-b:
    needs: claim-run
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {system: X2, task: T1, python: "3.10", source_run: "36251144204"}
          - {system: X2, task: T2, python: "3.10", source_run: "36251144204"}
          - {system: X2, task: T3, python: "3.10", source_run: "36251144204"}
          - {system: X4, task: T1, python: "3.11", source_run: "36251144204"}
          - {system: X4, task: T3, python: "3.11", source_run: "36251144204"}
          - {system: X5, task: T1, python: "3.11", source_run: "36251144204"}
          - {system: X5, task: T2, python: "3.11", source_run: "36251144204"}
          - {system: X5, task: T3, python: "3.11", source_run: "36251144204"}
          - {system: X7, task: T1, python: "3.11", source_run: "36251144204"}
          - {system: X7, task: T2, python: "3.11", source_run: "36251144204"}
          - {system: X7, task: T3, python: "3.11", source_run: "36251144204"}

    steps:
      - name: Checkout exact active authorization
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: auth
          fetch-depth: 1

      - name: Checkout exact frozen B control
        uses: actions/checkout@v4
        with:
          ref: ${{ env.B_CODE_SHA }}
          path: control
          fetch-depth: 1

      - name: Checkout exact frozen G5 Natural-A evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_A_EVIDENCE_SHA }}
          path: a-evidence
          fetch-depth: 1

      - name: Checkout exact irreversible group claim
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INPUT_CLAIM_SHA }}
          path: evidence-claim
          fetch-depth: 1

      - name: Checkout exact atomic run execution claim
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.claim-run.outputs.execution_claim_sha }}
          path: execution-claim
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify active authorization, claim and exact frozen selection
        env:
          GH_TOKEN: ${{ github.token }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
          SOURCE_A_WORKFLOW_RUN: ${{ matrix.source_run }}
          EXECUTION_CLAIM_SHA: ${{ needs.claim-run.outputs.execution_claim_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$B_CODE_SHA"
          test "$(git -C a-evidence rev-parse HEAD)" = "$SOURCE_A_EVIDENCE_SHA"
          test "$(git -C evidence-claim rev-parse HEAD)" = "$INPUT_CLAIM_SHA"
          test "$(git -C execution-claim rev-parse HEAD)" = "$EXECUTION_CLAIM_SHA"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          cell=f'{os.environ["SYS"]}-{os.environ["TASK"]}'
          expected=[
              "X2-T1","X2-T2","X2-T3",
              "X4-T1","X4-T3",
              "X5-T1","X5-T2","X5-T3",
              "X7-T1","X7-T2","X7-T3",
          ]
          cfg=json.loads(Path("auth/configs/stage2_g5_engineering_b_active_authorization_v1.json").read_text())
          assert cfg["status"]=="AUTHORIZED_AFTER_11_PASS_PLUS_1_SOURCE_BOUNDARY_ZERO_CALL_PREFLIGHT"
          assert cfg["authorization_issue"]==326
          assert cfg["group_id"]=="G5"
          assert cfg["control_main_sha"]==os.environ["B_CODE_SHA"]
          assert cfg["zero_call_preflight_run"]==36312043862
          assert cfg["zero_call_preflight_result"]=="PASS_11_OF_12_PLUS_X4_T2_SOURCE_BOUNDARY"
          assert cfg["source_A"]["evidence_sha"]==os.environ["SOURCE_A_EVIDENCE_SHA"]
          assert cfg["source_A"]["scientific_code_sha"]==os.environ["SOURCE_A_SCIENCE_SHA"]
          assert int(os.environ["SOURCE_A_WORKFLOW_RUN"]) in cfg["source_A"]["workflow_runs"]
          assert cfg["source_A"]["cell_workflow_run"][cell]==int(os.environ["SOURCE_A_WORKFLOW_RUN"])
          assert cfg["eligibility"]["cells"]==expected
          assert cell in expected
          assert cfg["evidence"]["claim_commit"]==os.environ["INPUT_CLAIM_SHA"]
          assert cfg["evidence"]["branch"]==os.environ["EVIDENCE_BRANCH"]
          assert cfg["execution"]["one_B_per_cell"] is True
          assert cfg["execution"]["first_B_stochastic_attempt_only"] is True
          assert cfg["execution"]["best_of_N"] is False
          assert cfg["execution"]["automatic_retry"] is False
          assert cfg["execution"]["repair_agent_calls_per_cell"]==1
          assert cfg["execution"]["repair_agent_retries"]==0
          assert cfg["execution"]["post_repair_monitor_mode"]=="WATCH_ONLY"
          assert cfg["execution"]["post_repair_additional_repair_packages"]==0
          assert cfg["independence"]["natural_A_reruns"]==0
          assert cfg["independence"]["paid_evaluator_calls"]==0
          assert cfg["authorization"]["active_B"] is True
          assert cfg["authorization"]["terminal_group"] is True

          claim=json.loads(Path("evidence-claim/stage2/replication_v2/G5/engineering_B_v1/control/group_claim.json").read_text())
          execution_claim=json.loads(Path("execution-claim/stage2/replication_v2/G5/engineering_B_v1/control/execution_claim.json").read_text())
          assert execution_claim["schema"]=="stage2-engineering-b-run-execution-claim-v1"
          assert execution_claim["state"]=="ATOMICALLY_CLAIMED_BEFORE_ANY_PROVIDER_CALL"
          assert execution_claim["group_id"]=="G5"
          assert execution_claim["workflow_run_id"]==int(os.environ["GITHUB_RUN_ID"])
          assert execution_claim["workflow_run_attempt"]==int(os.environ["RUN_ATTEMPT"])
          assert execution_claim["input_group_claim_sha"]==os.environ["INPUT_CLAIM_SHA"]
          assert execution_claim["claimed_cells"]==expected
          assert execution_claim["attempt_index_by_cell"]==1
          assert execution_claim["created_before_provider_calls"] is True
          assert execution_claim["receipt_absence_is_not_authorization"] is True
          assert cell in execution_claim["claimed_cells"]
          assert claim["state"]=="IRREVERSIBLY_CLAIMED_BEFORE_ANY_B_PROVIDER_CALL"
          assert claim["authorization_issue"]==326
          assert claim["group_id"]=="G5"
          assert claim["control_main_sha"]==os.environ["B_CODE_SHA"]
          assert claim["preflight_run"]==36312043862
          assert claim["claimed_cells"]==expected
          assert claim["attempt_index_by_cell"]==1
          assert claim["preclaim_total_B_provider_calls"]==0
          assert claim["preclaim_B_stochastic_attempts_consumed"]==0
          assert claim["no_automatic_retry"] is True
          assert claim["source_A_cell_workflow_run"][cell]==int(os.environ["SOURCE_A_WORKFLOW_RUN"])

          idx=json.loads(Path("control/stage2/replication_v2/engineering_eligibility_84_v1/G5_b_selection_index.json").read_text())
          assert idx["state"]=="FROZEN_ELIGIBILITY_NOT_B_AUTHORIZATION"
          assert idx["group_id"]=="G5"
          assert idx["eligible_cell_count"]==12
          assert cfg["eligibility"]["structural_eligible_cell_count"]==12
          assert cfg["eligibility"]["preflight_boundary_cells"]==["X4-T2"]
          assert "X4-T2" not in expected
          row=next(r for r in idx["cells"] if r["cell_id"]==cell)
          assert row["B_authorized"] is False
          binding=next(r for r in claim["selection_bindings"] if r["cell_id"]==cell)
          assert binding["package_id"]==row["selected_package_id"]
          assert binding["package_hash"]==row["selected_package_hash"]
          assert binding["parent_checkpoint_hash"]==row["selected_parent_checkpoint_hash"]
          assert binding["repair_anchor_ref"]==row["selected_repair_anchor_ref"]

          issue=json.loads(subprocess.check_output([
              "gh","api",f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/312'
          ],text=True))
          assert issue["user"]["login"]=="yu5-520"
          assert issue["state"]=="open"
          assert issue["title"]=="STAGE2 G5 ENGINEERING B 11-CELL ONE-SHOT AUTHORIZATION"
          body=issue["body"]
          for needle in [
              "group=StageII-R7-G5",
              "phase=ENGINEERING_B_ONE_SHOT_PAIRED_REPAIR_V1",
              "cells="+",".join(expected),
              "one_B_per_cell=true",
              "first_B_stochastic_attempt_only=true",
              "automatic_retry=false",
              "post_repair_monitor_mode=WATCH_ONLY",
              "natural_A_reruns=0",
              "max_total_B_provider_calls=675",
          ]:
              assert needle in body
          print("PASS: exact G5 active-B authorization and irreversible 12-cell claim")
          PY

      - name: Bind exact X2 MetaGPT environment
        if: matrix.system == 'X2'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/FoundationAgents/MetaGPT /tmp/stage2-x2-metagpt
          git -C /tmp/stage2-x2-metagpt checkout -q 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          test "$(git -C /tmp/stage2-x2-metagpt rev-parse HEAD)" = 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          python -m pip install -q --upgrade pip
          grep -v '^lancedb==0.4.0$' /tmp/stage2-x2-metagpt/requirements.txt > /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q -r /tmp/stage2-metagpt-requirements.txt
          python -m pip install -q 'pyarrow==14.0.2'
          python -m pip install -q --no-deps -e /tmp/stage2-x2-metagpt

      - name: Bind exact X4 MCP environment
        if: matrix.system == 'X4'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk /tmp/stage2-x4-mcp
          git -C /tmp/stage2-x4-mcp checkout -q f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol /tmp/stage2-x4-protocol
          git -C /tmp/stage2-x4-protocol checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          test "$(git -C /tmp/stage2-x4-mcp rev-parse HEAD)" = f1b6589088534632fef92238ee9750951e3c0185
          test "$(git -C /tmp/stage2-x4-protocol rev-parse HEAD)" = 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          (cd /tmp/stage2-x4-mcp && uv sync --frozen --no-default-groups)
          test -x /tmp/stage2-x4-mcp/.venv/bin/python

      - name: Bind exact X7 LongLLMLingua environment and study checkpoint
        if: matrix.system == 'X7'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/microsoft/LLMLingua /tmp/stage2-x7-longllmlingua
          git -C /tmp/stage2-x7-longllmlingua checkout -q 5a4c78ae18ab17a98cf997e8259354e546081d64
          test "$(git -C /tmp/stage2-x7-longllmlingua rev-parse HEAD)" = 5a4c78ae18ab17a98cf997e8259354e546081d64
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' 'accelerate>=0.33,<1' tiktoken nltk numpy tokenizers safetensors
          python -m pip install -q --no-deps -e /tmp/stage2-x7-longllmlingua
          rm -rf /tmp/stage2-x7-study
          (cd control && python -m stage2.study_assets.validate --probe X7 --out-root /tmp/stage2-x7-study)

      - name: Verify provider credential and execution-claim ownership
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
          EXECUTION_CLAIM_SHA: ${{ needs.claim-run.outputs.execution_claim_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY"
          CELL="$SYS-$TASK"
          REMOTE="$(git -C execution-claim ls-remote origin "refs/heads/$EVIDENCE_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$EXECUTION_CLAIM_SHA"
          export CELL
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("execution-claim/stage2/replication_v2/G5/engineering_B_v1/control/execution_claim.json")
          c=json.loads(p.read_text())
          assert c["workflow_run_id"]==int(os.environ["GITHUB_RUN_ID"])
          assert c["created_before_provider_calls"] is True
          assert c["receipt_absence_is_not_authorization"] is True
          assert os.environ["CELL"] in c["claimed_cells"]
          PY
          PATH_ON_BRANCH="$B_EVIDENCE_ROOT/cells/$CELL/attempt_receipt.json"
          if gh api "repos/$GITHUB_REPOSITORY/contents/$PATH_ON_BRANCH?ref=$EVIDENCE_BRANCH" >/dev/null 2>&1; then
            echo "FAIL: frozen receipt already exists for $CELL; execution claim does not authorize a second attempt"
            exit 42
          fi
          echo "PASS: credential present and this workflow owns the atomic G5 execution claim for $CELL"

      - name: Execute exactly one provider-backed G5 Engineering-B attempt
        id: execute
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
          SOURCE_A_WORKFLOW_RUN: ${{ matrix.source_run }}
        shell: bash
        run: |
          set -uo pipefail
          CELL="$SYS-$TASK"
          OUT="/tmp/stage2-g5-b-run/$CELL"
          LOG_ROOT="/tmp/stage2-g5-b-control/$CELL"
          rm -rf "$OUT" "$LOG_ROOT"
          mkdir -p "$LOG_ROOT"
          printf '%s\n' "$B_CODE_SHA" > "$LOG_ROOT/b_code_sha.txt"
          printf '%s\n' "$INPUT_CLAIM_SHA" > "$LOG_ROOT/input_claim_sha.txt"
          printf '%s\n' "$AUTH_ISSUE" > "$LOG_ROOT/authorization_issue.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$LOG_ROOT/workflow_run_id.txt"
          printf '%s\n' "$CELL" > "$LOG_ROOT/cell_id.txt"
          export PYTHONPATH="$GITHUB_WORKSPACE/control${PYTHONPATH:+:$PYTHONPATH}"
          export TOKENIZERS_PARALLELISM=false
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          PYBIN=python
          if [ "$SYS" = X4 ]; then PYBIN=/tmp/stage2-x4-mcp/.venv/bin/python; fi
          EXTRA=()
          if [ "$SYS" = X7 ]; then
            EXTRA+=(--x7-checkpoint /tmp/stage2-x7-study/checkpoint)
            EXTRA+=(--x7-checkpoint-manifest "$GITHUB_WORKSPACE/control/stage2/native_v7/study/x7_checkpoint_manifest.json")
          fi
          set +e
          "$PYBIN" -m stage2.r7_prospective_v1.engineering_b_runner \
            --cell "$CELL" \
            --group-id G5 \
            --a-archive "$GITHUB_WORKSPACE/a-evidence/stage2/replication_v2/G5/natural_A/$CELL/first_attempt.tar.gz" \
            --selection-index "$GITHUB_WORKSPACE/control/stage2/replication_v2/engineering_eligibility_84_v1/G5_b_selection_index.json" \
            --source-a-science-sha "$SOURCE_A_SCIENCE_SHA" \
            --source-a-workflow-run "$SOURCE_A_WORKFLOW_RUN" \
            --out-root "$OUT" \
            "${EXTRA[@]}" \
            > "$LOG_ROOT/runner_stdout.txt" 2> "$LOG_ROOT/runner_stderr.txt"
          CODE=$?
          set -e
          printf '%s\n' "$CODE" > "$LOG_ROOT/runner_exit_code.txt"
          echo "runner_exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Scientific first attempt consumed for $CELL; exit=$CODE. No retry will be issued."

      - name: Package immutable first G5 B attempt
        if: always()
        env:
          SYS: ${{ matrix.system }}
          TASK: ${{ matrix.task }}
          SOURCE_A_WORKFLOW_RUN: ${{ matrix.source_run }}
          RUNNER_EXIT_CODE: ${{ steps.execute.outputs.runner_exit_code }}
          EXECUTION_CLAIM_SHA: ${{ needs.claim-run.outputs.execution_claim_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CELL="$SYS-$TASK"
          OUT="/tmp/stage2-g5-b-run/$CELL"
          LOG_ROOT="/tmp/stage2-g5-b-control/$CELL"
          mkdir -p "$OUT/control"
          if [ -d "$LOG_ROOT" ]; then cp -a "$LOG_ROOT"/. "$OUT/control"/; fi
          export OUT CELL RUNNER_EXIT_CODE
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ["OUT"])
          seal_path=out/"seal.json"
          seal=json.loads(seal_path.read_text()) if seal_path.is_file() else None
          meta={
              "schema":"stage2-g5-engineering-b-first-attempt-metadata-v1",
              "group_id":"G5",
              "phase":"ENGINEERING_B_ONE_SHOT_PAIRED_REPAIR_V1",
              "cell_id":os.environ["CELL"],
              "attempt_index":1,
              "authorization_issue":326,
              "b_code_sha":os.environ["B_CODE_SHA"],
              "source_A_evidence_sha":os.environ["SOURCE_A_EVIDENCE_SHA"],
              "source_A_workflow_run":int(os.environ["SOURCE_A_WORKFLOW_RUN"]),
              "input_claim_sha":os.environ["INPUT_CLAIM_SHA"],
              "execution_claim_sha":os.environ.get("EXECUTION_CLAIM_SHA"),
              "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "runner_exit_code":int(os.environ.get("RUNNER_EXIT_CODE") or -999),
              "seal_present":seal is not None,
              "seal_status":seal.get("status") if seal else None,
              "package_id":seal.get("package_id") if seal else None,
              "parent_checkpoint_hash":seal.get("parent_checkpoint_hash") if seal else None,
              "repair_action_count":seal.get("repair_action_count") if seal else None,
              "repair_agent_calls":seal.get("repair_agent_calls") if seal else None,
              "subject_continuation_calls":seal.get("subject_continuation_calls") if seal else None,
              "total_B_provider_calls":seal.get("total_B_provider_calls") if seal else None,
              "same_parent_checkpoint":seal.get("same_parent_checkpoint") if seal else None,
              "repair_executor_exited":seal.get("repair_executor_exited") if seal else None,
              "post_repair_monitor_mode":seal.get("post_repair_monitor_mode") if seal else None,
              "post_repair_repair_packages":seal.get("post_repair_repair_packages") if seal else None,
              "semantic_audit_used":False,
              "cpr_labels_used":False,
              "preserved_failed_attempt":True,
              "repair_request_present":(out/"repair_request.json").is_file(),
              "repair_response_present":(out/"repair_response.json").is_file(),
          }
          (out/"control"/"attempt_metadata.json").write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
          PY
          ART="/tmp/stage2-g5-b-artifact/$CELL"
          mkdir -p "$ART"
          ARCHIVE="$ART/first_B_attempt.tar.gz"
          tar -czf "$ARCHIVE" -C "$OUT" .
          sha256sum "$ARCHIVE" > "$ART/first_B_attempt.tar.gz.sha256"
          export ART ARCHIVE
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          art=Path(os.environ["ART"])
          archive=Path(os.environ["ARCHIVE"])
          meta=json.loads((Path(os.environ["OUT"])/"control"/"attempt_metadata.json").read_text())
          receipt=dict(meta)
          receipt.update({
              "schema":"stage2-g5-engineering-b-first-attempt-receipt-v1",
              "archive_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
              "archive_bytes":archive.stat().st_size,
              "preserved":True,
              "scientific_success_not_inferred":True,
              "no_automatic_retry":True,
          })
          (art/"attempt_receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY
          echo "PASS: immutable first G5 B attempt packaged for $CELL; no retry"

      - name: Upload immutable G5 B cell artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-g5-b-${{ matrix.system }}-${{ matrix.task }}-${{ github.run_id }}
          path: /tmp/stage2-g5-b-artifact/
          retention-days: 90
          if-no-files-found: error

  freeze:
    needs: [claim-run, paired-b]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact atomic execution-claim state
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.claim-run.outputs.execution_claim_sha }}
          path: evidence
          fetch-depth: 0

      - name: Verify evidence branch remains at this run's execution claim
        env:
          EXECUTION_CLAIM_SHA: ${{ needs.claim-run.outputs.execution_claim_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C evidence rev-parse HEAD)" = "$EXECUTION_CLAIM_SHA"
          REMOTE="$(git -C evidence ls-remote origin "refs/heads/$EVIDENCE_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$EXECUTION_CLAIM_SHA"
          test ! -e "evidence/$B_EVIDENCE_ROOT/group_index.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          c=json.loads(Path("evidence/stage2/replication_v2/G5/engineering_B_v1/control/execution_claim.json").read_text())
          assert c["workflow_run_id"]==int(os.environ["GITHUB_RUN_ID"])
          assert c["workflow_run_attempt"]==int(os.environ["RUN_ATTEMPT"])
          assert c["input_group_claim_sha"]==os.environ["INPUT_CLAIM_SHA"]
          assert c["created_before_provider_calls"] is True
          PY
          echo "PASS: evidence branch remains exactly at this run's pre-provider execution claim"

      - name: Download all 12 first-attempt artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: stage2-g5-b-*-${{ github.run_id }}
          path: /tmp/stage2-g5-b-source
          merge-multiple: true

      - name: Validate and freeze all first attempts without rerun
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          export ROOT="$GITHUB_WORKSPACE/evidence"
          export DL="/tmp/stage2-g5-b-source"
          python - <<'PY'
          import hashlib,json,os,shutil,tarfile,tempfile
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          dl=Path(os.environ["DL"])
          expected=[
              "X2-T1","X2-T2","X2-T3",
              "X4-T1","X4-T3",
              "X5-T1","X5-T2","X5-T3",
              "X7-T1","X7-T2","X7-T3",
          ]
          claim=json.loads((root/"stage2/replication_v2/G5/engineering_B_v1/control/group_claim.json").read_text())
          assert claim["state"]=="IRREVERSIBLY_CLAIMED_BEFORE_ANY_B_PROVIDER_CALL"
          assert claim["claimed_cells"]==expected
          execution_claim=json.loads((root/"stage2/replication_v2/G5/engineering_B_v1/control/execution_claim.json").read_text())
          assert execution_claim["state"]=="ATOMICALLY_CLAIMED_BEFORE_ANY_PROVIDER_CALL"
          assert execution_claim["workflow_run_id"]==int(os.environ["GITHUB_RUN_ID"])
          assert execution_claim["input_group_claim_sha"]==os.environ["INPUT_CLAIM_SHA"]
          assert execution_claim["claimed_cells"]==expected
          receipts=[]
          success=[]
          failed=[]
          known_calls=0
          for cell in expected:
              src=dl/cell
              rp=src/"attempt_receipt.json"
              arc=src/"first_B_attempt.tar.gz"
              shp=src/"first_B_attempt.tar.gz.sha256"
              assert rp.is_file(), f"{cell}: missing receipt"
              assert arc.is_file(), f"{cell}: missing archive"
              assert shp.is_file(), f"{cell}: missing sha"
              r=json.loads(rp.read_text())
              assert r["schema"]=="stage2-g5-engineering-b-first-attempt-receipt-v1"
              assert r["group_id"]=="G5"
              assert r["cell_id"]==cell
              assert r["attempt_index"]==1
              assert r["authorization_issue"]==326
              assert r["b_code_sha"]==os.environ["B_CODE_SHA"]
              assert r["source_A_evidence_sha"]==os.environ["SOURCE_A_EVIDENCE_SHA"]
              assert r["source_A_workflow_run"]==int(claim["source_A_cell_workflow_run"][cell])
              assert r["input_claim_sha"]==os.environ["INPUT_CLAIM_SHA"]
              assert r["workflow_run_id"]==int(os.environ["GITHUB_RUN_ID"])
              assert r["preserved"] is True
              assert r["scientific_success_not_inferred"] is True
              assert r["no_automatic_retry"] is True
              observed=hashlib.sha256(arc.read_bytes()).hexdigest()
              assert observed==r["archive_sha256"]
              assert shp.read_text().split()[0]==observed

              if r["runner_exit_code"]==0:
                  assert r["seal_present"] is True
                  assert r["seal_status"]=="REPAIR_B_FROZEN"
                  assert r["repair_action_count"]==1
                  assert r["repair_agent_calls"]==1
                  assert r["same_parent_checkpoint"] is True
                  assert r["repair_executor_exited"] is True
                  assert r["post_repair_monitor_mode"]=="WATCH_ONLY"
                  assert r["post_repair_repair_packages"]==0
                  with tempfile.TemporaryDirectory() as td:
                      t=Path(td)
                      with tarfile.open(arc,"r:gz") as tf:
                          tf.extractall(t)
                      seal=json.loads((t/"seal.json").read_text())
                      assert seal["schema"]=="stage2-engineering-paired-repair-b-seal-v1"
                      assert seal["status"]=="REPAIR_B_FROZEN"
                      assert seal["group_id"]=="G5"
                      assert seal["cell_id"]==cell
                      assert seal["source_A_workflow_run"]==int(claim["source_A_cell_workflow_run"][cell])
                      assert seal["source_A_science_sha"]==os.environ["SOURCE_A_SCIENCE_SHA"]
                      assert seal["repair_action_count"]==1
                      assert seal["repair_agent_calls"]==1
                      assert seal["same_parent_checkpoint"] is True
                      assert seal["semantic_audit_used"] is False
                      assert seal["cpr_labels_used"] is False
                      assert seal["repair_executor_exited"] is True
                      assert seal["post_repair_monitor_mode"]=="WATCH_ONLY"
                      assert seal["post_repair_repair_packages"]==0
                  success.append(cell)
                  known_calls += int(r["total_B_provider_calls"])
              else:
                  failed.append(cell)

              dest=root/os.environ["B_EVIDENCE_ROOT"]/"cells"/cell
              assert not dest.exists(), f"{cell}: evidence already exists"
              dest.mkdir(parents=True)
              shutil.copy2(arc,dest/"first_B_attempt.tar.gz")
              shutil.copy2(shp,dest/"first_B_attempt.tar.gz.sha256")
              shutil.copy2(rp,dest/"attempt_receipt.json")
              receipts.append(r)

          assert len(receipts)==11
          group={
              "schema":"stage2-g5-engineering-b-group-index-v1",
              "state":"FROZEN_FIRST_B_ATTEMPTS",
              "group_id":"G5",
              "phase":"ENGINEERING_B_ONE_SHOT_PAIRED_REPAIR_V1",
              "authorization_issue":326,
              "source_workflow_run":int(os.environ["GITHUB_RUN_ID"]),
              "b_code_sha":os.environ["B_CODE_SHA"],
              "source_A_evidence_sha":os.environ["SOURCE_A_EVIDENCE_SHA"],
              "source_A_workflow_runs":claim["source_A_workflow_runs"],
              "source_A_cell_workflow_run":claim["source_A_cell_workflow_run"],
              "input_claim_sha":os.environ["INPUT_CLAIM_SHA"],
              "execution_claim_sha":execution_claim.get("launch_head_sha") and os.popen("git -C "+str(root)+" rev-parse HEAD").read().strip(),
              "execution_claim_workflow_run":execution_claim["workflow_run_id"],
              "execution_claim_required":True,
              "receipt_absence_is_authorization":False,
              "expected_cells":expected,
              "preserved_cells":expected,
              "preserved_count":11,
              "successful_B_cells":success,
              "successful_B_count":len(success),
              "failed_B_cells":failed,
              "failed_B_count":len(failed),
              "one_B_per_cell":True,
              "automatic_retries":0,
              "known_successful_total_B_provider_calls":known_calls,
              "provider_call_accounting_complete":len(failed)==0,
              "repair_executor_exit_required":True,
              "post_repair_monitor_mode":"WATCH_ONLY",
              "semantic_audit_execution":"NOT_EXECUTED",
              "semantic_audit_gate":"OPEN_AFTER_ALL_B_FROZEN",
              "paid_evaluator_calls":0,
              "natural_A_reruns":0,
              "blocked_or_no_package_B_calls":0,
              "preflight_boundary_cells":["X4-T2"],
              "preflight_boundary_count":1,
              "preflight_boundary_role":"ACTIVE_B_EXECUTION_READINESS_BOUNDARY_NOT_B_EFFECT_SAMPLE",
              "structural_eligibility_count":12,
              "active_B_attempted_cell_count":11,
              "receipts":receipts,
          }
          gp=root/os.environ["B_EVIDENCE_ROOT"]/"group_index.json"
          gp.write_text(json.dumps(group,indent=2,sort_keys=True)+"\n")
          seal={
              "schema":"stage2-g5-engineering-b-group-seal-v1",
              "state":"SEALED_FIRST_B_ATTEMPTS",
              "group_id":"G5",
              "preserved_count":11,
              "successful_B_count":len(success),
              "failed_B_count":len(failed),
              "preflight_boundary_cells":["X4-T2"],
              "preflight_boundary_count":1,
              "B_reruns":0,
              "natural_A_reruns":0,
              "semantic_audit_used_during_B":False,
              "paid_evaluator_calls":0,
              "next_gate":"G5_PAIRED_PROCESS_SEMANTIC_AUDIT",
              "group_index_sha256":hashlib.sha256(gp.read_bytes()).hexdigest(),
          }
          (root/os.environ["B_EVIDENCE_ROOT"]/"group_seal.json").write_text(json.dumps(seal,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"preserved":11,"successful":len(success),"failed":len(failed),"known_successful_total_B_provider_calls":known_calls},sort_keys=True))
          PY

          git -C evidence config user.name "stage2-g5-engineering-b-evidence"
          git -C evidence config user.email "stage2-g5-engineering-b-evidence@users.noreply.github.com"
          git -C evidence add "$B_EVIDENCE_ROOT"
          git -C evidence diff --cached --quiet && { echo "FAIL: no G5 B freeze output"; exit 50; }
          git -C evidence commit -m "evidence: freeze G5 12-cell first Engineering-B attempts [run $GITHUB_RUN_ID]"
          git -C evidence push origin "HEAD:$EVIDENCE_BRANCH"
          echo "frozen=true" >> "$GITHUB_OUTPUT"

      - name: Report G5 B freeze to authorization issue
        if: steps.freeze.outputs.frozen == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY="$(python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path("evidence/stage2/replication_v2/G5/engineering_B_v1/group_index.json").read_text())
          print(
              f"G5 Engineering-B first attempts frozen: preserved={g['preserved_count']}/11, "
              f"successful={g['successful_B_count']}, failed={g['failed_B_count']}, "
              f"B reruns=0, Natural-A reruns=0, blocked/no-package B calls=0. "
              f"Source workflow={g['source_workflow_run']}. "
              f"Paired semantic-audit gate is now {g['semantic_audit_gate']}."
          )
          PY
          )"
          gh issue comment "$AUTH_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$SUMMARY"
