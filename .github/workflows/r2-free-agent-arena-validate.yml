name: R2 Free-Agent Arena Offline Validation

on:
  push:
    branches: [main]
    paths:
      - 'arena/**'
      - 'configs/**'
      - 'schemas/**'
      - '.github/workflows/r234-structural-smoke.yml'
      - '.github/workflows/r5r6-baseline-snapshot-real.yml'
      - '.github/workflows/r5r6-frozen-parent-branch-real.yml'
      - 'docs/R2_free_agent_arena_design.md'
      - 'docs/experimental_control_layer_v0.1.md'
      - 'docs/experimental_control_layer_v0.2.md'
      - 'docs/R5_R6_branch_intervention_recovery_protocol_v0.1.md'
      - 'docs/R5_R6_branch_intervention_recovery_protocol_v0.2.md'
      - 'docs/R5_R6_branch_intervention_recovery_protocol_v0.3.md'
      - 'docs/R5_R6_branch_intervention_recovery_protocol_v0.4.md'
      - 'docs/R5_R6_real_run_freeze_template_v0.1.md'
      - 'docs/R5_R6_real_run_freeze_template_v0.2.md'
      - 'docs/R5_R6_v4_research_binding_v0.1.md'
      - 'docs/R7_orchestration_protocol_v0.1.md'
      - 'docs/R7_real_run_freeze_template_v0.1.md'
      - 'docs/trajectory_dynamics_measurement_plan_v3.md'
      - 'docs/system_behavior_measurement_plan_v4.md'
      - 'docs/first_paper_v4_scope.md'
      - 'docs/v4_open_implementation_items.md'
      - 'docs/v4_next_safe_step.md'
      - 'docs/R_Plan_v4.0.md'
      - 'theory/theory_contract_v0.4.md'
      - 'theory/change_notes/**'
      - '.github/workflows/r2-free-agent-arena-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile arena/*.py
      - name: Validate current v0.3.2 domain environment and prompt isolation
        run: python arena/validate_environment.py
      - name: Run engineering-only scripted v0.3.2 preflight
        run: python arena/preflight.py
      - name: Validate state, evidence, control-layer and legacy regression cases
        run: python -m unittest discover -s arena/tests -v
      - name: Validate System Behavior v4 registries and deterministic preflight
        run: |
          python -m arena.system_behavior_preflight --outdir results/system_behavior_preflight
          test -s results/system_behavior_preflight/behavior_events.jsonl
          test -s results/system_behavior_preflight/system_trajectory_measurement_v4.json
          test -s results/system_behavior_preflight/SUMMARY.txt
          grep -q '^SYSTEM_BEHAVIOR_PREFLIGHT=PASS$' results/system_behavior_preflight/SUMMARY.txt
          grep -q '^SCIENTIFIC_EVIDENCE=NO$' results/system_behavior_preflight/SUMMARY.txt
      - name: Adapt a real Arena v0.3 scripted trace into Behavior Event v0.1
        run: |
          python -m arena.system_behavior_trace_preflight --outdir results/system_behavior_trace_preflight
          test -s results/system_behavior_trace_preflight/source_trace.json
          test -s results/system_behavior_trace_preflight/behavior_events_v0.1.jsonl
          test -s results/system_behavior_trace_preflight/adapter_summary.json
          test -s results/system_behavior_trace_preflight/system_trajectory_measurement_v4.json
          test -s results/system_behavior_trace_preflight/SUMMARY.txt
          grep -q '^SYSTEM_BEHAVIOR_TRACE_ADAPTER_PREFLIGHT=PASS$' results/system_behavior_trace_preflight/SUMMARY.txt
          grep -q '^SOURCE_TRACE_SCHEMA=R2-ARENA-TRACE-v0.3$' results/system_behavior_trace_preflight/SUMMARY.txt
          grep -q '^SCIENTIFIC_EVIDENCE=NO$' results/system_behavior_trace_preflight/SUMMARY.txt
          grep -q '^JUMP_DETECTOR=NOT_RUN_DETECTOR_NOT_FROZEN$' results/system_behavior_trace_preflight/SUMMARY.txt
      - name: Detect v4 structural Jump candidates and operational crossings
        run: |
          python -m arena.system_behavior_dynamics_preflight --outdir results/system_behavior_dynamics_preflight
          test -s results/system_behavior_dynamics_preflight/source_trace.json
          test -s results/system_behavior_dynamics_preflight/behavior_events_v0.1.jsonl
          test -s results/system_behavior_dynamics_preflight/structural_jump_candidates_v0.1.jsonl
          test -s results/system_behavior_dynamics_preflight/operational_boundary_crossings_v0.1.jsonl
          test -s results/system_behavior_dynamics_preflight/system_trajectory_measurement_v4.json
          test -s results/system_behavior_dynamics_preflight/system_dynamics_view_v4.json
          test -s results/system_behavior_dynamics_preflight/SUMMARY.txt
          grep -q '^SYSTEM_BEHAVIOR_DYNAMICS_PREFLIGHT=PASS$' results/system_behavior_dynamics_preflight/SUMMARY.txt
          grep -q '^SCIENTIFIC_EVIDENCE=NO$' results/system_behavior_dynamics_preflight/SUMMARY.txt
          grep -q '^JUMP_TRUTH_STATUS=NOT_ADJUDICATED$' results/system_behavior_dynamics_preflight/SUMMARY.txt
          grep -q '^PENETRATION_STATUS=NOT_ADJUDICATED$' results/system_behavior_dynamics_preflight/SUMMARY.txt
          grep -q '^LINEAGE_STATUS=NOT_DERIVED_POST_CANDIDATE_ORDER_ONLY$' results/system_behavior_dynamics_preflight/SUMMARY.txt
      - name: Derive v4 source-backed lineage and mechanical penetration-depth candidates
        run: |
          python -m arena.system_behavior_lineage_preflight --outdir results/system_behavior_lineage_preflight
          test -s results/system_behavior_lineage_preflight/source_trace.json
          test -s results/system_behavior_lineage_preflight/behavior_events_v0.1.jsonl
          test -s results/system_behavior_lineage_preflight/structural_jump_candidates_v0.1.jsonl
          test -s results/system_behavior_lineage_preflight/source_lineage_relations_v0.1.jsonl
          test -s results/system_behavior_lineage_preflight/system_lineage_view_v4.json
          test -s results/system_behavior_lineage_preflight/system_trajectory_measurement_v4.json
          test -s results/system_behavior_lineage_preflight/SUMMARY.txt
          grep -q '^SYSTEM_BEHAVIOR_LINEAGE_PREFLIGHT=PASS$' results/system_behavior_lineage_preflight/SUMMARY.txt
          grep -q '^SCIENTIFIC_EVIDENCE=NO$' results/system_behavior_lineage_preflight/SUMMARY.txt
          grep -q '^LINEAGE_STATUS=SOURCE_BACKED_STRUCTURAL_LINEAGE_v0.1$' results/system_behavior_lineage_preflight/SUMMARY.txt
          grep -q '^SEMANTIC_ADOPTION_STATUS=NOT_ADJUDICATED$' results/system_behavior_lineage_preflight/SUMMARY.txt
          grep -q '^AUTHORITY_PENETRATION_STATUS=NOT_ADJUDICATED$' results/system_behavior_lineage_preflight/SUMMARY.txt
      - name: Freeze v4 R5-R6 research-interface binding — zero API calls
        run: |
          python -m arena.v4_binding_preflight --outdir results/v4_binding_preflight
          test -s results/v4_binding_preflight/plan/branch_plan.json
          test -s results/v4_binding_preflight/plan/v4_research_binding.json
          test -s results/v4_binding_preflight/SUMMARY.txt
          grep -q '^V4_RESEARCH_BINDING_PREFLIGHT=PASS$' results/v4_binding_preflight/SUMMARY.txt
          grep -q '^SCIENTIFIC_EVIDENCE=NO$' results/v4_binding_preflight/SUMMARY.txt
          grep -q '^AUTHORIZATION_STATUS=NOT_AUTHORIZED$' results/v4_binding_preflight/SUMMARY.txt
          grep -q '^PAID_API_AUTHORIZED=NO$' results/v4_binding_preflight/SUMMARY.txt
          grep -q '^SEMANTIC_STATUS=NOT_ADJUDICATED$' results/v4_binding_preflight/SUMMARY.txt
      - name: Build bounded v4 semantic and Authority review packets — zero evaluator calls
        run: |
          python -m arena.v4_review_preflight --outdir results/v4_review_preflight
          test -s results/v4_review_preflight/bounded_review_packets_v4.jsonl
          test -s results/v4_review_preflight/review_contract_fixture.json
          test -s results/v4_review_preflight/SUMMARY.txt
          grep -q '^V4_BOUNDED_REVIEW_PREFLIGHT=PASS$' results/v4_review_preflight/SUMMARY.txt
          grep -q '^SCIENTIFIC_EVIDENCE=NO$' results/v4_review_preflight/SUMMARY.txt
          grep -q '^SEMANTIC_REVIEW_PERFORMED=NO$' results/v4_review_preflight/SUMMARY.txt
          grep -q '^PAID_EVALUATOR_CALLED=NO$' results/v4_review_preflight/SUMMARY.txt
          grep -q '^FULL_TRAJECTORY_IN_PACKET=NO$' results/v4_review_preflight/SUMMARY.txt
          grep -q '^RAW_MODEL_OUTPUT_IN_PACKET=NO$' results/v4_review_preflight/SUMMARY.txt
          grep -q '^HIDDEN_CHAIN_OF_THOUGHT_IN_PACKET=NO$' results/v4_review_preflight/SUMMARY.txt
      - name: Derive v4 branch measurements and review packets from frozen fixture evidence
        run: |
          python -m arena.v4_branch_derivation_preflight --outdir results/v4_branch_derivation_preflight
          test -s results/v4_branch_derivation_preflight/evidence_batch.json
          test -s results/v4_branch_derivation_preflight/trajectory_measurements_v4.jsonl
          test -s results/v4_branch_derivation_preflight/branch_anchor_lineage_views_v4.jsonl
          test -s results/v4_branch_derivation_preflight/bounded_review_packets_v4.jsonl
          test -s results/v4_branch_derivation_preflight/branch_anchor_review_packets_v4.jsonl
          test -s results/v4_branch_derivation_preflight/pair_structural_comparisons_v4.jsonl
          test -s results/v4_branch_derivation_preflight/summary.json
          test -s results/v4_branch_derivation_preflight/SUMMARY.txt
          grep -q '^V4_BRANCH_DERIVATION_PREFLIGHT=PASS$' results/v4_branch_derivation_preflight/SUMMARY.txt
          grep -q '^SCIENTIFIC_EVIDENCE=NO$' results/v4_branch_derivation_preflight/SUMMARY.txt
          grep -q '^PAID_API_CALLS=0$' results/v4_branch_derivation_preflight/SUMMARY.txt
          grep -q '^PAID_EVALUATOR_CALLED=NO$' results/v4_branch_derivation_preflight/SUMMARY.txt
          grep -q '^MEASUREMENT_V3_REPLACED=NO$' results/v4_branch_derivation_preflight/SUMMARY.txt
          grep -q '^SEMANTIC_STATUS=NOT_ADJUDICATED$' results/v4_branch_derivation_preflight/SUMMARY.txt
          grep -q '^BRANCH_ANCHOR_REVIEW_HIDDEN_COT_INCLUDED=NO$' results/v4_branch_derivation_preflight/SUMMARY.txt
          grep -q '^CAUSAL_EFFECT_STATUS=NOT_ADJUDICATED$' results/v4_branch_derivation_preflight/SUMMARY.txt
      - name: Execute frozen first-paper R5-MID structural analysis contract on fixture pairs
        run: |
          python -m arena.analyze_first_paper_r5mid \
            --comparisons results/v4_branch_derivation_preflight/pair_structural_comparisons_v4.jsonl \
            --derivation-summary results/v4_branch_derivation_preflight/summary.json \
            --out results/v4_branch_derivation_preflight/first_paper_structural_analysis_v0.1.json
          test -s results/v4_branch_derivation_preflight/first_paper_structural_analysis_v0.1.json
          python - <<'PY'
          import json
          p = 'results/v4_branch_derivation_preflight/first_paper_structural_analysis_v0.1.json'
          row = json.load(open(p, encoding='utf-8'))
          assert row['schema'] == 'RB-FIRST-PAPER-STRUCTURAL-ANALYSIS-v0.1'
          assert row['primary_outcome_id'] == 'R5MID_ANCHOR_DOWNSTREAM_OPERATIONAL_CROSSING_COUNT'
          assert row['primary_p_value'] is None
          assert row['semantic_status'] == 'NOT_INCLUDED_IN_STRUCTURAL_ANALYSIS'
          assert row['causal_claim_status'] == 'NOT_ESTABLISHED_BY_STRUCTURAL_ANALYSIS_ALONE'
          assert row['primary_interval_status'] == 'NOT_ESTIMATED_MINIMUM_PAIR_COUNT_NOT_MET'
          print('FIRST_PAPER_ANALYSIS_FIXTURE=PASS')
          PY
      - name: Build current v0.3.2 offline manifest sample
        run: |
          python -m arena.build_manifest --domains all --repeats 2 --arena-config arena/config/arena_v0.3.json --out results/arena_manifest_preflight.jsonl
          test "$(wc -l < results/arena_manifest_preflight.jsonl)" -eq 8
      - name: Validate shared structural views and asynchronous review import
        run: |
          python -m arena.build_manifest --domains all --repeats 1 --arena-config arena/config/arena_v0.3.json --out results/structural_manifest.jsonl
          python -m arena.structural_preflight --manifest results/structural_manifest.jsonl --outdir results/structural_preflight
      - name: Build R5-R6 frozen-parent branch and Measurement-v3 recovery preflight
        run: |
          python -m arena.branch_recovery_preflight --outdir results/branch_recovery_preflight
          test -s results/branch_recovery_preflight/baseline_trace.json
          test -s results/branch_recovery_preflight/parent_snapshot.json
          test -s results/branch_recovery_preflight/anchor_selection.json
          test -s results/branch_recovery_preflight/control_manifest.json
          test -s results/branch_recovery_preflight/intervention_manifest.json
          test -s results/branch_recovery_preflight/intervened_start_snapshot.json
          test -s results/branch_recovery_preflight/control_trace.json
          test -s results/branch_recovery_preflight/intervention_trace.json
          test -s results/branch_recovery_preflight/control_measurement.json
          test -s results/branch_recovery_preflight/intervention_measurement.json
          test -s results/branch_recovery_preflight/branch_comparison.json
          test -s results/branch_recovery_preflight/recovery_record.json
          test -s results/branch_recovery_preflight/SUMMARY.txt
      - name: Build branchable R5-R6 baseline snapshot candidate manifest — no API calls
        run: |
          python -m arena.build_branch_baseline_manifest \
            --repeats 2 \
            --domain ecommerce \
            --arena-config arena/config/arena_v0.3.json \
            --model-config arena/config/model_deepseek_v0.2.json \
            --anchor-rule arena/config/r5r6_anchor_rule_v0.2.json \
            --out results/r5r6_baseline_manifest_candidate.jsonl
          test "$(wc -l < results/r5r6_baseline_manifest_candidate.jsonl)" -eq 2
      - name: Build Free-vs-Structured offline comparison evidence
        run: |
          python -m arena.orchestration_preflight --outdir results/orchestration_preflight
          test -s results/orchestration_preflight/free_trace.json
          test -s results/orchestration_preflight/structured_trace.json
          test -s results/orchestration_preflight/comparison.json
          test -s results/orchestration_preflight/SUMMARY.txt
      - name: Build paired R7 candidate manifest — no API calls
        run: |
          python -m arena.build_orchestration_manifest --repeats 2 --out results/r7_orchestration_manifest_candidate.jsonl
          test "$(wc -l < results/r7_orchestration_manifest_candidate.jsonl)" -eq 4
      - name: Upload offline preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: r2-free-agent-arena-preflight-${{ github.run_id }}
          path: results/
          retention-days: 30
