name: Stage-II v7.10 One-Time Common Subject Readiness

on:
  push:
    branches:
      - research/stage2-subject-readiness-live-v710
    paths:
      - 'stage2/native_v7/readiness_trigger.json'

permissions:
  contents: read

concurrency:
  group: stage2-v710-one-time-readiness
  cancel-in-progress: false

jobs:
  common-provider-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Read separately frozen trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          p = json.load(open('stage2/native_v7/readiness_trigger.json'))
          assert p['schema'] == 'stage2-v710-readiness-trigger-v1'
          print('READINESS_EXECUTION_SHA=' + p['expected_execution_sha'])
          print('READINESS_AUTH=' + p['authorization_phrase'])
          print('READINESS_MAX_CALLS=' + str(p['max_subject_calls']))
          print('READINESS_CEILING=' + str(p['spending_ceiling_usd']))
          PY

      - name: Checkout exact pre-trigger execution commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$READINESS_EXECUTION_SHA"
          test "$(git rev-parse HEAD)" = "$READINESS_EXECUTION_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-verify frozen architecture and execution binding
        shell: bash
        run: |
          set -euo pipefail
          python -m stage2.native_v7.freeze
          python -m unittest discover -s stage2/native_v7/tests -v

      - name: Build exact readiness preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stage2_v710_readiness
          mkdir -p /tmp/stage2_v710_readiness
          python -m stage2.native_v7.subject_readiness preflight             --expected-execution-sha "$READINESS_EXECUTION_SHA"             --actual-execution-sha "$(git rev-parse HEAD)"             --authorization-phrase "$READINESS_AUTH"             --max-subject-calls "$READINESS_MAX_CALLS"             --spending-ceiling "$READINESS_CEILING"             --out /tmp/stage2_v710_readiness/preflight.json

      - name: Execute exactly one non-scientific DeepSeek readiness call
        id: handshake
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python -m stage2.native_v7.subject_readiness handshake             --preflight /tmp/stage2_v710_readiness/preflight.json             --out /tmp/stage2_v710_readiness/receipt.json
          code=$?
          echo "runner_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Freeze receipt hashes before judging success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/stage2_v710_readiness/receipt.json; then
            echo "READINESS_RECEIPT_SHA256=$(sha256sum /tmp/stage2_v710_readiness/receipt.json | awk '{print $1}')"
            python -c "import json; p=json.load(open('/tmp/stage2_v710_readiness/receipt.json')); print('READINESS_EXECUTION_SURFACES='+json.dumps(p['probe_execution_surface_sha256'],sort_keys=True))"
          fi
          printf '%s\n' "$READINESS_EXECUTION_SHA" > /tmp/stage2_v710_readiness/execution_code_sha.txt
          tar -czf /tmp/stage2-v710-readiness-${{ github.run_id }}.tar.gz -C /tmp/stage2_v710_readiness .
          sha256sum /tmp/stage2-v710-readiness-${{ github.run_id }}.tar.gz > /tmp/stage2-v710-readiness-${{ github.run_id }}.tar.gz.sha256

      - name: Upload immutable one-time readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-v710-readiness-${{ github.run_id }}
          path: |
            /tmp/stage2-v710-readiness-${{ github.run_id }}.tar.gz
            /tmp/stage2-v710-readiness-${{ github.run_id }}.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Fail closed after evidence preservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.handshake.outputs.runner_exit_code }}" = "0"
          python - <<'PY'
          import json
          p = json.load(open('/tmp/stage2_v710_readiness/receipt.json'))
          assert p['status'] == 'COMMON_PROVIDER_HANDSHAKE_RECORDED_NOT_SUBJECT_READY'
          assert p['provider_call_count'] == 1
          assert p['scientific_task_used'] is False
          assert p['natural_cell_reserved'] is False
          assert set(p['eligible_probes_after_common_handshake']) == {'X1','X2','X3','X4','X5'}
          assert set(p['probe_execution_surface_sha256']) == {'X1','X2','X3','X4','X5'}
          print('PASS: one common readiness receipt frozen; natural cells remain closed')
          PY
