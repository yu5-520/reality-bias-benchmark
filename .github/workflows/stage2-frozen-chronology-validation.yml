name: Frozen chronology offline validation
on:
  pull_request:
    paths:
      - 'arena/checkpoint_chronology.py'
      - 'arena/tests/test_checkpoint_chronology.py'
      - 'arena/build_stage2*packets*.py'
      - 'scripts/*stage2*chronology*.py'
      - 'stage2/replication_v2/chronology_correction_v1/**'
      - 'stage2/replication_v2/chronology_semantic_review_v1/**'
      - 'reviews/stage2_chronology_correction_review_protocol_v1.md'
      - '.github/workflows/stage2-frozen-chronology-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ordering and validate frozen corrections without providers
        run: |
          python -m unittest arena.tests.test_checkpoint_chronology
          python scripts/validate_stage2_chronology_correction.py
          python scripts/validate_stage2_chronology_semantic_review.py
