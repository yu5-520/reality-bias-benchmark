name: R2 Wave 1 Real Run

on:
  workflow_dispatch:

concurrency:
  group: r2-wave1-real
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: API smoke test C/P/R
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python runners/run_r2_real.py --mode smoke --max-workers 3 --out results/smoke.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: r2-smoke-${{ github.run_id }}
          path: |
            results/smoke.jsonl
            results/json_format_retries.jsonl
          if-no-files-found: error

  wave1:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 252 R2 Wave 1 cells
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python runners/run_r2_real.py --mode full --max-workers 6 --out results/r2_wave1_raw.jsonl
      - name: Analyze Wave 1
        run: |
          python analysis/analyze_r2_real.py --input results/r2_wave1_raw.jsonl --outdir results/analysis
          python analysis/analyze_r2_primary_event.py --input results/r2_wave1_raw.jsonl --outdir results/primary_event_analysis
          cat results/analysis/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Wave 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-wave1-${{ github.run_id }}
          path: |
            results/r2_wave1_raw.jsonl
            results/r2_wave1_raw.jsonl.errors.json
            results/json_format_retries.jsonl
            results/analysis/
            results/primary_event_analysis/
          if-no-files-found: warn
          retention-days: 90
