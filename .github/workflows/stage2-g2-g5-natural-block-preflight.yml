name: Stage-II G2-G5 Natural Block Preflight

on:
  pull_request:
    paths:
      - "configs/stage2_g2_g5_84_cell_natural_block_launch_contract_v1.json"
      - "configs/stage2_g2_g5_logical_decision_horizon_v1.json"
      - "stage2/r7_prospective_v1/**"
      - "stage2/native_v7/x3_a2a/service.py"
      - "scripts/validate_stage2_g2_g5_84_cell_contract_v1.py"
      - ".github/workflows/stage2-g2-g5-natural-block-preflight.yml"
  push:
    branches: [main]
    paths:
      - "configs/stage2_g2_g5_84_cell_natural_block_launch_contract_v1.json"
      - "configs/stage2_g2_g5_logical_decision_horizon_v1.json"
      - "stage2/r7_prospective_v1/**"
      - "stage2/native_v7/x3_a2a/service.py"
      - "scripts/validate_stage2_g2_g5_84_cell_contract_v1.py"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed Python
        run: python -m compileall -q stage2/r7_prospective_v1 stage2/native_v7/x3_a2a scripts/validate_stage2_g2_g5_84_cell_contract_v1.py
      - name: Validate exact 84-cell contract
        run: python scripts/validate_stage2_g2_g5_84_cell_contract_v1.py

  x1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact frozen AutoGen
        run: |
          set -euo pipefail
          git clone -q https://github.com/microsoft/autogen upstream
          git -C upstream checkout -q 027ecf0a379bcc1d09956d46d12d44a3ad9cee14
          pip install -q ./upstream/python/packages/autogen-core ./upstream/python/packages/autogen-agentchat './upstream/python/packages/autogen-ext[openai]'
      - name: Run X1 64-decision/channel preflight
        run: python -m stage2.r7_prospective_v1.g2_g5_horizon_channel_preflight --system X1 --out-root preflight_x1
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g2-g5-preflight-x1-${{ github.run_id }}
          path: preflight_x1
          retention-days: 30

  x2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Bind pinned MetaGPT
        run: |
          set -euo pipefail
          git clone -q https://github.com/FoundationAgents/MetaGPT upstream
          git -C upstream checkout -q 11cdf466d042aece04fc6cfd13b28e1a70341b1f
          python -m pip install -q --upgrade pip
          grep -v '^lancedb==0.4.0$' upstream/requirements.txt > /tmp/metagpt-requirements-stage2.txt
          python -m pip install -q -r /tmp/metagpt-requirements-stage2.txt
          python -m pip install -q 'pyarrow==14.0.2'
          python -m pip install -q --no-deps -e upstream
      - name: Run X2 64-decision/channel preflight
        run: python -m stage2.r7_prospective_v1.g2_g5_horizon_channel_preflight --system X2 --out-root preflight_x2
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g2-g5-preflight-x2-${{ github.run_id }}
          path: preflight_x2
          retention-days: 30

  x3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact frozen A2A protocol and SDK
        run: |
          set -euo pipefail
          git clone -q https://github.com/a2aproject/a2a-python upstream
          git -C upstream checkout -q 0d5473ca4fa6d40034a6a7c8d65bce5cd85d8167
          pip install -q -e './upstream[http-server]' 'uvicorn>=0.35.0'
          git clone -q https://github.com/a2aproject/A2A protocol
          git -C protocol checkout -q 173695755607e884aa9acf8ce4feed90e32727a1
      - name: Run X3 64-decision/channel preflight
        run: python -m stage2.r7_prospective_v1.g2_g5_horizon_channel_preflight --system X3 --out-root preflight_x3
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g2-g5-preflight-x3-${{ github.run_id }}
          path: preflight_x3
          retention-days: 30

  x4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact frozen MCP
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk upstream
          git -C upstream checkout -q f1b6589088534632fef92238ee9750951e3c0185
          python -m pip install -q uv
          (cd upstream && uv sync --frozen --no-default-groups)
      - name: Run X4 full-64 shared-host/channel preflight
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: upstream/.venv/bin/python -m stage2.r7_prospective_v1.g2_g5_horizon_channel_preflight --system X4 --out-root preflight_x4
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g2-g5-preflight-x4-${{ github.run_id }}
          path: preflight_x4
          retention-days: 30

  x5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run X5 horizon/channel preflight
        run: python -m stage2.r7_prospective_v1.g2_g5_horizon_channel_preflight --system X5 --out-root preflight_x5
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g2-g5-preflight-x5-${{ github.run_id }}
          path: preflight_x5
          retention-days: 30

  x6:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Bind exact frozen MemoryBank source
        run: |
          set -euo pipefail
          git clone -q https://github.com/zhongwanjun/MemoryBank-SiliconFriend upstream
          git -C upstream checkout -q cf61c4196e4cfdb0f2b7a0316249fa40312dc3a9
      - name: Install isolated MemoryBank stack
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q 'torch==2.0.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'numpy==1.24.4' 'pydantic==1.10.13' 'huggingface-hub==0.14.1' 'tokenizers==0.13.3' 'transformers==4.28.0' 'faiss-cpu==1.7.4' 'scipy==1.10.1' 'scikit-learn==1.3.2' 'nltk==3.9.1' 'Pillow==10.4.0' 'unstructured==0.6.10' 'langchain==0.0.146'
          python -m pip install -q --no-deps 'sentence-transformers==2.2.2'
      - name: Run X6 horizon/channel preflight
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m stage2.r7_prospective_v1.g2_g5_horizon_channel_preflight --system X6 --out-root preflight_x6 --upstream-root upstream
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g2-g5-preflight-x6-${{ github.run_id }}
          path: preflight_x6
          retention-days: 30

  x7:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind exact frozen LLMLingua source
        run: |
          set -euo pipefail
          git clone -q https://github.com/microsoft/LLMLingua upstream
          git -C upstream checkout -q 5a4c78ae18ab17a98cf997e8259354e546081d64
      - name: Install CPU native compression environment
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' 'accelerate>=0.33,<1' tiktoken nltk numpy tokenizers safetensors
          python -m pip install -q --no-deps -e upstream
      - name: Run X7 horizon/channel preflight
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python -m stage2.r7_prospective_v1.g2_g5_horizon_channel_preflight --system X7 --out-root preflight_x7
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-g2-g5-preflight-x7-${{ github.run_id }}
          path: preflight_x7
          retention-days: 30
