name: V5.4 Canonical Geometry Offline Validate

on:
  pull_request:
    paths:
      - "theory/theory_contract_v0.15.md"
      - "theory/change_notes/CN-R-061_canonical_r5_r7_geometry.md"
      - "docs/R_Plan_v5.4.md"
      - "docs/first_paper_v5_4_scope.md"
      - "docs/v5_whole_process_experiment_protocol_v0.3.md"
      - "docs/R5_canonical_single_intervention_protocol_v1.0.md"
      - "docs/R7_dual_intervention_protocol_v2.0.md"
      - "docs/canonical_stochastic_realization_principle_v1.0.md"
      - "docs/legacy_execution_geometry_registry_v1.0.md"
      - "docs/cross_domain_case_progression_contract_v0.3.md"
      - "docs/R5_structural_scouting_and_driver_probe_protocol_v1.2.md"
      - "docs/R6_structural_support_trace_control_surface_protocol_v1.2.md"
      - "docs/reporting/process_reality_theory_experiment_report_standard_v1_2.md"
      - "docs/reporting/process_reality_engineering_experiment_report_standard_v1_2.md"
      - "configs/process_reality_canonical_experiment_geometry_v1.0.json"
      - "configs/r7_process_integrity_engineering_contract_v0.5.json"
      - "manifests/v5_4_r5_r7_canonical_reclassification_2026-09-19_v0_1.json"
      - "schemas/r5_canonical_*.json"
      - "schemas/r7_dual_*.json"
      - "arena/prepare_v5_cross_domain_r5_canonical.py"
      - "arena/run_v5_cross_domain_r5_canonical.py"
      - "arena/freeze_v5_cross_domain_r5_canonical.py"
      - "arena/prepare_r7_dual_intervention_plan.py"
      - "arena/run_r7_dual_intervention_real.py"
      - "arena/freeze_r7_dual_intervention_evidence.py"
      - "arena/build_v5_4_r5r6_canonical_reclassification.py"
      - "configs/v5_4_cross_domain_r5_canonical_wave3_v0.1.json"
      - "docs/v5_4_cross_domain_r5_canonical_wave3_protocol_v0.1.md"
      - ".github/workflows/v5-4-r5-canonical-wave3.yml"
      - "results/v5_4_r5r6_canonical_wave12_v0_1/**"
      - "manifests/v5_4_r5r6_canonical_wave12_2026-09-19_v0_1.json"
      - "docs/reports/2026-09-19/V5_4_R5_R6_Canonical_Wave1_2_Reclassification_Report_v1.md"
      - ".github/workflows/v5-4-r5r6-canonical-wave12.yml"
      - "arena/tests/test_v5_4_canonical_geometry.py"
      - "scripts/validate_canonical_r5_r7_geometry_v1.py"
      - "scripts/validate_process_reality_v5.py"
      - "README.md"
      - ".github/workflows/v5-4-canonical-geometry-offline-validate.yml"
  push:
    branches: [ main ]
    paths:
      - "theory/theory_contract_v0.15.md"
      - "docs/R_Plan_v5.4.md"
      - "configs/process_reality_canonical_experiment_geometry_v1.0.json"
      - "arena/*canonical*.py"
      - "arena/*dual_intervention*.py"
      - "scripts/validate_canonical_r5_r7_geometry_v1.py"
      - ".github/workflows/v5-4-canonical-geometry-offline-validate.yml"

permissions:
  contents: read

jobs:
  canonical-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON contracts
        run: |
          set -euo pipefail
          python -m json.tool configs/process_reality_canonical_experiment_geometry_v1.0.json >/dev/null
          python -m json.tool configs/r7_process_integrity_engineering_contract_v0.5.json >/dev/null
          python -m json.tool manifests/v5_4_r5_r7_canonical_reclassification_2026-09-19_v0_1.json >/dev/null
          python -m json.tool schemas/r5_canonical_case_plan_v0.1.schema.json >/dev/null
          python -m json.tool schemas/r5_canonical_evidence_pair_v0.1.schema.json >/dev/null
          python -m json.tool schemas/r7_dual_intervention_plan_v0.1.schema.json >/dev/null
          python -m json.tool schemas/r7_dual_intervention_result_v0.1.schema.json >/dev/null

      - name: Compile forward canonical runners
        run: |
          set -euo pipefail
          python -m py_compile             arena/prepare_v5_cross_domain_r5_canonical.py             arena/run_v5_cross_domain_r5_canonical.py             arena/freeze_v5_cross_domain_r5_canonical.py             arena/prepare_r7_dual_intervention_plan.py             arena/run_r7_dual_intervention_real.py             arena/freeze_r7_dual_intervention_evidence.py             scripts/validate_canonical_r5_r7_geometry_v1.py             scripts/validate_process_reality_v5.py

      - name: Validate Wave1-2 canonical reclassification contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('manifests/v5_4_r5_r7_canonical_reclassification_2026-09-19_v0_1.json'))
          assert p['r5']['canonical_case_count_first_two_waves']==11
          assert p['r5']['canonical_r5_intervention_count_first_two_waves']==11
          assert p['r5']['forward_canonical_rule']['selection_is_outcome_aware'] is False
          assert p['r5']['forward_canonical_rule']['intervention_selection']=='REPLICATE_INDEX_1_AND_CONDITION_ONE_SHOT_JUMP_INTERVENTION'
          print('PASS: Wave1-2 canonical selection is deterministic and one-per-case')
          PY

      - name: Validate canonical Wave3 plan
        run: |
          python -m json.tool configs/v5_4_cross_domain_r5_canonical_wave3_v0.1.json >/dev/null
          python -m json.tool results/v5_4_r5r6_canonical_wave12_v0_1/summary.json >/dev/null
          python -m json.tool manifests/v5_4_r5r6_canonical_wave12_2026-09-19_v0_1.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('configs/v5_4_cross_domain_r5_canonical_wave3_v0.1.json'))
          assert p['status']=='FROZEN_PRE_EXECUTION_PLAN'
          assert [x['wave_id'] for x in p['selected_cases']]==[1,3,4,5,6]
          assert len({x['source_case_hash'] for x in p['selected_cases']})==5
          assert len(p['exclude_previous_case_hashes'])==11
          assert p['geometry']['case_count']==5
          assert p['geometry']['new_intervention_branch_count']==5
          assert p['geometry']['synthetic_control_branch_count']==0
          assert p['geometry']['canonical_replicate_count']==1
          assert p['geometry']['total_new_provider_branch_count']==5
          assert p['budget']['provider']=='deepseek'
          assert p['budget']['global_spending_ceiling_usd']==1.25
          assert p['authorization']['r6_new_subject_experiment'] is False
          assert p['authorization']['r7_repair'] is False
          print('PASS: canonical Wave3 is five cases / five paid R5-I branches')
          PY

      - name: Run canonical geometry unit tests
        run: |
          python -m unittest arena.tests.test_v5_4_canonical_geometry -v

      - name: Run v5.4 canonical geometry validator
        run: |
          python scripts/validate_canonical_r5_r7_geometry_v1.py

      - name: Revalidate full Process Reality method layer
        run: |
          python scripts/validate_process_reality_v5.py

      - name: Verify no execution authorization
        run: |
          python - <<'PY'
          import json
          g=json.load(open('configs/process_reality_canonical_experiment_geometry_v1.0.json'))
          assert g['authorization']=={
              'provider_calls':False,
              'paid_evaluator':False,
              'active_r7':False,
              'cpr':False,
          }
          assert g['r5']['new_provider_branches_per_case']==1
          assert g['r6']['new_subject_provider_branches_per_case']==0
          assert g['r7']['new_provider_branches_per_case']==2
          print('PASS: v5.4 update changes method/code geometry only; no subject run authorized')
          PY
