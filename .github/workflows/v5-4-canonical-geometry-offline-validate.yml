name: V5.4 Canonical Geometry Offline Validate

on:
  pull_request:
    paths:
      - "theory/theory_contract_v0.15.md"
      - "theory/change_notes/CN-R-061_canonical_r5_r7_geometry.md"
      - "docs/R_Plan_v5.4.md"
      - "docs/first_paper_v5_4_scope.md"
      - "docs/v5_whole_process_experiment_protocol_v0.3.md"
      - "docs/R5_canonical_single_intervention_protocol_v1.0.md"
      - "docs/R7_dual_intervention_protocol_v2.0.md"
      - "docs/canonical_stochastic_realization_principle_v1.0.md"
      - "docs/legacy_execution_geometry_registry_v1.0.md"
      - "docs/cross_domain_case_progression_contract_v0.3.md"
      - "docs/R5_structural_scouting_and_driver_probe_protocol_v1.2.md"
      - "docs/R6_structural_support_trace_control_surface_protocol_v1.2.md"
      - "docs/reporting/process_reality_theory_experiment_report_standard_v1_2.md"
      - "docs/reporting/process_reality_engineering_experiment_report_standard_v1_2.md"
      - "configs/process_reality_canonical_experiment_geometry_v1.0.json"
      - "configs/r7_process_integrity_engineering_contract_v0.5.json"
      - "manifests/v5_4_r5_r7_canonical_reclassification_2026-09-19_v0_1.json"
      - "schemas/r5_canonical_*.json"
      - "schemas/r7_dual_*.json"
      - "arena/prepare_v5_cross_domain_r5_canonical.py"
      - "arena/run_v5_cross_domain_r5_canonical.py"
      - "arena/freeze_v5_cross_domain_r5_canonical.py"
      - "arena/prepare_r7_dual_intervention_plan.py"
      - "arena/run_r7_dual_intervention_real.py"
      - "arena/freeze_r7_dual_intervention_evidence.py"
      - "arena/build_v5_4_r5r6_canonical_reclassification.py"
      - "arena/derive_v5_4_r6_canonical_natural_vs_r5.py"
      - "arena/build_v5_4_r6_canonical_semantic_audit_v0_3.py"
      - "schemas/v5_4_r6_canonical_semantic_audit_v0.3.schema.json"
      - "manifests/v5_4_r6_canonical_wave3_semantic_review_2026-09-19_v0_3.json"
      - "manifests/v5_4_r6_canonical_wave4_semantic_review_2026-09-19_v0_3.json"
      - ".github/workflows/v5-4-r6-canonical-wave4-semantic.yml"
      - "manifests/v5_4_r5r6_canonical_wave3_2026-09-19_v0_1.json"
      - "manifests/v5_4_r5r6_canonical_wave4_2026-09-19_v0_1.json"
      - "results/v5_4_r6_canonical_wave4_semantic_audit_v0_1/**"
      - "docs/reports/2026-09-19/V5_4_Canonical_R5_R6_Wave4_Result_Report_v1.md"
      - "results/v5_4_r6_canonical_wave3_semantic_audit_v0_1/**"
      - "docs/reports/2026-09-19/V5_4_Canonical_R5_R6_Wave3_Result_Report_v1.md"
      - ".github/workflows/v5-4-r6-canonical-wave3-semantic.yml"
      - "docs/v5_4_r6_canonical_natural_vs_r5_protocol_v0.3.md"
      - ".github/workflows/v5-4-r6-canonical-wave3-structural.yml"
      - ".github/workflows/v5-4-r6-canonical-wave4-structural.yml"
      - "configs/v5_4_cross_domain_r5_canonical_wave3_v0.1.json"
      - "configs/v5_4_cross_domain_r5_canonical_wave4_v0.1.json"
      - "docs/v5_4_cross_domain_r5_canonical_wave4_protocol_v0.1.md"
      - ".github/workflows/v5-4-r5-canonical-wave4.yml"
      - "docs/v5_4_cross_domain_r5_canonical_wave3_protocol_v0.1.md"
      - ".github/workflows/v5-4-r5-canonical-wave3.yml"
      - "results/v5_4_r5r6_canonical_wave12_v0_1/**"
      - "manifests/v5_4_r5r6_canonical_wave12_2026-09-19_v0_1.json"
      - "docs/reports/2026-09-19/V5_4_R5_R6_Canonical_Wave1_2_Reclassification_Report_v1.md"
      - ".github/workflows/v5-4-r5r6-canonical-wave12.yml"
      - "arena/tests/test_v5_4_canonical_geometry.py"
      - "scripts/validate_canonical_r5_r7_geometry_v1.py"
      - "scripts/validate_process_reality_v5.py"
      - "README.md"
      - ".github/workflows/v5-4-canonical-geometry-offline-validate.yml"
  push:
    branches: [ main ]
    paths:
      - "theory/theory_contract_v0.15.md"
      - "docs/R_Plan_v5.4.md"
      - "configs/process_reality_canonical_experiment_geometry_v1.0.json"
      - "arena/*canonical*.py"
      - "arena/*dual_intervention*.py"
      - "scripts/validate_canonical_r5_r7_geometry_v1.py"
      - ".github/workflows/v5-4-canonical-geometry-offline-validate.yml"

permissions:
  contents: read

jobs:
  canonical-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON contracts
        run: |
          set -euo pipefail
          python -m json.tool configs/process_reality_canonical_experiment_geometry_v1.0.json >/dev/null
          python -m json.tool configs/r7_process_integrity_engineering_contract_v0.5.json >/dev/null
          python -m json.tool manifests/v5_4_r5_r7_canonical_reclassification_2026-09-19_v0_1.json >/dev/null
          python -m json.tool schemas/r5_canonical_case_plan_v0.1.schema.json >/dev/null
          python -m json.tool schemas/r5_canonical_evidence_pair_v0.1.schema.json >/dev/null
          python -m json.tool schemas/r7_dual_intervention_plan_v0.1.schema.json >/dev/null
          python -m json.tool schemas/r7_dual_intervention_result_v0.1.schema.json >/dev/null

      - name: Compile forward canonical runners
        run: |
          set -euo pipefail
          python -m py_compile             arena/prepare_v5_cross_domain_r5_canonical.py             arena/run_v5_cross_domain_r5_canonical.py             arena/freeze_v5_cross_domain_r5_canonical.py             arena/prepare_r7_dual_intervention_plan.py             arena/run_r7_dual_intervention_real.py             arena/freeze_r7_dual_intervention_evidence.py             scripts/validate_canonical_r5_r7_geometry_v1.py             scripts/validate_process_reality_v5.py

      - name: Validate Wave1-2 canonical reclassification contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('manifests/v5_4_r5_r7_canonical_reclassification_2026-09-19_v0_1.json'))
          assert p['r5']['canonical_case_count_first_two_waves']==11
          assert p['r5']['canonical_r5_intervention_count_first_two_waves']==11
          assert p['r5']['forward_canonical_rule']['selection_is_outcome_aware'] is False
          assert p['r5']['forward_canonical_rule']['intervention_selection']=='REPLICATE_INDEX_1_AND_CONDITION_ONE_SHOT_JUMP_INTERVENTION'
          print('PASS: Wave1-2 canonical selection is deterministic and one-per-case')
          PY

      - name: Validate canonical Wave3 plan
        run: |
          python -m json.tool configs/v5_4_cross_domain_r5_canonical_wave3_v0.1.json >/dev/null
          python -m json.tool results/v5_4_r5r6_canonical_wave12_v0_1/summary.json >/dev/null
          python -m json.tool manifests/v5_4_r5r6_canonical_wave12_2026-09-19_v0_1.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('configs/v5_4_cross_domain_r5_canonical_wave3_v0.1.json'))
          assert p['status']=='FROZEN_PRE_EXECUTION_PLAN'
          assert [x['wave_id'] for x in p['selected_cases']]==[1,3,4,5,6]
          assert len({x['source_case_hash'] for x in p['selected_cases']})==5
          assert len(p['exclude_previous_case_hashes'])==11
          assert p['geometry']['case_count']==5
          assert p['geometry']['new_intervention_branch_count']==5
          assert p['geometry']['synthetic_control_branch_count']==0
          assert p['geometry']['canonical_replicate_count']==1
          assert p['geometry']['total_new_provider_branch_count']==5
          assert p['budget']['provider']=='deepseek'
          assert p['budget']['global_spending_ceiling_usd']==1.25
          assert p['authorization']['r6_new_subject_experiment'] is False
          assert p['authorization']['r7_repair'] is False
          print('PASS: canonical Wave3 is five cases / five paid R5-I branches')
          PY

      - name: Validate canonical R6 natural-vs-R5 protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/v5_4_r6_canonical_natural_vs_r5_protocol_v0.3.md').read_text()
          assert 'N0 frozen natural continuation + one frozen R5-I continuation' in p
          assert 'does not compare intervention replicates' in p
          assert 'Structural inequality is explicitly non-semantic' in p
          assert 'zero provider calls' in p
          print('PASS: R6 v0.3 consumes N0 + one R5-I and stays passive')
          PY

      - name: Validate Wave3 semantic review manifest
        run: |
          python -m json.tool manifests/v5_4_r6_canonical_wave3_semantic_review_2026-09-19_v0_3.json >/dev/null
          python -m json.tool schemas/v5_4_r6_canonical_semantic_audit_v0.3.schema.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('manifests/v5_4_r6_canonical_wave3_semantic_review_2026-09-19_v0_3.json'))
          assert p['status']=='MODEL_REVIEW_APPEND_ONLY'
          assert p['expected_case_count']==5
          assert len(p['case_decisions'])==5
          assert len({x['case_id'] for x in p['case_decisions']})==5
          assert sum(x['case_level_system_inertia_status']=='CASE_LEVEL_SYSTEM_INERTIA_SUPPORTED_CANDIDATE' for x in p['case_decisions'])==0
          assert p['uniform_decision']['downstream_read_adoption']=='SUPPORTED'
          assert p['uniform_decision']['decision_action_dependence']=='SUPPORTED'
          assert p['uniform_decision']['post_stimulus_persistence']=='SUPPORTED'
          assert p['uniform_decision']['problematic_bias_status']=='NOT_ESTABLISHED'
          assert p['uniform_decision']['r5_unique_causal_attribution']=='NOT_ESTABLISHED'
          assert p['uniform_decision']['r7_status']=='NOT_AUTHORIZED'
          assert p['uniform_decision']['semantic_cpr_status']=='NOT_ADJUDICATED'
          print('PASS: Wave3 semantic decisions preserve v5.4 claim boundaries')
          PY

      - name: Validate completed canonical Wave3 result
        run: |
          python -m json.tool manifests/v5_4_r5r6_canonical_wave3_2026-09-19_v0_1.json >/dev/null
          python -m json.tool results/v5_4_r6_canonical_wave3_semantic_audit_v0_1/summary.json >/dev/null
          python - <<'PY'
          import json
          m=json.load(open('manifests/v5_4_r5r6_canonical_wave3_2026-09-19_v0_1.json'))
          s=json.load(open('results/v5_4_r6_canonical_wave3_semantic_audit_v0_1/summary.json'))
          assert m['status']=='FROZEN_CANONICAL_WAVE3_COMPLETE'
          assert m['r5']['case_count']==5
          assert m['r5']['new_provider_branch_count']==5
          assert m['r5']['synthetic_control_branch_count']==0
          assert m['r5']['canonical_replicate_count']==1
          assert m['r6_structural']['new_provider_calls']==0
          assert m['r6_semantic']['case_count']==5
          assert s['semantic_adoption_supported_case_count']==5
          assert s['decision_action_dependence_supported_case_count']==5
          assert s['post_stimulus_persistence_supported_case_count']==5
          assert s['system_inertia_supported_candidate_case_count']==0
          assert s['problematic_bias_established_case_count']==0
          assert s['r5_unique_causal_attribution_established_case_count']==0
          assert s['lineage_completeness_assessed'] is False
          assert s['r7_authorized'] is False
          assert s['semantic_cpr_status']=='NOT_ADJUDICATED'
          assert m['cumulative_canonical_mechanism_pool']['canonical_case_count']==16
          assert m['cumulative_canonical_mechanism_pool']['canonical_r5_intervention_count']==16
          assert m['cumulative_canonical_mechanism_pool']['system_inertia_supported_candidate_case_count']==4
          assert m['cumulative_canonical_mechanism_pool']['remaining_pass1_r5_eligible_case_count']==13
          assert m['cumulative_canonical_mechanism_pool']['is_domain_probability_denominator'] is False
          assert m['frozen_evidence_mutated'] is False
          print('PASS: completed Wave3 preserves canonical geometry and claim boundaries')
          PY

      - name: Validate canonical Wave4 plan
        run: |
          python -m json.tool configs/v5_4_cross_domain_r5_canonical_wave4_v0.1.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('configs/v5_4_cross_domain_r5_canonical_wave4_v0.1.json'))
          assert p['status']=='FROZEN_PRE_EXECUTION_PLAN'
          assert [x['wave_id'] for x in p['selected_cases']]==[1,3,4,6]
          assert len({x['source_case_hash'] for x in p['selected_cases']})==4
          assert len(p['exclude_previous_case_hashes'])==16
          assert not ({x['source_case_hash'] for x in p['selected_cases']} & set(p['exclude_previous_case_hashes']))
          assert p['geometry']['case_count']==4
          assert p['geometry']['new_intervention_branch_count']==4
          assert p['geometry']['synthetic_control_branch_count']==0
          assert p['geometry']['canonical_replicate_count']==1
          assert p['geometry']['total_new_provider_branch_count']==4
          assert p['budget']['global_spending_ceiling_usd']==1.0
          assert p['authorization']['r6_new_subject_experiment'] is False
          assert p['authorization']['r7_repair'] is False
          assert p['authorization']['r8_cpr_adjudication'] is False
          print('PASS: canonical Wave4 is four cases / four paid R5-I branches')
          PY

      - name: Validate Wave4 passive R6 materializer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/v5-4-r6-canonical-wave4-structural.yml').read_text()
          assert "R5_RUN_ID: '35445012458'" in p
          assert "R5_ARTIFACT_ID: '10585287716'" in p
          assert "R5_EVIDENCE_HASH: 249c7d980a1f51ee30f68c0e1680d6cb8fad29c377a973b7accabb0db903c4bf" in p
          assert 'for i in 1 3 4 6; do' in p
          assert "assert p['case_count']==4" in p
          assert "assert p['canonical_intervention_trace_count']==4" in p
          print('PASS: Wave4 R6 is exact-artifact-bound and passive')
          PY

      - name: Validate Wave4 semantic review manifest
        run: |
          python -m json.tool manifests/v5_4_r6_canonical_wave4_semantic_review_2026-09-19_v0_3.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('manifests/v5_4_r6_canonical_wave4_semantic_review_2026-09-19_v0_3.json'))
          assert p['status']=='MODEL_REVIEW_APPEND_ONLY'
          assert p['expected_case_count']==4
          assert len(p['case_decisions'])==4
          assert len({x['case_id'] for x in p['case_decisions']})==4
          assert sum(x['case_level_system_inertia_status']=='CASE_LEVEL_SYSTEM_INERTIA_SUPPORTED_CANDIDATE' for x in p['case_decisions'])==0
          assert p['uniform_decision']['downstream_read_adoption']=='SUPPORTED'
          assert p['uniform_decision']['decision_action_dependence']=='SUPPORTED'
          assert p['uniform_decision']['post_stimulus_persistence']=='SUPPORTED'
          assert p['uniform_decision']['problematic_bias_status']=='NOT_ESTABLISHED'
          assert p['uniform_decision']['r5_unique_causal_attribution']=='NOT_ESTABLISHED'
          assert p['uniform_decision']['r7_status']=='NOT_AUTHORIZED'
          assert p['uniform_decision']['semantic_cpr_status']=='NOT_ADJUDICATED'
          print('PASS: Wave4 semantic decisions preserve v5.4 claim boundaries')
          PY

      - name: Validate semantic summary claim boundary is wave-agnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('arena/build_v5_4_r6_canonical_semantic_audit_v0_3.py').read_text()
          assert 'This canonical Wave3 pass classifies five' not in p
          assert 'This canonical semantic pass classifies {len(case_summaries)} realized N0/R5-I case structures.' in p
          print('PASS: canonical semantic summary is reusable across observation waves')
          PY

      - name: Validate completed canonical Wave4 result
        run: |
          python -m json.tool manifests/v5_4_r5r6_canonical_wave4_2026-09-19_v0_1.json >/dev/null
          python -m json.tool results/v5_4_r6_canonical_wave4_semantic_audit_v0_1/summary.json >/dev/null
          python - <<'PY'
          import json
          m=json.load(open('manifests/v5_4_r5r6_canonical_wave4_2026-09-19_v0_1.json'))
          s=json.load(open('results/v5_4_r6_canonical_wave4_semantic_audit_v0_1/summary.json'))
          assert m['status']=='FROZEN_CANONICAL_WAVE4_COMPLETE'
          assert m['r5']['case_count']==4
          assert m['r5']['new_provider_branch_count']==4
          assert m['r5']['synthetic_control_branch_count']==0
          assert m['r5']['canonical_replicate_count']==1
          assert m['r6_structural']['new_provider_calls']==0
          assert m['r6_semantic']['case_count']==4
          assert m['r6_semantic']['summary_hash']=='7ca1d05afd9de7e6d7ce049dd2827c9cbbd6e3ffc88a19c9d39eb360499264a2'
          assert m['r6_semantic']['superseded_materialization']['summary_hash']=='e889c643f018505c0a47f5d16684934c0399f83bdcd2c9944a3f48f7809785de'
          assert s['claim_boundary'].startswith('This canonical semantic pass classifies 4 realized N0/R5-I')
          assert s['semantic_adoption_supported_case_count']==4
          assert s['decision_action_dependence_supported_case_count']==4
          assert s['post_stimulus_persistence_supported_case_count']==4
          assert s['system_inertia_supported_candidate_case_count']==0
          assert s['problematic_bias_established_case_count']==0
          assert s['r5_unique_causal_attribution_established_case_count']==0
          assert s['lineage_completeness_assessed'] is False
          assert s['r7_authorized'] is False
          assert s['semantic_cpr_status']=='NOT_ADJUDICATED'
          assert m['cumulative_canonical_mechanism_pool']['canonical_case_count']==20
          assert m['cumulative_canonical_mechanism_pool']['canonical_r5_intervention_count']==20
          assert m['cumulative_canonical_mechanism_pool']['system_inertia_supported_candidate_case_count']==4
          assert m['cumulative_canonical_mechanism_pool']['remaining_pass1_r5_eligible_case_count']==9
          assert m['cumulative_canonical_mechanism_pool']['is_domain_probability_denominator'] is False
          assert m['frozen_evidence_mutated'] is False
          print('PASS: completed Wave4 preserves canonical geometry and corrected metadata')
          PY

      - name: Run canonical geometry unit tests
        run: |
          python -m unittest arena.tests.test_v5_4_canonical_geometry -v

      - name: Run v5.4 canonical geometry validator
        run: |
          python scripts/validate_canonical_r5_r7_geometry_v1.py

      - name: Revalidate full Process Reality method layer
        run: |
          python scripts/validate_process_reality_v5.py

      - name: Verify no execution authorization
        run: |
          python - <<'PY'
          import json
          g=json.load(open('configs/process_reality_canonical_experiment_geometry_v1.0.json'))
          assert g['authorization']=={
              'provider_calls':False,
              'paid_evaluator':False,
              'active_r7':False,
              'cpr':False,
          }
          assert g['r5']['new_provider_branches_per_case']==1
          assert g['r6']['new_subject_provider_branches_per_case']==0
          assert g['r7']['new_provider_branches_per_case']==2
          print('PASS: v5.4 update changes method/code geometry only; no subject run authorized')
          PY
