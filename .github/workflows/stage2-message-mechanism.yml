name: Single first-attempt message mechanism trial

on:
  push:
    branches: [fix/p2-native-evidence-replay]
    paths: ['configs/stage2_message_first_attempt_v1.json']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage2-message-mechanism-first-attempt
  cancel-in-progress: false

jobs:
  first-attempt:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce one dispatched workflow attempt and frozen trial bounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          request=json.load(open('configs/stage2_message_first_attempt_v1.json'))
          raw=open('configs/stage2_connected_mechanism_v1.json','rb').read()
          assert hashlib.sha256(raw).hexdigest()==request['trial_config_sha256']
          assert request['execute_first_attempt'] is True and request['automatic_replay'] is False
          config=json.loads(raw)
          assert config['planning_max_calls']==16 and config['subject_trial_max_calls']==49
          run=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"]))
          pages=subprocess.check_output(['gh','api','--paginate','--slurp',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/{run['workflow_id']}/runs?per_page=100"])
          earlier=[r for p in json.loads(pages) for r in p['workflow_runs'] if r['id']<run['id']]
          assert not earlier, 'FIRST_ATTEMPT_ALREADY_REGISTERED_NO_REPLAY'
          PY
      - name: Materialize immutable natural prefix archive
        run: |
          set -euo pipefail
          commit=$(python -c "import json; print(json.load(open('configs/stage2_g3_ab_paired_semantic_audit_v1.json'))['source']['natural_A_evidence_commit'])")
          mkdir -p "$RUNNER_TEMP/sources/G3A"
          git cat-file -e "$commit^{commit}" || git fetch origin "$commit"
          git archive "$commit" stage2/replication_v2/G3/natural_A | tar -x -C "$RUNNER_TEMP/sources/G3A"
      - name: Bind unchanged official MCP sources and runtime
        run: |
          set -euo pipefail
          git clone -q https://github.com/modelcontextprotocol/python-sdk "$RUNNER_TEMP/mcp-sdk"
          git -C "$RUNNER_TEMP/mcp-sdk" checkout -q f1b6589088534632fef92238ee9750951e3c0185
          git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol "$RUNNER_TEMP/mcp-protocol"
          git -C "$RUNNER_TEMP/mcp-protocol" checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
          python -m pip install -q uv
          cd "$RUNNER_TEMP/mcp-sdk"
          uv sync --frozen --no-default-groups --python "$(command -v python)"
      - name: Verify active message chain and immutable inputs before model dispatch
        run: |
          "$RUNNER_TEMP/mcp-sdk/.venv/bin/python" scripts/check_stage2_message_repair.py --source-root "$RUNNER_TEMP/sources" --sdk-root "$RUNNER_TEMP/mcp-sdk" --protocol-root "$RUNNER_TEMP/mcp-protocol" --out "$RUNNER_TEMP/message-delivery-check" --compare-frozen
          "$RUNNER_TEMP/mcp-sdk/.venv/bin/python" scripts/run_stage2_connected_repair.py --source-root "$RUNNER_TEMP/sources" --sdk-root "$RUNNER_TEMP/mcp-sdk" --protocol-root "$RUNNER_TEMP/mcp-protocol" --out "$RUNNER_TEMP/mechanism-preflight"
      - name: Execute the authorized first branch trial with retained provider bytes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          "$RUNNER_TEMP/mcp-sdk/.venv/bin/python" scripts/run_stage2_connected_repair.py --source-root "$RUNNER_TEMP/sources" --sdk-root "$RUNNER_TEMP/mcp-sdk" --protocol-root "$RUNNER_TEMP/mcp-protocol" --out "$RUNNER_TEMP/mechanism-first-attempt" --execute --purpose mechanism
      - name: Inspect retained first-attempt outcome
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'mechanism-first-attempt'
          for name in ['result.json','planning/outcome.json','planning/decision.json','host/native_branch/phase_receipt.json','host/native_branch/continuation_assessment.json']:
              path=root/name
              if path.exists():
                  raw=path.read_bytes()
                  print(json.dumps({'retained_source':name,'sha256':hashlib.sha256(raw).hexdigest(),'value':json.loads(raw)},ensure_ascii=False))
          exchanges=root/'host/native_branch/provider_exchanges'
          for directory in sorted(exchanges.glob('[0-9][0-9][0-9][0-9]')):
              for name in ['request.bin','response.bin','receipt.json']:
                  path=directory/name
                  if path.exists():
                      raw=path.read_bytes()
                      print(json.dumps({'retained_source':str(path.relative_to(root)),'sha256':hashlib.sha256(raw).hexdigest(),'raw_utf8':raw.decode()},ensure_ascii=False))
          PY
      - name: Retain all first-attempt evidence including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: message-mechanism-first-attempt-${{ github.sha }}
          path: |
            ${{ runner.temp }}/message-delivery-check
            ${{ runner.temp }}/mechanism-preflight
            ${{ runner.temp }}/mechanism-first-attempt
          retention-days: 90
          if-no-files-found: warn
