name: Stage-II native evidence smoke
on:
  push:
    paths:
      - 'stage2/native_smoke.py'
      - 'stage2/build_runtime_manifest.py'
      - 'stage2/preflight.py'
      - 'stage2/runtime_bindings.json'
      - 'stage2/subject.json'
      - 'stage2/evidence.py'
      - 'stage2/tests/**'
      - 'docs/R_Plan_v6.4.md'
      - '.github/workflows/stage2-native-smoke.yml'
  pull_request:
    paths:
      - 'stage2/native_smoke.py'
      - 'stage2/build_runtime_manifest.py'
      - 'stage2/preflight.py'
      - 'stage2/runtime_bindings.json'
      - 'stage2/subject.json'
      - 'stage2/evidence.py'
      - 'stage2/tests/**'
      - 'docs/R_Plan_v6.4.md'
      - '.github/workflows/stage2-native-smoke.yml'

jobs:
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - probe: X1
            python: '3.11'
          - probe: X3
            python: '3.11'
          - probe: X4
            python: '3.11'
          - probe: X5
            python: '3.11'
          - probe: X6
            python: '3.10'
          - probe: X7
            python: '3.11'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Bind exact native implementation
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.probe }}" in
            X1)
              git clone -q https://github.com/microsoft/autogen upstream
              git -C upstream checkout -q 027ecf0a379bcc1d09956d46d12d44a3ad9cee14
              pip install -q ./upstream/python/packages/autogen-core ./upstream/python/packages/autogen-agentchat
              ;;
            X3)
              git clone -q https://github.com/a2aproject/a2a-python upstream
              git -C upstream checkout -q 0d5473ca4fa6d40034a6a7c8d65bce5cd85d8167
              pip install -q -e ./upstream
              git clone -q https://github.com/a2aproject/A2A protocol
              git -C protocol checkout -q 173695755607e884aa9acf8ce4feed90e32727a1
              ;;
            X4)
              git clone -q https://github.com/modelcontextprotocol/python-sdk upstream
              git -C upstream checkout -q f1b6589088534632fef92238ee9750951e3c0185
              pip install -q uv
              (cd upstream && uv sync --frozen --no-default-groups)
              git clone -q https://github.com/modelcontextprotocol/modelcontextprotocol protocol
              git -C protocol checkout -q 5f5440bb26a62e2cf3440b92da5a667efa03b267
              ;;
            X5) ;;
            X6)
              git clone -q https://github.com/zhongwanjun/MemoryBank-SiliconFriend upstream
              git -C upstream checkout -q cf61c4196e4cfdb0f2b7a0316249fa40312dc3a9
              pip install -q 'gradio==3.24.1' 'llama-index==0.5.23.post1' 'langchain==0.0.146' 'openai==0.27.6'
              ;;
            X7)
              git clone -q https://github.com/microsoft/LLMLingua upstream
              git -C upstream checkout -q 5a4c78ae18ab17a98cf997e8259354e546081d64
              pip install -q -e ./upstream
              ;;
          esac
      - name: Execute non-study native smoke
        shell: bash
        env:
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          CODE_SHA="$(git rev-parse HEAD)"
          if [ "${{ matrix.probe }}" = X4 ]; then
            PYTHONPATH="$GITHUB_WORKSPACE" upstream/.venv/bin/python -m stage2.native_smoke --probe X4 --out-root stage2_smoke --code-commit "$CODE_SHA"
          elif [ "${{ matrix.probe }}" = X6 ]; then
            python -m stage2.native_smoke --probe X6 --out-root stage2_smoke --code-commit "$CODE_SHA" --upstream upstream
          else
            python -m stage2.native_smoke --probe "${{ matrix.probe }}" --out-root stage2_smoke --code-commit "$CODE_SHA"
          fi
      - name: Upload native smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-native-smoke-${{ matrix.probe }}-${{ github.run_id }}
          path: stage2_smoke/${{ matrix.probe }}
          retention-days: 30
          if-no-files-found: error

  gate:
    needs: native-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: stage2-native-smoke-*-${{ github.run_id }}
          path: stage2_smoke
          merge-multiple: false
      - name: Normalize downloaded smoke tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p normalized
          for d in stage2_smoke/stage2-native-smoke-*-${{ github.run_id }}; do
            probe="$(basename "$d" | sed -E 's/stage2-native-smoke-(X[0-9])-.*$/\1/')"
            test -f "$d/events.jsonl"
            mv "$d" "normalized/$probe"
          done
          rm -rf stage2_smoke
          mv normalized stage2_smoke
      - name: Build and verify fail-closed runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          CODE_SHA="$(git rev-parse HEAD)"
          python -m stage2.build_runtime_manifest --smoke-root stage2_smoke --code-commit "$CODE_SHA" --out stage2_smoke/runtime_manifest.json
          python -m stage2.preflight --runtime-manifest stage2_smoke/runtime_manifest.json --captures-root stage2_smoke
      - name: Upload verified runtime manifest
        uses: actions/upload-artifact@v4
        with:
          name: stage2-runtime-manifest-${{ github.run_id }}
          path: stage2_smoke/runtime_manifest.json
          retention-days: 30
          if-no-files-found: error
